<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipment — DJ Network's</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-17" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-08-17" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-08-17">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-08-17">
<!-- tokens.css first: it defines every custom property style.css then reads. Two <link>s and
     not an @import, because an @import inside style.css would serialise the two fetches. -->
<link rel="stylesheet" href="tokens.css?v=2026-09-08-17">
<link rel="stylesheet" href="style.css?v=2026-09-08-17">
<!-- Vendored, not a CDN. Classic + defer, so it executes before the deferred module
     below that needs window.supabase. -->
<script src="vendor/supabase.js?v=2026-09-08-17" defer></script>
<script src="boot.js?v=2026-09-08-17" defer></script>
</head>
<body>
<div id="chrome"></div>
<!-- Real waiting state in the HTML. The module that paints everything else is itself loaded over
     the network; see boot.js. -->
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>
<div id="sheet-host"></div>

<script type="module">
import { sb, $, $$, esc, money, chrome, requireSession, stateBlock, errorBlock, toast,
         openSheet, focusField, fmtDate, todayLocal, networkMessage, initOffline,
         revealActiveTab, cardList, loadPermissions, publicUrl, signedPhotoUrl }
  from './app.js?v=2026-09-08-17';

$('#chrome').innerHTML = chrome('units.html');
revealActiveTab();

// Every screen is product-first (rule 8). Chachu's stickers carry a bare piece number with no
// product code, so a sticker alone identifies nothing — you pick the product, then the number.
// There is deliberately no unit-ID entry point anywhere on this screen.

let PRODUCTS = [], LOCS = [], STOCK = new Map(), SELECTED = null, UNITS = [];
// Every numbered product, before ?status= narrows it. Kept so the screen can tell "you own no
// numbered products" apart from "nothing is in that state today" — they look identical once
// PRODUCTS is empty, and they are opposite pieces of news.
let ALL_NUMBERED = [];
let STATUS_FILTER = null;
const COSTS = new Map();

// Guards the one race that can lie about the shelf: pick product A, pick product B before A's
// rows come back, and A's pieces render under B's heading. On a godown link that is not a
// theoretical ordering problem, and the wrong answer is "these boxes are available".
let bodyToken = 0;

initOffline();

requireSession(async () => { await loadPermissions(); await boot(); });

async function boot() {
  $('#app').innerHTML = `
    <div class="row row--between">
      <div><h1>Equipment</h1>
        <p class="sub">Numbered boxes. Tap one to see its pieces.</p></div>
      <button class="btn btn--primary" id="bulk" hidden>Add pieces</button>
    </div>
    <div id="picker"></div>
    <div id="body" class="skeleton"><div class="skeleton__row"></div><div class="skeleton__row"></div></div>`;
  $('#bulk').addEventListener('click', () => openBulk(SELECTED));
  await load();
}

async function load() {
  $('#body').className = 'skeleton';
  $('#body').innerHTML = '<div class="skeleton__row"></div><div class="skeleton__row"></div>';
  try {
    const [prods, locs, custs, vends, stock] = await Promise.all([
      sb.from('product').select('*').eq('active', true).order('short_code'),
      // NOT filtered to active here. A piece standing at a location that was later deactivated
      // still has to say where it is; filtering the lookup list made 'Where' read '—', which is
      // the same thing the screen shows for a piece with no movement at all. Only the intake
      // PICKER is restricted to active locations, further down.
      sb.from('location').select('id,name,type,active').order('name'),
      // Names for the piece sheet: a movement's destination is an id and 'who has it' is the
      // whole question. Fetched once with everything else rather than per piece opened.
      sb.from('customer').select('id,name,business_name'),
      sb.from('vendor').select('id,name'),
      sb.from('v_product_stock').select('*'),
    ]);
    for (const r of [prods, locs, stock]) if (r.error) throw r.error;
    // Names are a nicety for one sheet; a failure here must not stop the equipment list.
    for (const c of (custs.error ? [] : custs.data ?? [])) CUSTOMER_NAMES.set(c.id, c.business_name || c.name);
    for (const v of (vends.error ? [] : vends.data ?? [])) VENDOR_NAMES.set(v.id, v.name);
    // Only numbered-piece products have pieces at all. Offering a cable here would be offering
    // to create piece numbers for something that has none (rule 13).
    PRODUCTS = (prods.data ?? []).filter(p => p.tracking_mode === 'unit');
    ALL_NUMBERED = PRODUCTS;
    LOCS = locs.data ?? [];
    STOCK = new Map((stock.data ?? []).map(s => [s.product_id, s]));

    // Landed on from a Today tile: show only the products that actually have a piece in that
    // state, so "5 out" leads to the five and not to the whole catalogue.
    STATUS_FILTER = new URLSearchParams(location.search).get('status');
    if (STATUS_FILTER) {
      const col = STATUS_FILTER === 'out' ? 'units_out'
                : STATUS_FILTER === 'at_repair' ? 'units_at_repair' : null;
      if (col) PRODUCTS = PRODUCTS.filter(p => Number(STOCK.get(p.id)?.[col] ?? 0) > 0);
    }

    const wanted = new URLSearchParams(location.search).get('product');
    SELECTED = PRODUCTS.find(p => p.id === wanted) ?? null;
    renderPicker();
    // A deep link that names a product this screen cannot show must say so. Silently falling
    // back to "Pick a product" reads as a broken link.
    if (wanted && !SELECTED && PRODUCTS.length) {
      toast('That product is not tracked as numbered pieces, or is no longer active.', 'error');
    }
    await renderBody();
  } catch (err) {
    $('#body').className = '';
    $('#body').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
}

/** What the ?status= tile narrowed this screen to, and the way back out of it. */
const filterLabel = () => STATUS_FILTER === 'out' ? 'out with a customer' : 'at a repair shop';
const filterNote = () => `<div class="note" style="margin-bottom:8px">
    Showing only equipment with something ${filterLabel()}.
    <a href="units.html">Show all equipment</a>.</div>`;

// BROWSE FIRST. This screen used to show a dropdown and the words "Pick a product" — nothing at
// all until you already knew what you wanted, on the screen whose whole job is telling you what
// you own. Now the equipment arrives as cards, with the photograph and the counts that matter, and
// picking one drills in. Product-first is preserved (rule 8): a card IS a product, and a sticker
// carrying a bare "3" still belongs to nothing on its own.
function renderPicker() {
  const host = $('#picker');
  // A ?status= filter that matched nothing still has to leave a way back. This returned early and
  // wiped the note, so the only route off units.html?status=at_repair on a day when nothing is at
  // a repair shop — the ordinary day — was the nav.
  if (!PRODUCTS.length) { host.innerHTML = STATUS_FILTER ? filterNote() : ''; return; }

  if (SELECTED) {
    host.innerHTML = `<div class="row" style="margin-bottom:8px">
      <button class="btn btn--sm" id="all-equipment" type="button">← All equipment</button>
      <strong>${esc(SELECTED.short_code)} — ${esc(SELECTED.brand ? SELECTED.brand + ' ' : '')}${esc(SELECTED.model_name)}</strong>
    </div>`;
    $('#all-equipment').addEventListener('click', () => pick(null));
    $('#bulk').hidden = false;
    return;
  }

  $('#bulk').hidden = true;
  host.innerHTML = `${STATUS_FILTER ? filterNote() : ''}
    <label class="field" style="margin-bottom:8px">
      <input class="field__input" id="q" type="search" placeholder="Search code, brand or model…"
             autocapitalize="none" spellcheck="false" enterkeyhint="search">
    </label><div id="prod-cards"></div>`;
  const paint = () => {
    const q = ($('#q').value || '').trim().toLowerCase();
    const rows = PRODUCTS.filter(p => !q ||
      [p.short_code, p.brand, p.model_name].some(v => (v || '').toLowerCase().includes(q)));
    if (!rows.length) {
      $('#prod-cards').className = '';
      $('#prod-cards').innerHTML = `<p class="field__hint">Nothing matches that.</p>`;
      return;
    }
    cardList($('#prod-cards'), rows, p => {
      const st = STOCK.get(p.id);
      const out = Number(st?.units_out ?? 0), rep = Number(st?.units_at_repair ?? 0);
      return {
        thumb: p.image_url ? publicUrl(p.image_url) : null,
        code: p.short_code || '?',
        title: esc(p.brand ? p.brand + ' ' : '') + esc(p.model_name),
        sub: `${esc(p.short_code)} · ${esc(st?.units_active ?? 0)} piece${(st?.units_active ?? 0) === 1 ? '' : 's'}`
           + (out ? ` · <strong>${esc(out)} out</strong>` : '')
           + (rep ? ` · <span class="badge badge--at_repair">${esc(rep)} at repair</span>` : ''),
        right: `<strong style="font-size:13px">${esc(st?.units_on_hand ?? 0)}</strong>
                <span class="item__meta">on shelf</span>`,
      };
    }, p => pick(p));
  };
  $('#q').addEventListener('input', paint);
  paint();
}

async function pick(p) {
  SELECTED = p;
  const u = new URL(location.href);
  if (p) u.searchParams.set('product', p.id); else u.searchParams.delete('product');
  history.replaceState(null, '', u);
  renderPicker();
  await renderBody();
}

async function renderBody() {
  const body = $('#body');
  const token = ++bodyToken;

  // A ?status= filter that matched nothing is GOOD NEWS, and it was reported as the day-one state
  // below: land on units.html?status=at_repair on a day when nothing is at a repair shop — which
  // is most days — and the screen read "No numbered products yet" over a catalogue of seven, and
  // offered to go and create the first one. An empty filter and an empty catalogue are opposite
  // pieces of news and must never share a state block.
  if (!PRODUCTS.length && STATUS_FILTER && ALL_NUMBERED.length) {
    body.className = '';
    body.innerHTML = stateBlock({
      icon: '✅',
      title: STATUS_FILTER === 'out' ? 'Nothing is out with a customer' : 'Nothing is at a repair shop',
      body: `Every numbered piece of the ${ALL_NUMBERED.length} product${ALL_NUMBERED.length === 1 ? '' : 's'} `
          + 'you own is accounted for somewhere else.',
      actionLabel: 'Show all equipment', actionId: 'show-all',
    });
    $('#show-all').addEventListener('click', () => location.href = 'units.html');
    return;
  }

  // Day-one state: no numbered products exist at all. This is the FIRST thing this screen ever
  // shows in production, so it names what is missing and links to the thing that fixes it.
  if (!PRODUCTS.length) {
    body.className = '';
    body.innerHTML = stateBlock({
      icon: '🏷️',
      title: 'No numbered products yet',
      body: 'Pieces belong to a product, so a product has to exist first — and it has to be one tracked '
          + 'as numbered pieces. Cables and fog fluid are counted instead, and never get piece numbers.',
      actionLabel: 'Go to Products', actionId: 'go-products',
    });
    $('#go-products').addEventListener('click', () => location.href = 'products.html?new=1');
    return;
  }

  // Nothing selected is no longer a dead end: the cards above ARE the screen.
  if (!SELECTED) { body.className = ''; body.innerHTML = ''; return; }

  body.className = 'skeleton';
  body.innerHTML = '<div class="skeleton__row"></div><div class="skeleton__row"></div>';

  // Status comes from the view; purchase_cost is a plain master field on unit and is read
  // alongside it. The client merges them for display and derives nothing.
  const [statusRes, costRes] = await Promise.all([
    sb.from('v_unit_status')
      .select('unit_id,piece_no,condition,lifecycle,status,at_kind,at_id,last_moved_on,days_in_place')
      .eq('product_id', SELECTED.id)
      .order('piece_no'),
    sb.from('unit').select('id,purchase_cost').eq('product_id', SELECTED.id),
  ]);

  if (token !== bodyToken) return;   // a newer product was picked while this was in flight

  // Both reads are checked. costRes.error used to be dropped on the floor, and a failed cost
  // query is indistinguishable from every piece having no cost recorded — a whole column of
  // em-dashes that looks like data rather than like a failure.
  if (statusRes.error || costRes.error) {
    body.className = '';
    body.innerHTML = errorBlock(statusRes.error || costRes.error, 'retry2');
    $('#retry2').addEventListener('click', renderBody);
    return;
  }

  COSTS.clear();
  for (const c of (costRes.data ?? [])) COSTS.set(c.id, c.purchase_cost);
  UNITS = statusRes.data ?? [];
  body.className = '';

  // A product that exists but has no pieces yet — the state right after adding a product.
  if (!UNITS.length) {
    body.innerHTML = stateBlock({
      icon: '📦',
      title: `${SELECTED.short_code} has no pieces yet`,
      body: 'Add them all at once: enter how many, pick where they live, and each one is numbered and '
          + 'given an opening movement so it can never exist without a location.',
      actionLabel: 'Add pieces', actionId: 'empty-bulk',
    });
    $('#empty-bulk').addEventListener('click', () => openBulk(SELECTED));
    return;
  }

  const s = STOCK.get(SELECTED.id);
  const locName = id => LOCS.find(l => l.id === id)?.name ?? 'an unknown location';
  const where = u => u.at_kind === 'location' ? locName(u.at_id)
    : u.at_kind === 'customer' ? 'with a customer'
    : u.at_kind === 'vendor' ? 'at a repair shop' : 'no movement recorded';

  // Bulk create writes N units and then N movements in two PostgREST calls, and PostgREST cannot
  // wrap two tables in one transaction. If the second call fails the pieces exist with no
  // location — and unit rows can never be deleted (0007). v_unit_status calls that `not_recorded`.
  // Derived from the view rather than remembered from the failed submit, so it survives a refresh
  // and is still there tomorrow morning.
  const stranded = UNITS.filter(u => u.status === 'not_recorded');

  body.innerHTML = `
    ${stranded.length ? `<div class="note note--bad" style="margin-bottom:12px">
      ${stranded.length === 1 ? 'Piece' : 'Pieces'}
      ${esc(stranded.map(u => u.piece_no).join(', '))}
      ${stranded.length === 1 ? 'has' : 'have'} no location recorded, so
      ${stranded.length === 1 ? 'it is' : 'they are'} counted neither on the shelf nor out.
      This happens when the pieces are created but their opening movement is not.
      <div style="margin-top:10px"><button class="btn" id="fix-stranded" type="button">Set their location</button></div>
    </div>` : ''}
    <div class="stats stats--count">
      ${[['On the shelf', s?.units_on_hand ?? 0], ['Out', s?.units_out ?? 0],
         ['At repair', s?.units_at_repair ?? 0], ['Retired', s?.units_retired ?? 0],
         ['Lost', s?.units_lost ?? 0]]
        .map(([k, v]) => `<div class="card">
          <div class="item__meta">${esc(k)}</div><div class="stat__n">${v}</div></div>`).join('')}
    </div>
    <div class="card table-wrap scroll-x">
      <table class="data">
        <thead><tr><th>Piece</th><th>Status</th><th>Where</th><th>Condition</th><th>Since</th><th>Cost</th></tr></thead>
        <tbody>${UNITS.map(u => `
          <tr class="tappable unit-row" data-unit="${esc(u.unit_id)}" data-piece="${esc(u.piece_no)}">
            <td data-label="Piece"><strong>${esc(u.piece_no)}</strong></td>
            <td data-label="Status"><span class="badge badge--${esc(u.status)}">${esc(u.status.replace('_', ' '))}</span></td>
            <td data-label="Where">${esc(where(u))}</td>
            <td data-label="Condition">${esc((u.condition || '').replace('_', ' '))}</td>
            <!-- One element, not a text node plus a span: on a phone the cell is a two-column
                 grid and a bare text node made the "(24d)" a third grid item on its own line. -->
            <td data-label="Since"><span>${esc(fmtDate(u.last_moved_on))}${
              u.days_in_place != null ? ` <span class="item__meta">(${esc(u.days_in_place)}d)</span>` : ''}</span></td>
            <td data-label="Cost">${esc(unitCost(u.unit_id))}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="field__hint">Tap a piece for where it is, who has it and everything that has happened
      to it. A piece is out because no return has been recorded against it — never because a date has
      passed. Piece numbers are never reused: a retired or lost number stays dead.</p>`;
  $$('.unit-row').forEach(r => r.addEventListener('click', () => openPiece(r.dataset.unit, r.dataset.piece)));

  $('#fix-stranded')?.addEventListener('click', () => openSetLocation(stranded));
}

const unitCost = id => (COSTS.get(id) ?? null) === null ? '—' : money(COSTS.get(id));

/** Active locations only — the ones a piece can actually be put into today. */
const activeLocs = () => LOCS.filter(l => l.active);

// ---------------------------------------------------------------------------
// ONE PIECE: where it is, who has it, and what has happened to it.
//
// v_unit_history is the human view added by 0019 — it keeps corrected movements and the
// corrections themselves, flagged rather than hidden, because a history with a hole in it is
// worse than one with a crossing-out. This is the screen it was built for.
// ---------------------------------------------------------------------------
async function openPiece(unitId, pieceNo) {
  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="pc-title" tabindex="-1">
      <div class="sheet__head">
        <h2 class="sheet__title" id="pc-title">${esc(SELECTED?.short_code ?? '')} · piece ${esc(pieceNo)}</h2>
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
      </div>
      <div id="pc-body"><div class="skeleton"><div class="skeleton__row"></div></div></div>
      <div class="sheet__foot"><button class="btn" data-sheet-close type="button">Close</button></div>
    </div>
  </div>`);

  const [st, hist] = await Promise.all([
    sb.from('v_unit_status').select('*').eq('unit_id', unitId).maybeSingle(),
    sb.from('v_unit_history').select('*').eq('unit_id', unitId)
      .order('moved_on', { ascending: false }).order('created_at', { ascending: false }),
  ]);
  if (st.error || hist.error) {
    $('#pc-body').innerHTML = errorBlock(st.error || hist.error);
    return;
  }
  const u = st.data;
  const rows = hist.data ?? [];
  // WHO HAS IT. at_kind says whether the destination is one of our locations, a customer or a
  // repair shop; the name comes from whichever table that is.
  const holder = u?.at_kind === 'customer'
    ? (CUSTOMER_NAMES.get(u.at_id) ?? 'a customer')
    : u?.at_kind === 'vendor' ? (VENDOR_NAMES.get(u.at_id) ?? 'a repair shop')
    : (LOCS.find(l => l.id === u?.at_id)?.name ?? '—');

  const label = { intake: 'Taken into stock', dispatch: 'Sent out', return: 'Came back',
                  transfer: 'Moved', repair_out: 'Sent for repair', repair_in: 'Back from repair',
                  write_off: 'Written off', found: 'Found', correction: 'Correction' };

  $('#pc-body').innerHTML = `
    <div class="card card--sunk">
      <div class="row" style="gap:6px"><span class="badge badge--${esc(u?.status ?? 'not_recorded')}">${esc((u?.status ?? 'not recorded').replace('_',' '))}</span>
        <span class="badge badge--muted">${esc((u?.condition ?? '').replace('_',' '))}</span></div>
      <p style="margin:6px 0 0;line-height:1.6">
        ${u?.at_kind === 'customer' ? 'With' : u?.at_kind === 'vendor' ? 'At' : 'At'}
        <strong>${esc(holder)}</strong>
        ${u?.last_moved_on ? `since ${esc(fmtDate(u.last_moved_on))}` : ''}
        ${u?.days_in_place != null ? `<span class="item__meta">(${esc(u.days_in_place)} days)</span>` : ''}
      </p>
    </div>
    <div class="card">
      <strong>Everything that has happened</strong>
      <div class="list" style="margin-top:6px">${rows.map(h => `
        <div class="item" style="cursor:default;${h.is_corrected ? 'opacity:.6' : ''}">
          <span class="item__main">
            <span class="item__title">${esc(label[h.movement_type] ?? h.movement_type)}
              ${h.is_corrected ? '<span class="badge badge--corrected">corrected</span>' : ''}
              ${h.is_correction ? '<span class="badge badge--muted">annotation</span>' : ''}</span>
            <span class="item__meta">${esc(fmtDate(h.moved_on))}${h.order_no ? ' · ' + esc(h.order_no) : ''}${
              h.condition_at_move ? ' · ' + esc(h.condition_at_move.replace('_',' ')) : ''}</span>
            ${h.is_corrected ? `<span class="item__meta">Taken back${
              h.correction_reason ? ': ' + esc(h.correction_reason) : ''}</span>` : ''}
            ${h.notes && !h.is_correction ? `<span class="item__meta">${esc(h.notes)}</span>` : ''}
            ${photoLine(h)}
          </span>
        </div>`).join('') || '<p class="field__hint">Nothing recorded yet.</p>'}</div>
      <p class="field__hint">A corrected movement stays here, greyed and marked, with the reason
        beside it — never removed. That is what makes an undo safe to have.</p>
    </div>`;

  // Signed links are minted only when a photograph is actually opened. Doing it during the render
  // above would mint one per row on every sheet open, and each link is a bearer token with a
  // two-minute life — cheaper and safer to ask when somebody asks.
  $$('.pc-shots').forEach(b => b.addEventListener('click', () => showShots(b)));
}

// ---------------------------------------------------------------------------
// DAMAGE EVIDENCE ON THE PIECE SHEET (0028).
//
// RULE 14, WEARING A PHOTOGRAPH. photo_count comes back for everybody, `photos` only for
// returns.write or ledger.view — and it is NULL, not [], when it is withheld. So this can say
// "2 photos · not visible from this account", which is a refusal somebody can act on, instead of
// showing nothing and letting the account conclude that nobody photographed the damage.
// ---------------------------------------------------------------------------
function photoLine(h) {
  if (!h.photo_count) return '';
  const n = `${h.photo_count} photo${h.photo_count === 1 ? '' : 's'}`;
  if (h.photos == null) {
    return `<span class="item__meta">${n} · not visible from this account</span>`;
  }
  return `<button type="button" class="btn btn--ghost btn--sm pc-shots"
            data-paths="${esc(JSON.stringify(h.photos.map(x => x.path)))}">${n}</button>
          <span class="pc-strip thumbs"></span>`;
}

async function showShots(btn) {
  const strip = btn.parentElement.querySelector('.pc-strip');
  if (strip.childElementCount) { strip.innerHTML = ''; btn.classList.remove('is-open'); return; }
  btn.disabled = true;
  const paths = JSON.parse(btn.dataset.paths);
  const urls = await Promise.all(paths.map(x => signedPhotoUrl(x)));
  btn.disabled = false; btn.classList.add('is-open');
  strip.innerHTML = urls.map((u, i) => u
    // NOT loading="lazy". These appear only after somebody taps "1 photo" — they have already
    // asked to see them, and inside the sheet the lazy loader never fired: the <img> sat 84px wide
    // and visible with naturalWidth 0 for ever, while the signed URL it held answered 200.
    ? `<div class="thumb"><img src="${esc(u)}" alt="Damage photo ${i + 1}" decoding="async"></div>`
    : `<div class="thumb"><div class="thumb__missing">no access</div></div>`).join('');
}

const CUSTOMER_NAMES = new Map();
const VENDOR_NAMES = new Map();

const locationField = (id) => activeLocs().length
  ? `<select class="field__select" id="${id}">
       ${activeLocs().map(l => `<option value="${esc(l.id)}">${esc(l.name)} (${esc(l.type)})</option>`).join('')}
     </select>`
  // Without this the select rendered with zero options and the only feedback was a toast saying
  // "Pick a location" over an empty dropdown — a dead end, because there is no Locations screen
  // yet to go and fix it on.
  : `<div class="note note--warn">There are no active locations, so a piece has nowhere to be put.
       Add one in Supabase (table <code>location</code>) before creating pieces.</div>`;

// ---------------------------------------------------------------------------
// BULK CREATE — the primary path, and the thing that makes intake survivable.
//
// docs/structure.md form 3: enter the product once, answer "how many pieces?", and six units
// appear numbered sequentially at a location set once, each inheriting the product's default cost.
// Hundreds of boxes become roughly 150 product rows and a number. Demanding a serial number and a
// rupee figure per box during the godown walk is exactly the task that stalls at unit 40.
// ---------------------------------------------------------------------------

let bulkOpening = false;

async function openBulk(product) {
  if (!product) { toast('Pick a product first.', 'error'); return; }
  if (bulkOpening) return;             // two taps on a slow link opened two sheets
  bulkOpening = true;

  // The sheet cannot be drawn until the database says which numbers are free, and on a bad link
  // that wait is seconds long. Say so on the button rather than leaving it looking tappable and
  // dead.
  const trigger = $('#bulk');
  const triggerText = trigger?.textContent;
  if (trigger) { trigger.disabled = true; trigger.textContent = 'Opening…'; }
  const restore = () => {
    bulkOpening = false;
    if (trigger) { trigger.disabled = false; trigger.textContent = triggerText; }
  };

  // Piece numbers continue from the highest ever used, so a retired or lost number is skipped
  // rather than reissued (rule 4: history stays attached to the physical object).
  const { data: existing, error } = await sb.from('unit')
    .select('piece_no,lifecycle').eq('product_id', product.id).order('piece_no', { ascending: false });
  restore();
  if (error) { toast(networkMessage(error) ?? friendlyUnit(error), 'error'); return; }

  const highest = existing?.length ? existing[0].piece_no : 0;
  const dead = (existing ?? []).filter(u => u.lifecycle !== 'active').map(u => u.piece_no);
  const nextNo = highest + 1;
  const canCreate = activeLocs().length > 0;

  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="bulk-title" tabindex="-1">
      <div class="sheet__head">
        <h2 class="sheet__title" id="bulk-title">Add pieces — ${esc(product.short_code)}</h2>
        <!-- A visible word, not a glyph. The design bible's language rule: "an unlabelled icon
             asks the user to guess", and for this audience an icon-only control creates a guess
             rather than a confident tap. It no longer needs an aria-label — the text IS the name. -->
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
      </div>

      <div class="grid2">
        <!-- A div, not a <label>, because it now contains buttons. A click inside a <label>
             forwards to the labelled control, and on a phone that means the chip that exists to
             AVOID the keyboard would have opened it. -->
        <div class="field"><label class="field__label" for="f-count">How many pieces? *</label>
          <input class="field__input" id="f-count" type="number" min="1" max="200" step="1"
                 inputmode="numeric" enterkeyhint="done" value="1">
          <!-- Tap-to-choose over type-to-fill (design bible, Form Pattern). The box starts at 1,
               so every real intake used to mean tapping the field, clearing the 1 and typing —
               with the on-screen keyboard covering the preview that says what is about to be
               created. These are the counts a van actually arrives with; anything else is still
               typed. -->
          <div class="pill-row" style="margin:8px 0 0">
            ${[2, 4, 6, 8, 10, 12].map(n =>
              `<button class="btn btn--sm count-chip" type="button" data-n="${n}">${n}</button>`).join('')}
          </div>
          <span class="field__hint">Up to 200 at a time.</span>
        </div>
        <label class="field"><span class="field__label">Where do they live? *</span>
          ${locationField('f-loc')}
          <span class="field__hint">Each piece gets an opening movement here, so none exists without a location.</span>
        </label>
      </div>

      <div class="note" id="preview"></div>
      ${dead.length ? `<div class="note note--warn" style="margin-top:10px">
        Piece ${dead.length === 1 ? 'number' : 'numbers'} ${esc(dead.join(', '))}
        ${dead.length === 1 ? 'is' : 'are'} retired or lost and will not be reused. Numbering continues from ${esc(nextNo)}.
      </div>` : ''}

      <div class="grid2" style="margin-top:14px">
        <label class="field"><span class="field__label">Purchase cost each (₹)</span>
          <input class="field__input" id="f-cost" type="number" step="0.01" min="0" inputmode="decimal"
                 value="${esc(product.default_purchase_cost ?? '')}">
          <span class="field__hint">Inherited from the product so nothing is ever blank. Correct it per piece later.</span>
        </label>
        <label class="field"><span class="field__label">Purchase date</span>
          <!-- max=today: a mistyped year puts the purchase in the future, and v_unit_utilisation
               divides by days owned. -->
          <input class="field__input" id="f-date" type="date" max="${todayLocal()}">
        </label>
        <label class="field"><span class="field__label">Condition</span>
          <select class="field__select" id="f-cond">
            ${['good', 'minor_wear', 'needs_attention', 'damaged', 'not_working']
              .map(c => `<option value="${c}">${c.replace('_', ' ')}</option>`).join('')}
          </select>
          <span class="field__hint">How the box actually is. Separate from where it is (rule 3).</span>
        </label>
        <label class="field"><span class="field__label">Ownership</span>
          <select class="field__select" id="f-own">
            <option value="owned">owned</option><option value="sub_hired">sub-hired</option>
          </select>
        </label>
      </div>
      <label class="field"><span class="field__label">Note (applied to every piece)</span>
        <input class="field__input" id="f-notes" placeholder="e.g. bought from Sound Center, Sept 2026"></label>

      <div class="sheet__foot">
        <button class="btn" data-sheet-close type="button">Cancel</button>
        <button class="btn btn--primary" id="create" type="button" ${canCreate ? '' : 'disabled'}>Create pieces</button>
      </div>
    </div>
  </div>`);

  const clampCount = () => {
    const el = $('#f-count');
    const n = Math.max(1, Math.min(200, Math.floor(Number(el.value) || 1)));
    // Written back into the field, so what he reads and what the preview promises can never
    // disagree — typing 500 used to leave "500" on screen under a preview offering 200.
    if (String(n) !== el.value) el.value = String(n);
    return n;
  };

  // Exactly what is about to be written, in the numbers it will be written under, before he taps.
  const drawPreview = (n) => {
    $('#preview').innerHTML = n === 1
      ? `This creates <strong>piece ${nextNo}</strong> — one new box, numbered and given an opening movement.`
      : `This creates <strong>${n} pieces, numbered ${nextNo} to ${nextNo + n - 1}</strong>,
         each with an opening movement.`;
  };
  // Clamping on every keystroke fights the operator mid-type ("20" becomes "2" then "20"), so the
  // preview follows him while typing and the field is corrected only when he leaves it.
  $('#f-count').addEventListener('input', () =>
    drawPreview(Math.max(1, Math.min(200, Math.floor(Number($('#f-count').value) || 1)))));
  $('#f-count').addEventListener('change', () => drawPreview(clampCount()));
  $$('.count-chip').forEach(b => b.addEventListener('click', () => {
    $('#f-count').value = b.dataset.n;
    drawPreview(clampCount());
  }));
  drawPreview(clampCount());

  $('#create')?.addEventListener('click', async () => {
    const btn = $('#create');
    if (btn.disabled) return;          // the guard against a double tap landing twice
    const n = clampCount();
    const locId = $('#f-loc')?.value;
    if (!locId) { toast('Pick a location.', 'error'); focusField('#f-loc'); return; }

    const cost = $('#f-cost').value === '' ? null : Number($('#f-cost').value);
    const date = $('#f-date').value || null;
    const units = Array.from({ length: n }, (_, i) => ({
      product_id: product.id,
      piece_no: nextNo + i,
      purchase_cost: cost,
      purchase_date: date,
      condition: $('#f-cond').value,
      ownership: $('#f-own').value,
      notes: $('#f-notes').value.trim() || null,
    }));

    btn.disabled = true; btn.textContent = 'Creating…';
    const reenable = () => { btn.disabled = false; btn.textContent = 'Create pieces'; };

    let ins;
    try {
      ins = await sb.from('unit').insert(units).select('id,piece_no');
    } catch (thrown) { ins = { error: thrown }; }
    if (ins.error) {
      reenable();
      toast(networkMessage(ins.error) ?? friendlyUnit(ins.error), 'error');
      return;
    }

    // Opening movements. PostgREST cannot wrap two tables in one transaction, so if this second
    // write fails the pieces exist without a location — and unit rows cannot be deleted (0007).
    // That is reported precisely rather than swallowed, and the pieces it strands are picked up
    // again by the `not_recorded` banner in renderBody, which reads the view rather than trusting
    // anything this submit remembered.
    const movements = ins.data.map(u => ({
      movement_type: 'intake',
      unit_id: u.id,
      product_id: product.id,
      qty: 1,
      to_kind: 'location',
      to_id: locId,
      // Explicit, not the column default. The default is the SERVER's current_date, which is UTC:
      // anything entered before 05:30 IST would be filed under yesterday, and a rental day is a
      // calendar convention, not a clock one.
      moved_on: todayLocal(),
      notes: 'opening stock',
    }));
    let mv;
    try {
      mv = await sb.from('movement').insert(movements);
    } catch (thrown) { mv = { error: thrown }; }

    const first = ins.data[0].piece_no, last = ins.data[ins.data.length - 1].piece_no;
    if (mv.error) {
      sheet.close();
      await load();
      toast(`${ins.data.length === 1 ? `Piece ${first} was` : `Pieces ${first}–${last} were`} created, `
          + `but the location could not be saved. Use “Set their location” on the red banner to finish. `
          + `Do not add them again — the numbers are already used.`, 'error');
      return;
    }

    toast(n === 1 ? `Piece ${nextNo} created.` : `${n} pieces created, numbered ${nextNo}–${nextNo + n - 1}.`);
    sheet.close();
    await load();
  });
}

// ---------------------------------------------------------------------------
// The repair path for a half-finished intake.
//
// Rule 4 means the piece numbers cannot be given back and 0007 means the rows cannot be deleted,
// so "try again" is the wrong instruction — it would burn a second block of numbers on the same
// boxes. The only correct fix is to give the pieces that already exist their opening movement,
// which is exactly what this does.
// ---------------------------------------------------------------------------

function openSetLocation(stranded) {
  const nums = stranded.map(u => u.piece_no).join(', ');
  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="loc-title" tabindex="-1">
      <div class="sheet__head">
        <h2 class="sheet__title" id="loc-title">Set location — ${esc(SELECTED.short_code)}</h2>
        <!-- A visible word, not a glyph. The design bible's language rule: "an unlabelled icon
             asks the user to guess", and for this audience an icon-only control creates a guess
             rather than a confident tap. It no longer needs an aria-label — the text IS the name. -->
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
      </div>
      <p>Records an opening movement for piece${stranded.length === 1 ? '' : 's'}
         <strong>${esc(nums)}</strong>. No new pieces are created and no number is used up.</p>
      <label class="field"><span class="field__label">Where are they? *</span>
        ${locationField('f-fixloc')}</label>
      <div class="sheet__foot">
        <button class="btn" data-sheet-close type="button">Cancel</button>
        <button class="btn btn--primary" id="fix-go" type="button"
          ${activeLocs().length ? '' : 'disabled'}>Record location</button>
      </div>
    </div>
  </div>`);

  $('#fix-go')?.addEventListener('click', async () => {
    const btn = $('#fix-go');
    if (btn.disabled) return;
    const locId = $('#f-fixloc')?.value;
    if (!locId) { toast('Pick a location.', 'error'); focusField('#f-fixloc'); return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    let res;
    try {
      res = await sb.from('movement').insert(stranded.map(u => ({
        movement_type: 'intake',
        unit_id: u.unit_id,
        product_id: SELECTED.id,
        qty: 1,
        to_kind: 'location',
        to_id: locId,
        moved_on: todayLocal(),
        notes: 'opening stock (recorded after intake)',
      })));
    } catch (thrown) { res = { error: thrown }; }
    if (res.error) {
      btn.disabled = false; btn.textContent = 'Record location';
      toast(networkMessage(res.error) ?? friendlyUnit(res.error), 'error');
      return;
    }
    toast(stranded.length === 1 ? `Piece ${nums} now has a location.` : `Pieces ${nums} now have a location.`);
    sheet.close();
    await load();
  });
}

function friendlyUnit(e) {
  const m = e.message || String(e);
  if (m.includes('unit_product_id_piece_no_key'))
    return 'One of those piece numbers already exists. Close this and open “Add pieces” again — '
         + 'numbering restarts from the highest number used.';
  if (m.includes('cannot be read from this session'))
    return 'That product could not be read. Sign in again, or reload — it may have been edited elsewhere.';
  if (e.code === '42501' || m.includes('row-level security'))
    return 'You are not signed in, or the session expired. Sign in again.';
  return m;
}

// Test hook — lets the empty states be exercised for real rather than reasoned about.
window.__djn = {
  showNoProducts() { PRODUCTS = []; SELECTED = null; renderPicker(); renderBody(); },
  showNoPieces() { UNITS = []; SELECTED = PRODUCTS[0] ?? SELECTED; renderPicker(); renderBody(); },
  reload: load,
};
</script>
</body>
</html>
