<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { sb, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock, errorBlock,
         initOffline, revealActiveTab, loadPermissions, can, initNav }
  from './app.js?v=2026-09-08-32';

$('#chrome').innerHTML = chrome('reports.html');
revealActiveTab();
initNav();
initOffline();

// ---------------------------------------------------------------------------
// REPORTS — one read-only dashboard, built from reference/design/reports-mockup.html
// and docs/reports-spec.md.
//
// It replaces analysis.html rather than sitting beside it. The operator asked for one report
// screen, and two would drift.
//
// THE ELEVATION LAW DECIDES THE SHAPE (v6 Law 1, and spec rule 4). Exactly ONE raised card on the
// whole screen — the money block — and everything else is flat full-width rows on hairlines. A grid
// of cards is what produced the black-border problem that was just fixed; it is not coming back.
//
// EVERY FIGURE IS READ, NOTHING IS STORED (rule 10). Nothing here is a new view either: the
// mockup's footer claims repairs-per-10-jobs "needs one new view" and that turned out to be wrong —
// repair_job joined through unit to v_unit_utilisation.times_hired gives it, measured before this
// file was written. No migration in this pass.
// ---------------------------------------------------------------------------

const PERIODS = [
  { id: 'week',  label: 'This week' },
  { id: 'month', label: 'This month' },
  { id: 'last',  label: 'Last month' },
  { id: 'year',  label: 'This year' },
];
let PERIOD = 'month';

/** Period bounds as calendar days, from the phone's local date — never current_date (0026). */
function bounds(id) {
  const t = todayLocal();
  const [y, m, d] = t.split('-').map(Number);
  const iso = (yy, mm, dd) => `${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
  if (id === 'week') {
    const dt = new Date(Date.UTC(y, m - 1, d));
    const back = (dt.getUTCDay() + 6) % 7;                 // Monday-first, the trade week
    dt.setUTCDate(dt.getUTCDate() - back);
    return { from: dt.toISOString().slice(0, 10), to: t };
  }
  if (id === 'month') return { from: iso(y, m, 1), to: t };
  if (id === 'last') {
    const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
    return { from: iso(py, pm, 1), to: iso(y, m, 1) };     // exclusive upper bound
  }
  return { from: iso(y, 1, 1), to: t };
}

let ROI = [], UTIL = [], PRODUCTS = [], CUSTOMERS = [], REPAIRS = [], UNITS = [], LEDGER = [], BAL = [], MOVES = [];

requireSession(async () => {
  await loadPermissions();
  // Rule 14: refuse in words rather than render a screen of zeros somebody would believe.
  if (!can('numbers.view')) {
    $('#app').innerHTML = `<h1>Reports</h1>` + stateBlock({
      title: 'The reports are not visible to this account',
      body: 'This account cannot see what things earn. Ask whoever manages the team.',
    });
    return;
  }
  $('#app').innerHTML = `<h1>Reports</h1>
    <div class="periods" id="periods" role="group" aria-label="Period"></div>
    <div id="body"><div class="skeleton"><div class="skeleton__row"></div>
      <div class="skeleton__row"></div><div class="skeleton__row"></div></div></div>`;
  paintPeriods();
  await load();
});

function paintPeriods() {
  $('#periods').innerHTML = PERIODS.map(p =>
    `<button class="chip${p.id === PERIOD ? ' is-on' : ''}" type="button" data-p="${esc(p.id)}"
      aria-pressed="${p.id === PERIOD}">${esc(p.label)}</button>`).join('');
  $$('#periods .chip').forEach(b => b.addEventListener('click', async () => {
    PERIOD = b.dataset.p; paintPeriods(); await load();
  }));
}

async function load() {
  const { from, to } = bounds(PERIOD);
  try {
    const [roi, util, prods, custs, reps, units, led, bal, moves] = await Promise.all([
      // The _visible wrappers, not the raw views: without numbers.view they return zero ROWS, which
      // a screen can recognise and explain, rather than zero rupees, which it cannot (rule 14).
      sb.from('v_product_roi_visible').select('*'),
      sb.from('v_unit_utilisation_visible').select('*'),
      sb.from('product').select('id,short_code,brand,model_name,tracking_mode,default_purchase_cost,pool_qty,active'),
      sb.from('v_customer_figures').select('*'),
      sb.from('repair_job').select('id,unit_id,actual_cost,date_sent'),
      sb.from('unit').select('id,product_id,lifecycle'),
      sb.from('ledger_entry').select('type,amount,entry_date,state').gte('entry_date', from).lte('entry_date', to),
      sb.from('v_customer_balance_visible').select('*'),
      // Counted stock has no pieces, so its "last moved" comes from the movement ledger.
      sb.from('v_movement_effective').select('product_id,moved_on,movement_type,qty'),
    ]);
    for (const r of [roi, util, prods, custs, reps, units, led, bal, moves]) if (r.error) throw r.error;
    ROI = roi.data ?? []; UTIL = util.data ?? []; PRODUCTS = prods.data ?? [];
    CUSTOMERS = custs.data ?? []; REPAIRS = reps.data ?? []; UNITS = units.data ?? [];
    LEDGER = led.data ?? []; BAL = bal.data ?? []; MOVES = moves.data ?? [];
    render();
  } catch (err) {
    $('#body').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
}

const prodOf = id => PRODUCTS.find(p => p.id === id);
const nameOf = p => p ? ((p.brand ? p.brand + ' ' : '') + p.model_name) : 'unknown product';
// A 2% floor so a tiny value still draws something — but ONLY for a value that is actually above
// zero. A true zero gets an empty track: drawing a sliver for 0.0% is the same lie as drawing a
// flat bar for an unknown, one decimal place smaller. MH-BEAM has earned nothing back and the bar
// says nothing back.
const pct = (n, max) => (max > 0 && n > 0) ? Math.max(2, Math.round(100 * n / max)) : 0;

function render() {
  $('#body').innerHTML = money_() + earning() + working() + customers() + breaks();
}

// ---------------------------------------------------------------------------
// MONEY — the one raised card (spec rule 4).
//
// SPEC RULE 1: Billed and Received are two numbers, side by side, never one. Revenue posts on order
// CONFIRMATION, so billed includes gear still on the shelf. The caveat line is the one sentence
// that earned its place through the text cut.
//
// SPEC RULE 2 / CLAUDE.md RULE 6: deposits held sits apart from still-to-collect and is never
// summed into an "outstanding". It is the customer's own money.
// ---------------------------------------------------------------------------
function money_() {
  const charges = ['rental', 'transport', 'labour', 'misc', 'damage'];
  const billed = LEDGER.filter(e => charges.includes(e.type)).reduce((n, e) => n + Number(e.amount || 0), 0);
  const billedN = LEDGER.filter(e => charges.includes(e.type)).length;
  const received = LEDGER.filter(e => e.type === 'payment').reduce((n, e) => n + Number(e.amount || 0), 0);
  const receivedN = LEDGER.filter(e => e.type === 'payment').length;

  // Current, not period: what is owed and what is held are states of today, not of a date range.
  // BAL is the gated wrapper, so a null means "not visible", never "nothing" (rule 14).
  const anyMoney = BAL.length > 0;
  const owed = BAL.reduce((n, b) => n + Number(b.receivable ?? 0), 0);
  const held = BAL.reduce((n, b) => n + Number(b.deposit_held ?? 0), 0);
  const oldest = CUSTOMERS.filter(c => (c.longest_unpaid_days ?? 0) > 30).length;

  const fig = (k, v, note) => `<div class="fig"><span class="fig__k">${esc(k)}</span>
    <span class="fig__v">${v}</span>${note ? `<span class="fig__n">${note}</span>` : ''}</div>`;

  return `<div class="card money">
    <div class="money__pair">
      ${fig('Billed', money(billed), `${billedN} charge${billedN === 1 ? '' : 's'}`)}
      ${fig('Received', money(received), `${receivedN} payment${receivedN === 1 ? '' : 's'}`)}
    </div>
    <div class="money__split">
      ${anyMoney
        ? fig('Still to collect', `<span class="fig__v--sm">${money(owed)}</span>`,
            oldest ? `<span class="dot"></span>${oldest} customer${oldest === 1 ? '' : 's'} over 30 days` : 'nothing over 30 days')
        : fig('Still to collect', `<span class="fig__v--sm fig__v--none">Not visible</span>`, 'needs the money permission')}
      ${anyMoney
        ? fig('Deposits held', `<span class="fig__v--sm">${money(held)}</span>`, 'customers’ money, not ours')
        : fig('Deposits held', `<span class="fig__v--sm fig__v--none">Not visible</span>`, '')}
    </div>
    <p class="money__caveat">Billed counts a job the moment it is booked, so it includes gear that
      has not gone out yet. Received is money actually in hand.</p>
  </div>`;
}

// ---------------------------------------------------------------------------
// EARNING BEST — three ROI states (spec), not two.
//
//   a number            a real bar, the percentage printed. 0% IS A REAL NUMBER when the cost is
//                       known and nothing has been earned back, and it must not hide among the
//                       unpriced ones — that product is genuinely underperforming.
//   null, unit mode     "Cost not recorded", flat inert bar, and the piece count beside it.
//   pool / consumable   "Not tracked for counted stock", same muted treatment, and the piece count
//                       SUPPRESSED — units_missing_cost is 0 for them only because they have no
//                       pieces, and "0 pieces missing cost" reads as fully costed when the truth is
//                       the view cannot see the cost at all. Rule 14 in miniature.
// ---------------------------------------------------------------------------
function earning() {
  const rows = ROI.map(r => {
    const p = prodOf(r.product_id);
    const mode = p?.tracking_mode ?? 'unit';
    const counted = mode !== 'unit';
    const known = r.roi_pct !== null && r.roi_pct !== undefined;
    return { r, p, mode, counted, known, roi: known ? Number(r.roi_pct) : null };
  }).sort((a, b) => (b.known - a.known) || ((b.roi ?? 0) - (a.roi ?? 0)));

  const max = Math.max(1, ...rows.filter(x => x.known).map(x => x.roi));
  const missing = ROI.reduce((n, r) => {
    const p = prodOf(r.product_id);
    return n + (p?.tracking_mode === 'unit' ? Number(r.units_missing_cost || 0) : 0);
  }, 0);

  const body = rows.map(({ r, p, counted, known, roi }) => {
    // Counted stock has no pieces, so "0 pieces" would read as "we own none" — the quantity is what
    // is owned. Same trap as units_missing_cost: a structural zero presented as a count.
    const meta = [
      esc(r.short_code),
      counted ? `counted stock · ${esc(p?.pool_qty ?? 0)} owned`
              : `${r.units_ever || 0} piece${r.units_ever === 1 ? '' : 's'}`,
    ].filter(Boolean).join(' · ');
    const val = known
      ? `<span class="rrow__v">${esc(roi.toFixed(1))}% <small>${money(r.rental_revenue)}</small></span>`
      : counted
        ? `<span class="rrow__v rrow__v--none">Not tracked<br>for counted stock</span>`
        : `<span class="rrow__v rrow__v--none">Cost not<br>recorded</span>`;
    // NO BAR AT ALL when the return is unknown. A bar is a mark for a value; there is no value, so
    // any bar is decoration standing where data should be — and a short one reads as "a small
    // number", which is the exact lie rule 3 exists to stop. A full-width flat one is no better: it
    // reads as complete. The label carries the meaning and needs no help.
    //
    // It also protects the honest zero. With the unpriced rows carrying no track, the only
    // near-empty bar on the screen is MH-BEAM's, which genuinely means zero.
    const bar = known ? `<span class="bar"><i style="width:${pct(roi, max)}%"></i></span>` : '';
    // The piece count is shown ONLY where it means something: a unit product with unpriced pieces.
    const note = (!known && !counted && Number(r.units_missing_cost) > 0)
      ? ` · ${esc(r.units_missing_cost)} of ${esc(r.units_ever)} pieces unpriced` : '';
    return `<div class="rrow">
      <span class="rrow__name">${esc(nameOf(p))}</span>
      ${val}
      <span class="rrow__meta">${meta}${note}</span>
      ${bar}</div>`;
  }).join('');

  return section('Earning best', 'Lifetime return', body,
    missing > 0
      ? `<p class="note note--warn">${missing} piece${missing === 1 ? ' has' : 's have'} no purchase
         price, so what ${missing === 1 ? 'it earns' : 'they earn'} back cannot be worked out.
         Add a price on Equipment and ${missing === 1 ? 'it' : 'they'} will appear here.</p>` : '');
}

// ---------------------------------------------------------------------------
// HOW EACH PRODUCT IS WORKING — renamed from "Not moving" on the spec's instruction, because
// "how hard it works" and "how often it goes out" are answers about products that ARE working and
// filing them under a dead-stock heading buries them. Sorted worst-first, so dead stock still lands
// at the top.
//
// RULE 13. v_unit_utilisation is per PIECE and returns nothing at all for counted stock — 225
// cables would drop off this screen exactly as they dropped off Home. Counted stock therefore gets
// its own group, with days-since-last-movement read from the movement ledger. Nothing is stored.
// ---------------------------------------------------------------------------
function working() {
  const byProduct = new Map();
  for (const u of UTIL) {
    const cur = byProduct.get(u.product_id) ?? { days_out: 0, days_owned: 0, hires: 0, pieces: 0 };
    cur.days_out += u.days_out ?? 0; cur.days_owned += u.days_owned ?? 0;
    cur.hires += u.times_hired ?? 0; cur.pieces += 1;
    byProduct.set(u.product_id, cur);
  }
  const today = todayLocal();
  const daysSince = iso => Math.round((Date.parse(today) - Date.parse(iso)) / 86400000);
  const lastMove = new Map();
  for (const m of MOVES) {
    if (m.movement_type !== 'dispatch') continue;
    const cur = lastMove.get(m.product_id);
    if (!cur || m.moved_on > cur) lastMove.set(m.product_id, m.moved_on);
  }

  const numbered = [...byProduct.entries()].map(([pid, v]) => {
    const p = prodOf(pid);
    const idle = lastMove.has(pid) ? daysSince(lastMove.get(pid)) : null;
    const util = v.days_owned ? Math.round(1000 * v.days_out / v.days_owned) / 10 : 0;
    return { p, idle, util, hires: v.hires, pieces: v.pieces };
  }).sort((a, b) => (b.idle ?? 1e9) - (a.idle ?? 1e9));

  const counted = PRODUCTS.filter(p => p.tracking_mode !== 'unit').map(p => {
    const idle = lastMove.has(p.id) ? daysSince(lastMove.get(p.id)) : null;
    return { p, idle, qty: p.pool_qty ?? 0 };
  }).sort((a, b) => (b.idle ?? 1e9) - (a.idle ?? 1e9));

  const row = ({ p, idle, util, hires, pieces }) => `<div class="rrow">
    <span class="rrow__name">${esc(nameOf(p))}</span>
    <span class="rrow__v">${idle === null ? 'Never' : esc(idle)}
      <small>${idle === null ? 'sent out' : (idle === 1 ? 'day idle' : 'days idle')}</small></span>
    <span class="rrow__meta">${esc(p?.short_code ?? '')} · ${esc(pieces)} piece${pieces === 1 ? '' : 's'}
      · hired ${esc(hires)} time${hires === 1 ? '' : 's'} · out ${esc(util)}% of the time</span></div>`;

  const crow = ({ p, idle, qty }) => `<div class="rrow">
    <span class="rrow__name">${esc(nameOf(p))}</span>
    <span class="rrow__v">${idle === null ? 'Never' : esc(idle)}
      <small>${idle === null ? 'sent out' : (idle === 1 ? 'day idle' : 'days idle')}</small></span>
    <span class="rrow__meta">${esc(p.short_code)} · counted stock · ${esc(qty)} owned
      · not tracked per piece</span></div>`;

  const body = numbered.map(row).join('')
    + (counted.length ? `<div class="rrow rrow--group">Counted stock</div>` + counted.map(crow).join('') : '');
  return section('How each product is working', 'Worst first', body, '');
}

// ---------------------------------------------------------------------------
// BEST CUSTOMERS — FACTS, NEVER VERDICTS.
//
// The mockup tags a customer "always pays". That is exactly the verdict migration 0025 refuses to
// compute and docs/decisions.md records the argument for: revenue posts on order CONFIRMATION, so a
// customer with three confirmed jobs and nothing dispatched owes ₹0 and reads as a model payer.
// "Pays on time" has the same flaw. Both are replaced with the fact underneath them.
// ---------------------------------------------------------------------------
function customers() {
  const rows = CUSTOMERS
    .filter(c => (c.jobs_total ?? 0) > 0)
    .map(c => ({ c, owed: c.receivable === null ? null : Number(c.receivable ?? 0) }))
    .sort((a, b) => (b.c.jobs_total ?? 0) - (a.c.jobs_total ?? 0));
  const max = Math.max(1, ...rows.map(x => x.c.jobs_total ?? 0));

  const tag = ({ c, owed }) => {
    if (owed === null) return `<span class="tag tag--none">money not visible</span>`;
    if (owed > 0) return `<span class="tag tag--bad">${money(owed)} owed${
      c.longest_unpaid_days ? ` · ${esc(c.longest_unpaid_days)} days` : ''}</span>`;
    if ((c.returned_late ?? 0) > 0) return `<span class="tag tag--warn">${esc(c.returned_late)} returned late</span>`;
    return `<span class="tag tag--ok">nothing owed · never late</span>`;
  };

  const body = rows.map(x => `<div class="rrow">
    <span class="rrow__name">${esc(x.c.business_name || x.c.name)}</span>
    <span class="rrow__v">${esc(x.c.jobs_total)} <small>job${x.c.jobs_total === 1 ? '' : 's'}</small></span>
    <span class="rrow__meta">${x.c.last_job_on ? 'last ' + esc(fmtDate(x.c.last_job_on)) + ' · ' : ''}${tag(x)}</span>
    <span class="bar"><i style="width:${pct(x.c.jobs_total, max)}%"></i></span></div>`).join('');

  return section('Best customers', 'By jobs', body,
    `<p class="rsec__foot">Facts, not a verdict — what they mean is yours to decide.</p>`);
}

// ---------------------------------------------------------------------------
// WHAT BREAKS — repairs per 10 jobs.
//
// The mockup's footer says this "needs one new view". It does not: repair_job joins through unit to
// v_unit_utilisation.times_hired, and that was measured before this file was written. No migration.
//
// Counted stock cannot appear: repair_job.unit_id is NOT NULL and cables have no pieces, so a
// repair cannot name one. Said on the screen rather than left as a silent absence (rule 13).
// ---------------------------------------------------------------------------
function breaks() {
  const unitProduct = new Map(UNITS.map(u => [u.id, u.product_id]));
  const hires = new Map();
  for (const u of UTIL) hires.set(u.product_id, (hires.get(u.product_id) ?? 0) + (u.times_hired ?? 0));

  const agg = new Map();
  for (const r of REPAIRS) {
    const pid = unitProduct.get(r.unit_id);
    if (!pid) continue;
    const cur = agg.get(pid) ?? { n: 0, spent: 0 };
    cur.n += 1; cur.spent += Number(r.actual_cost ?? 0);
    agg.set(pid, cur);
  }
  const rows = [...agg.entries()].map(([pid, v]) => {
    const h = hires.get(pid) ?? 0;
    return { p: prodOf(pid), n: v.n, spent: v.spent, hires: h,
             rate: h > 0 ? Math.round(100 * v.n / h) / 10 : null };
  }).sort((a, b) => (b.rate ?? 1e9) - (a.rate ?? 1e9));

  const max = Math.max(1, ...rows.filter(r => r.rate !== null).map(r => r.rate));
  const body = rows.length ? rows.map(r => `<div class="rrow">
      <span class="rrow__name">${esc(nameOf(r.p))}</span>
      <span class="rrow__v">${r.rate === null
        ? `<span class="rrow__v--none">Not hired yet</span>`
        : `${esc(r.rate.toFixed(1))} <small>${r.spent > 0 ? money(r.spent) + ' spent' : 'no cost recorded'}</small>`}</span>
      <span class="rrow__meta">${esc(r.p?.short_code ?? '')} · ${esc(r.n)} repair${r.n === 1 ? '' : 's'}
        · ${esc(r.hires)} hire${r.hires === 1 ? '' : 's'}</span>
      ${r.rate === null ? '' : `<span class="bar"><i style="width:${pct(r.rate, max)}%"></i></span>`}
    </div>`).join('')
    : `<div class="rrow"><span class="rrow__meta">Nothing has been sent for repair.</span></div>`;

  return section('What breaks', 'Repairs per 10 jobs', body,
    `<p class="rsec__foot">Numbered pieces only — a repair names a piece, and counted stock has none.</p>`);
}

function section(title, sub, body, foot) {
  return `<section class="rsec">
    <div class="rsec__head"><h2>${esc(title)}</h2><span class="rsec__sub">${esc(sub)}</span></div>
    <div class="rrows">${body || `<div class="rrow"><span class="rrow__meta">Nothing to show yet.</span></div>`}</div>
    ${foot || ''}
  </section>`;
}
</script>
</body>
</html>
