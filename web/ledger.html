<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — DJ Network's</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-2" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-08-2" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-08-2">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-08-2">
<!-- tokens.css first: it defines every custom property style.css then reads. Two <link>s and
     not an @import, because an @import inside style.css would serialise the two fetches. -->
<link rel="stylesheet" href="tokens.css?v=2026-09-08-2">
<link rel="stylesheet" href="style.css?v=2026-09-08-2">
<script src="vendor/supabase.js?v=2026-09-08-2" defer></script>
<script src="boot.js?v=2026-09-08-2" defer></script>
</head>
<body>
<div id="chrome"></div>
<main id="gate"><div class="signin" data-djn-boot><h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
  <p class="signin__sub">Starting up…</p></div></main>
<main id="app" class="wrap" hidden></main>
<div id="sheet-host"></div>

<script type="module">
import { sb, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock,
         errorBlock, toast, openSheet, focusField, initOffline, revealActiveTab, entryLabel,
         waLink, waMessage, canChasePayment, customerPicker }
  from './app.js?v=2026-09-08-2';

$('#chrome').innerHTML = chrome('ledger.html');
revealActiveTab();
initOffline();

let CUSTOMERS = [], BALANCES = new Map(), SELECTED = null, ENTRIES = [], ORDERS = [];

requireSession(async () => { await boot(); });

async function boot() {
  $('#app').innerHTML = `
    <div class="row row--between">
      <div><h1>Ledger &amp; payments</h1>
        <p class="sub">One ledger per customer. Money owed and money held are different things.</p></div>
      <button class="btn btn--primary" id="add-entry" hidden>Record something</button>
    </div>
    <div id="picker"></div>
    <div id="body" class="skeleton"><div class="skeleton__row"></div></div>`;
  $('#add-entry').addEventListener('click', () => openEntry());
  await load();
}

async function load() {
  try {
    const [c, b, o] = await Promise.all([
      sb.from('customer').select('id,name,business_name,whatsapp,alt_phone,city').eq('active', true).order('name'),
      sb.from('v_customer_balance').select('*'),
      sb.from('rental_order').select('id,order_no,customer_id,status,out_date').order('out_date', { ascending: false }),
    ]);
    for (const r of [c, b, o]) if (r.error) throw r.error;
    CUSTOMERS = c.data ?? []; ORDERS = o.data ?? [];
    BALANCES = new Map((b.data ?? []).map(x => [x.customer_id, x]));
    const wanted = new URLSearchParams(location.search).get('customer');
    SELECTED = CUSTOMERS.find(x => x.id === wanted) ?? null;
    renderPicker();
    await renderBody();
  } catch (err) {
    $('#body').className = ''; $('#body').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
}

function renderPicker() {
  if (!CUSTOMERS.length) { $('#picker').innerHTML = ''; return; }
  $('#picker').innerHTML = `<div class="row" style="margin-bottom:14px">
    <!-- Searchable by name OR phone number. It was a plain <select> of every customer: fine at two
         and unusable at two hundred, and it failed on the thing that matters — he has the number,
         not the spelling. -->
    <div class="grow" id="cust-pick" style="max-width:520px"></div></div>`;
  customerPicker($('#cust-pick'), CUSTOMERS, SELECTED, async c => {
    SELECTED = c;
    $('#add-entry').hidden = !SELECTED;
    history.replaceState({}, '', SELECTED ? `ledger.html?customer=${SELECTED.id}` : 'ledger.html');
    await renderBody();
  }, { id: 'lc', placeholder: 'Search name or phone number…' });
  $('#add-entry').hidden = !SELECTED;
}

async function renderBody() {
  const body = $('#body');
  if (!CUSTOMERS.length) {
    body.className = '';
    body.innerHTML = stateBlock({ icon: '👥', title: 'No customers yet',
      body: 'A ledger belongs to a customer, so one has to exist first.',
      actionLabel: 'Go to Customers', actionId: 'go-cust' });
    $('#go-cust').addEventListener('click', () => location.href = 'customers.html');
    return;
  }
  if (!SELECTED) {
    body.className = '';
    body.innerHTML = stateBlock({ icon: '👆', title: 'Pick a customer',
      body: 'Every entry belongs to one customer. Payments need not attach to an order — trade '
          + 'regulars pay on account, against the balance rather than against a job.' });
    return;
  }

  body.className = 'skeleton'; body.innerHTML = '<div class="skeleton__row"></div>';
  const { data, error } = await sb.from('ledger_entry')
    .select('*, order:order_id(order_no)').eq('customer_id', SELECTED.id)
    .order('entry_date', { ascending: false }).order('created_at', { ascending: false });
  if (error) { body.className = ''; body.innerHTML = errorBlock(error, 'r2');
    $('#r2').addEventListener('click', renderBody); return; }
  ENTRIES = data ?? [];
  body.className = '';

  const b = BALANCES.get(SELECTED.id) ?? { receivable: 0, upcoming: 0, deposit_held: 0 };

  // ---------------------------------------------------------------------------
  // RULE 6 ON THE SCREEN WHERE IT IS EASIEST TO GET WRONG.
  //
  // Three tiles, never two, and never one total. A deposit is the customer's own money being held —
  // a liability, not revenue — and adding it to what they owe would produce a number that is not
  // any real quantity. `upcoming` is separate again: it is billed work that has not gone out yet,
  // and calling it a debt is how a wedding customer is told they owe money three weeks early.
  // ---------------------------------------------------------------------------
  // THE PAYMENT CHASER, and the two guards it exists behind — both rule 6.
  //
  // 1 · Never offered when the balance is zero or in credit. 0018 made the credit case reachable
  //     (reverse a charge that has already been paid), and a reminder to somebody who has OVERPAID
  //     is the fastest way to lose a trade regular. canChasePayment() in app.js is the one test.
  // 2 · The message states the deposit separately or not at all. Deposit held is the customer's
  //     own money and is never part of what is owed; a message that blended them would chase a
  //     number that is not any real quantity.
  // The orders the balance is actually made of, so the customer has something to quote — the
  // briefing requires an ID in every message, and an on-account balance has no single one.
  const BILLED_TYPES = ['rental', 'transport', 'labour', 'misc', 'damage'];
  const refs = [...new Set(ENTRIES
    .filter(e => e.state === 'due' && BILLED_TYPES.includes(e.type) && e.order?.order_no)
    .map(e => e.order.order_no))];
  const chase = canChasePayment(b.receivable)
    ? waLink(SELECTED?.whatsapp, waMessage('payment_pending', {
        order: {}, orderRefs: refs, customerName: SELECTED?.business_name || SELECTED?.name,
        receivable: b.receivable, depositHeld: b.deposit_held,
      }))
    : null;

  body.innerHTML = `
    <div class="stats" style="margin-bottom:14px">
      <!-- A negative receivable is a real state, not an error: it means they have paid for more
           than they have been charged, usually because a charge was reversed after payment. Labelling
           that "Owed now −₹6,000" in red reads as a debt going the wrong way. It is a credit, and it
           says so. -->
      <div class="card"><div class="item__meta">${Number(b.receivable) < 0 ? 'In credit' : 'Owed now'}</div>
        <div class="stat__n${Number(b.receivable) > 0 ? ' stat__n--bad' : ''}">${money(Math.abs(Number(b.receivable)))}</div>
        <div class="field__hint">${Number(b.receivable) < 0
          ? 'Paid more than charged. This is owed back to them, or set against their next job.'
          : 'Billed, sent out, unpaid.'}</div></div>
      <div class="card"><div class="item__meta">Upcoming</div>
        <div class="stat__n">${money(b.upcoming)}</div>
        <div class="field__hint">Booked but not yet out. Not a debt yet.</div></div>
      <div class="card"><div class="item__meta">Deposit held</div>
        <div class="stat__n">${money(b.deposit_held)}</div>
        <div class="field__hint">The customer's money, held. Never revenue.</div></div>
    </div>
    <p class="field__hint" style="margin-top:-6px">These three are never added together. Owed and held
      are opposite directions, and upcoming has not happened yet.</p>
    ${chase ? `<div class="row" style="margin:-4px 0 14px">
      <a class="btn btn--wa" target="_blank" rel="noopener" href="${esc(chase)}">Ask for the ${esc(money(b.receivable))}</a>
      <span class="field__hint" style="margin:0">Opens a draft. It does not send${
        Number(b.deposit_held) > 0 ? ', and it names the deposit separately so it is never mistaken for what is owed' : ''}.</span>
    </div>` : (Number(b.receivable) < 0 ? `<p class="field__hint" style="margin:-4px 0 14px">
      Nothing to chase — they are in credit. That is money owed back to them.</p>` : '')}
    <div class="card scroll-x">
      <table class="data">
        <thead><tr><th>Date</th><th>What</th><th>Order</th><th>State</th><th>How</th><th style="text-align:right">Amount</th></tr></thead>
        <tbody>${ENTRIES.length ? ENTRIES.map(e => `
          <tr>
            <td data-label="Date">${esc(fmtDate(e.entry_date))}</td>
            <td data-label="What"><span class="badge">${esc(entryLabel(e.type))}</span>
              ${e.notes ? `<div class="item__meta">${esc(e.notes)}</div>` : ''}</td>
            <td data-label="Order">${esc(e.order?.order_no ?? '—')}</td>
            <td data-label="State">${e.state === 'upcoming' ? '<span class="badge badge--muted">upcoming</span>' : 'due'}</td>
            <td data-label="How">${esc(e.payment_mode ?? '')}${e.reference ? ' · ' + esc(e.reference) : ''}</td>
            <td data-label="Amount" style="text-align:right">${esc(signed(e))}</td>
          </tr>`).join('') : `<tr><td colspan="6">
            <p class="field__hint" style="margin:0">No entries yet for this customer.</p></td></tr>`}
        </tbody>
      </table>
    </div>`;
}

// Direction is shown, not just magnitude: what increases what they owe, and what reduces it.
function signed(e) {
  const owes = ['rental', 'transport', 'labour', 'misc', 'damage'];
  const reduces = ['payment', 'discount', 'write_off', 'reversal'];
  if (owes.includes(e.type)) return '+' + money(e.amount);
  if (reduces.includes(e.type)) return '−' + money(e.amount);
  return money(e.amount);   // deposits: a separate axis entirely, so no sign
}

function openEntry() {
  const b = BALANCES.get(SELECTED.id) ?? { deposit_held: 0 };
  const custOrders = ORDERS.filter(o => o.customer_id === SELECTED.id);
  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet__head">
      <h2 class="sheet__title">Record something — ${esc(SELECTED.business_name || SELECTED.name)}</h2>
      <!-- A visible word, not a glyph. The design bible's language rule: "an unlabelled icon
             asks the user to guess", and for this audience an icon-only control creates a guess
             rather than a confident tap. It no longer needs an aria-label — the text IS the name. -->
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
    </div>
    <label class="field"><span class="field__label">What is it? *</span>
      <select class="field__select" id="f-type">
        <!-- Built from entryLabel(), so the word on the option and the word on the row it
             creates are the same word by construction. ONE deliberate exception: the reversal
             type is shown here as the verb "Cancel a charge", because this control is choosing an
             action, while the row it writes is a record and reads "Charge cancelled".
             (No backticks in this comment — it lives inside a template literal, and one would end
             the string. That is a real way to take this page down.) -->
        ${[['Money in', ['payment', 'deposit_in']],
           ['Money out / back', ['deposit_out', 'deposit_forfeit']],
           ['Adjustments', ['discount', 'write_off', 'reversal', 'damage', 'misc']]]
          .map(([group, types]) => `<optgroup label="${esc(group)}">${types.map(t =>
            `<option value="${esc(t)}">${esc(t === 'reversal' ? 'Cancel a charge' : entryLabel(t))}</option>`
          ).join('')}</optgroup>`).join('')}
      </select>
      <span class="field__hint" id="type-hint"></span></label>
    <!-- Sits directly under the amount, because it is about the amount. It used to be the last
         element before the buttons: at 375px the refusal ("₹8,000.00 is held, so ₹20,000.00 cannot
         be returned") rendered roughly 900px below the fold while the operator looked at a greyed
         out "Record it" and a field reading 20000. He taps, nothing happens, and the reason is off
         screen. Measured signed in on Walkthrough Wedding. -->
    <div class="note" id="dep-note" hidden></div>
    <div class="grid2">
      <label class="field"><span class="field__label">Amount (₹) *</span>
        <input class="field__input" id="f-amt" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label class="field"><span class="field__label">Date</span>
        <input class="field__input" id="f-date" type="date" value="${esc(todayLocal())}" max="${esc(todayLocal())}"></label>
      <label class="field"><span class="field__label">How</span>
        <select class="field__select" id="f-mode">
          <option value="">—</option>
          ${['cash', 'upi', 'bank', 'cheque', 'adjustment'].map(m => `<option value="${m}">${m}</option>`).join('')}
        </select></label>
      <label class="field"><span class="field__label">Reference</span>
        <input class="field__input" id="f-ref" placeholder="UPI ref, cheque no."></label>
    </div>
    <div class="field" id="reversal-target-wrap" hidden>
      <!-- The dropdown above now offers "Cancel a charge". These three lines still said
           "reversed" / "a reversal", so the operator picked one word and was then explained the
           other. The stored value is still reversal; it is just not what anybody is shown. -->
      <label class="field__label" for="f-reverses">Which charge are you cancelling? *</label>
      <select class="field__select" id="f-reverses"></select>
      <span class="field__hint">Cancelling undoes one specific charge, and cannot exceed what is left
        of it. It takes that charge's own state, so cancelling an upcoming booking reduces the forward
        book and cancelling a due charge reduces what is owed — never the wrong one.</span>
    </div>
    <label class="field"><span class="field__label">Against which job?</span>
      <select class="field__select" id="f-order">
        <option value="">Not against a job — on account</option>
        ${custOrders.map(o => `<option value="${esc(o.id)}">${esc(o.order_no)} · ${esc(fmtDate(o.out_date))}</option>`).join('')}
      </select>
      <span class="field__hint">Payments need not attach to an order. Trade regulars pay against the
        balance, and forcing a job onto the payment would be inventing a fact.</span></label>
    <label class="field"><span class="field__label">Note</span>
      <input class="field__input" id="f-notes"></label>
    <div class="sheet__foot">
      <button class="btn" data-sheet-close type="button">Cancel</button>
      <button class="btn btn--primary" id="save">Record it</button>
    </div></div>
  </div>`);

  const HINTS = {
    payment: 'Reduces what they owe.',
    deposit_in: 'The customer\'s own money, held. Never counted as revenue.',
    deposit_out: `Returns held money. ${money(b.deposit_held)} is held right now.`,
    deposit_forfeit: `Keeps held money against damage. ${money(b.deposit_held)} is held right now.`,
    discount: 'Reduces what they owe.',
    write_off: 'Reduces what they owe, and says it will not be collected.',
    reversal: 'Cancels a charge that was posted. This is what unlocks an order line for editing.',
    damage: 'Increases what they owe.',
    misc: 'Increases what they owe.',
  };
  const syncType = () => {
    const t = $('#f-type').value;
    $('#type-hint').textContent = HINTS[t] ?? '';
    const isDepOut = ['deposit_out', 'deposit_forfeit'].includes(t);
    $('#dep-note').hidden = !isDepOut;
    if (isDepOut) $('#dep-note').innerHTML =
      `${money(b.deposit_held)} is held for this customer. Nothing above that can be returned or kept —
       a deposit cannot go negative, and the database refuses it as well as this screen.`;
    checkAmount();
  };
  const checkAmount = () => {
    const t = $('#f-type').value;
    const amt = Number($('#f-amt').value || 0);
    const btn = $('#save');
    if (['deposit_out', 'deposit_forfeit'].includes(t) && amt > Number(b.deposit_held)) {
      // Said as a sentence, before the write, rather than surfacing a trigger's exception after it.
      $('#dep-note').className = 'note note--warn';
      $('#dep-note').innerHTML =
        `<strong>That is more than is held.</strong> ${money(b.deposit_held)} is held for
         ${esc(SELECTED.business_name || SELECTED.name)}, so ${money(amt)} cannot be
         ${t === 'deposit_out' ? 'returned' : 'kept'}. If the difference is really owed to them,
         record it as a payment; if it is a charge, record it as damage. Those are revenue and a
         deposit is not.`;
      btn.disabled = true;
    } else {
      $('#dep-note').className = 'note';
      btn.disabled = false;
      if (['deposit_out', 'deposit_forfeit'].includes(t)) syncTypeNote();
    }
  };
  const syncTypeNote = () => {
    $('#dep-note').innerHTML =
      `${money(b.deposit_held)} is held for this customer. Nothing above that can be returned or kept.`;
  };
  // Only a billed charge can be reversed, and only by what is left of it. Computed here from the
  // entries already loaded so the operator sees the ceiling before typing rather than after.
  const BILLED = ['rental', 'transport', 'labour', 'misc', 'damage'];
  const reversibleLeft = (e) => Number(e.amount) - ENTRIES
    .filter(x => x.type === 'reversal' && x.reverses_entry_id === e.id)
    .reduce((n, x) => n + Number(x.amount), 0);

  const syncReversalTarget = () => {
    const isRev = $('#f-type').value === 'reversal';
    $('#reversal-target-wrap').hidden = !isRev;
    if (!isRev) return;
    const targets = ENTRIES.filter(e => BILLED.includes(e.type) && reversibleLeft(e) > 0);
    $('#f-reverses').innerHTML = targets.length
      ? targets.map(e => `<option value="${esc(e.id)}" data-left="${esc(reversibleLeft(e))}">
          ${esc(fmtDate(e.entry_date))} · ${esc(entryLabel(e.type))} ${esc(money(e.amount))}
          ${e.state === 'upcoming' ? '(upcoming)' : '(due)'}
          ${e.order?.order_no ? '· ' + esc(e.order.order_no) : ''}
          ${reversibleLeft(e) !== Number(e.amount) ? '· ' + esc(money(reversibleLeft(e))) + ' left' : ''}
        </option>`).join('')
      : '<option value="">Nothing left to cancel on this account</option>';
    const first = $('#f-reverses').selectedOptions[0];
    if (first?.dataset.left) { $('#f-amt').value = first.dataset.left; checkAmount(); }
  };
  $('#f-reverses')?.addEventListener('change', () => {
    const o = $('#f-reverses').selectedOptions[0];
    if (o?.dataset.left) { $('#f-amt').value = o.dataset.left; checkAmount(); }
  });
  $('#f-type').addEventListener('change', () => { syncType(); syncReversalTarget(); });
  $('#f-amt').addEventListener('input', checkAmount);
  syncType(); syncReversalTarget();

  $('#save').addEventListener('click', async () => {
    const amt = Number($('#f-amt').value || 0);
    if (!(amt > 0)) { toast('Enter an amount.', 'error'); focusField('#f-amt'); return; }
    if ($('#f-type').value === 'reversal' && !$('#f-reverses').value) {
      toast('Pick the charge this cancels. A cancellation that names nothing cannot be checked '
          + 'against what it undoes, and leaves nobody able to say why a balance is what it is.', 'error');
      focusField('#f-reverses'); return;
    }
    const btn = $('#save'); btn.disabled = true; btn.textContent = 'Recording…';
    const row = {
      customer_id: SELECTED.id,
      order_id: $('#f-order').value || null,
      entry_date: $('#f-date').value || todayLocal(),
      type: $('#f-type').value,
      amount: amt,
      // A reversal names the charge it undoes; 0018's trigger then copies that charge's state, so
      // an upcoming booking is undone in the forward book and a due charge in the receivable.
      // Everything else recorded here has already happened, so it is `due` — `upcoming` is written
      // only by the order screen, when revenue posts on confirmation and nothing has gone out yet.
      reverses_entry_id: $('#f-type').value === 'reversal' ? ($('#f-reverses').value || null) : null,
      state: 'due',
      payment_mode: $('#f-mode').value || null,
      reference: $('#f-ref').value.trim() || null,
      notes: $('#f-notes').value.trim() || null,
    };
    const { error } = await sb.from('ledger_entry').insert(row);
    if (error) {
      btn.disabled = false; btn.textContent = 'Record it';
      // The trigger's message is already a sentence aimed at a person, so it is shown as-is.
      toast(error.message.replace(/^.*?ERROR:\s*/, ''), 'error');
      return;
    }
    toast('Recorded.');
    sheet.close();
    await load();
  });
  focusField('#f-amt');
}

window.__djn = { showEmpty() { CUSTOMERS = []; renderPicker(); renderBody(); }, reload: load };
</script>
</body>
</html>
