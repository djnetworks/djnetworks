<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send out — DJ Network's</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-07-9" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-07-9" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-07-9">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-07-9">
<!-- tokens.css first: it defines every custom property style.css then reads. Two <link>s and
     not an @import, because an @import inside style.css would serialise the two fetches. -->
<link rel="stylesheet" href="tokens.css?v=2026-09-07-9">
<link rel="stylesheet" href="style.css?v=2026-09-07-9">
<script src="vendor/supabase.js?v=2026-09-07-9" defer></script>
<script src="boot.js?v=2026-09-07-9" defer></script>
</head>
<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { sb, store, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock,
         errorBlock, toast, initOffline, registerQueueHandlers, syncNow, revealActiveTab,
         trackBadge, publicUrl }
  from './app.js?v=2026-09-07-9';

$('#chrome').innerHTML = chrome('dispatch.html');
revealActiveTab();

// ---------------------------------------------------------------------------
// The write this screen makes, and how it is replayed.
//
// Registered BEFORE initOffline so a queue left over from a previous visit — the phone was locked,
// the tab was killed, the van drove out of signal — can be replayed the moment this page opens.
// The payload is plain JSON on purpose: it has to survive a browser restart.
// ---------------------------------------------------------------------------
registerQueueHandlers({
  async dispatch(payload) {
    const { error } = await sb.from('movement').insert(payload.movements);
    if (error) throw error;
    // Revenue posted on confirmation as `upcoming` becomes `due` when the gear actually leaves.
    // Doing it here rather than on the order screen is the point: it is due because it went out.
    const { error: e2 } = await sb.from('ledger_entry')
      .update({ state: 'due' }).eq('order_id', payload.order_id).eq('state', 'upcoming');
    if (e2) throw e2;
  },
});
initOffline();

let ORDER = null, CUSTOMER = null, LINES = [], PRODUCTS = new Map(), LOCS = [], AVAIL = new Map();
let PINNED = new Map(), DISPATCHED = new Map(), PICK = new Map(), POOLPICK = new Map();
let FROM_CACHE = false, CACHED_AT = null;
// product_id -> object URL for rendering, and product_id -> Blob for the offline record.
let PHOTOS = new Map(), PHOTO_BLOBS = new Map();

requireSession(async () => { await boot(); });

const orderId = new URLSearchParams(location.search).get('order');

async function boot() {
  if (!orderId) { await renderChooser(); return; }
  await load();
}

// ---------------------------------------------------------------------------
// Without an order id this screen has nothing to do. It NEVER offers the catalogue as an entry
// point: dispatch opens from the job, so chachu taps six numbers out of eight rather than
// searching three hundred (docs/structure.md form 7).
// ---------------------------------------------------------------------------
async function renderChooser() {
  const app = $('#app');
  app.innerHTML = `<h1>Send out</h1><p class="sub">Loading jobs…</p><div id="jobs"></div>`;
  const cached = await store.cacheKeys('order:');
  // try/catch, NOT .catch() on the builder. PostgREST's filter builder is a thenable, not a
  // Promise: it has .then but no .catch, so `.catch(...)` threw "is not a function" the moment
  // this line ran, every time, online or off — and the whole screen rendered "Could not load".
  // Found by opening the Send out tab with no ?order= during the design-pass smoke test; the
  // earlier walk had always arrived here from an order, which takes the other branch. A dead
  // entry point, and the one an operator taps from the nav.
  let data = null, error = null;
  try {
    ({ data, error } = await sb.from('v_order_fulfilment')
      .select('order_id,order_no,fulfilment_state,qty_ordered,qty_dispatched,qty_undispatched,order_status'));
  } catch (err) {
    error = err;                       // a thrown fetch failure — no signal
  }

  if (error || !data) {
    app.querySelector('.sub').textContent = 'No connection.';
    $('#jobs').innerHTML = cached.length
      ? `<p class="field__hint">These jobs were loaded for offline use and are on this phone:</p>
         <div class="list">${cached.map(c => `<a class="item" href="dispatch.html?order=${esc(c.data.order.id)}">
           <span class="item__main"><span class="item__title">${esc(c.data.order.order_no)}</span>
           <span class="item__meta">loaded ${esc(fmtDate(c.cached_at))}</span></span></a>`).join('')}</div>`
      : stateBlock({ icon: '📡', title: 'No connection, and no job loaded',
          body: 'Nothing has been loaded onto this phone for offline use. Open the job while you '
              + 'still have signal — the pick list is a read, and with no signal there is nothing to pick from.' });
    return;
  }

  const live = data.filter(f => !['closed', 'cancelled'].includes(f.order_status) && f.qty_undispatched > 0);
  app.querySelector('.sub').textContent = 'Open the job you are loading. Sending out always starts from the order.';
  $('#jobs').innerHTML = live.length
    ? `<div class="list">${live.map(f => `<a class="item" href="dispatch.html?order=${esc(f.order_id)}">
        <span class="item__main"><span class="item__title">${esc(f.order_no)}</span>
          <span class="item__meta">${esc(f.qty_dispatched)} of ${esc(f.qty_ordered)} loaded ·
          ${esc(f.qty_undispatched)} still to go</span></span>
        <span class="item__right">›</span></a>`).join('')}</div>`
    : stateBlock({ icon: '✅', title: 'Nothing waiting to go out',
        body: 'Every live order has been fully sent out. New jobs appear here as soon as they are agreed.' });
}

async function load() {
  const app = $('#app');
  app.innerHTML = `<div id="head"></div><div id="body" class="skeleton">
    <div class="skeleton__row"></div><div class="skeleton__row"></div></div>`;
  try {
    const [o, l, locs] = await Promise.all([
      sb.from('rental_order').select('*, customer:customer_id(id,name,business_name,whatsapp)').eq('id', orderId).single(),
      sb.from('order_line').select('*').eq('order_id', orderId),
      sb.from('location').select('id,name,type').eq('active', true).order('name'),
    ]);
    if (o.error) throw o.error;
    if (l.error) throw l.error;
    if (locs.error) throw locs.error;
    ORDER = o.data; CUSTOMER = o.data.customer; LINES = l.data ?? []; LOCS = locs.data ?? [];

    const ids = [...new Set(LINES.map(x => x.product_id))];
    const p = await sb.from('product').select('id,short_code,brand,model_name,tracking_mode,inclusions,image_url').in('id', ids);
    if (p.error) throw p.error;
    PRODUCTS = new Map((p.data ?? []).map(x => [x.id, x]));

    await refreshAvailability();
    await recordDispatched();
    FROM_CACHE = false;
    render();
    // Photographs are fetched AFTER the list is on screen and painted into the tiles that are
    // already there. "Speed is a trust signal" — on 3G a slow screen looks broken, and a picture
    // is never worth delaying the numbers for. Painted in place rather than by re-rendering the
    // lines, so a quantity already typed into a counted-stock box cannot be reset underneath a
    // thumb by an image arriving.
    await loadPhotos();
    paintPhotos();
    // Its OWN try. This line is inside the block whose catch falls back to the cached copy, and
    // the fallback then repaints the screen as "working offline · numbers are as they were then".
    // So a full quota, a private window or any IndexedDB refusal — while the phone is online and
    // the data on screen is fresh — used to relabel a live screen as stale, and with no prior
    // cache row it threw instead. Failing to SAVE for later must never change what is shown NOW.
    try {
      await cacheForOffline(true);     // opening the job while in signal is what loads it
    } catch (err) {
      toast('This job is loaded on screen but could not be saved to this phone for offline use.',
            'error');
    }
  } catch (err) {
    // No signal, or the job could not be read. Fall back to whatever was deliberately loaded.
    const c = await store.cacheGet('order:' + orderId);
    if (c) {
      ({ order: ORDER, customer: CUSTOMER, lines: LINES, locations: LOCS } = c.data);
      PRODUCTS = new Map(c.data.products.map(x => [x.id, x]));
      AVAIL = new Map(Object.entries(c.data.avail));
      PINNED = new Map(Object.entries(c.data.pinned ?? {}));
      DISPATCHED = new Map(Object.entries(c.data.dispatched ?? {}));
      // The photographs travel as Blobs, so the pick list looks the same in a godown with no
      // signal as it does in the shop. Object URLs are minted per page load and die with it.
      for (const [pid, blob] of Object.entries(c.data.photos ?? {})) {
        try { PHOTOS.set(pid, URL.createObjectURL(blob)); } catch { /* not a Blob: ignore */ }
      }
      FROM_CACHE = true; CACHED_AT = c.cached_at;
      render();
      return;
    }
    $('#body').className = '';
    $('#body').innerHTML = stateBlock({
      icon: '📡', title: 'This job is not on this phone',
      body: 'There is no connection and this order was never loaded for offline use. Sending out needs '
          + 'to know which pieces are on the shelf, and that is a read — there is nothing to pick from. '
          + 'Open it once while you have signal and it will be here.',
    });
  }
}

async function refreshAvailability() {
  AVAIL = new Map(); PINNED = new Map();
  for (const line of LINES) {
    const p = PRODUCTS.get(line.product_id);
    if (!p) continue;
    if (p.tracking_mode === 'unit') {
      const { data, error } = await sb.from('v_unit_status')
        .select('unit_id,piece_no,condition,status,at_kind,at_id')
        .eq('product_id', line.product_id).eq('status', 'available').order('piece_no');
      if (error) throw error;
      AVAIL.set(line.product_id, data ?? []);
      if (line.pinned_unit_id) PINNED.set(line.product_id, line.pinned_unit_id);
    } else {
      // Rule 13: pooled and consumable products have no pieces at all. Their availability is a
      // quantity from v_pool_stock, and asking v_unit_status would return nothing and read as zero.
      const { data, error } = await sb.from('v_pool_stock')
        .select('product_id,qty_on_hand').eq('product_id', line.product_id).maybeSingle();
      if (error) throw error;
      AVAIL.set(line.product_id, data?.qty_on_hand ?? 0);
    }
  }
}

async function recordDispatched() {
  const { data, error } = await sb.from('movement')
    .select('unit_id,product_id,qty').eq('order_id', orderId).eq('movement_type', 'dispatch');
  if (error) throw error;
  DISPATCHED = new Map();
  for (const m of (data ?? [])) {
    const cur = DISPATCHED.get(m.product_id) ?? { pieces: [], qty: 0 };
    if (m.unit_id) cur.pieces.push(m.unit_id); else cur.qty += m.qty;
    DISPATCHED.set(m.product_id, cur);
  }
}

// ---------------------------------------------------------------------------
// PRODUCT PHOTOS ON THE PICK LIST.
//
// The design bible: "Traders recognise cloth by image before label. Photography leads; text
// captions it." The same is true of a shelf of black boxes in a godown at 7am. DJN-SPK-15 and
// DJN-SPK-12 are two strings that differ by one character; the two photographs do not.
//
// The photographs are fetched as Blobs and stored in the SAME offline record as the rest of the
// job, because a picture that is blank exactly when there is no signal is decoration, and this
// screen is the one that runs in a place with no signal. Service worker caching would not do it:
// sw.js deliberately only holds the app shell and storage is a different origin.
//
// Failures are silent by design. A missing photograph is not an error the operator can act on,
// and the short code underneath is still the identifier — the picture is the faster read, never
// the only one.
// ---------------------------------------------------------------------------
const PHOTO_MAX_BYTES = 1_500_000;

async function loadPhotos() {
  const prev = await store.cacheGet('order:' + orderId);
  const cached = prev?.data?.photos ?? {};
  const paths = prev?.data?.photo_paths ?? {};

  for (const p of PRODUCTS.values()) {
    if (!p.image_url) continue;
    // Re-use what is already on the phone unless the product's primary photo has changed.
    const keep = cached[p.id] && paths[p.id] === p.image_url;
    if (keep) { PHOTO_BLOBS.set(p.id, cached[p.id]); }
    else {
      try {
        const r = await fetch(publicUrl(p.image_url), { cache: 'force-cache' });
        if (!r.ok) continue;
        const blob = await r.blob();
        if (blob.size > PHOTO_MAX_BYTES) continue;
        PHOTO_BLOBS.set(p.id, blob);
      } catch { continue; }
    }
    try { PHOTOS.set(p.id, URL.createObjectURL(PHOTO_BLOBS.get(p.id))); } catch { /* ignore */ }
  }
}

// The picture, the code and whatever belongs on the right of the row, as one header. Both line
// shapes — numbered pieces and counted stock — use it, so they cannot drift apart.
function pickHead(p, right) {
  const src = PHOTOS.get(p.id);
  return `<div class="pick-head">
    <span class="pick-thumb" data-product="${esc(p.id)}">
      ${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ''}
      <span class="pick-thumb__code">${esc(p.short_code || '?')}</span>
    </span>
    <span class="pick-head__main">
      <span class="pick-head__title">${esc(p.model_name)}</span>
      <span class="item__meta">${esc(p.brand ? p.brand + ' · ' : '')}${esc(p.short_code)}</span>
    </span>
    <span class="pick-head__right">${right}</span>
  </div>`;
}

// Drops each photograph into the tile that is already on screen. Idempotent: a tile that already
// has one is left alone, so this is safe to call after any render.
function paintPhotos() {
  for (const [pid, src] of PHOTOS) {
    for (const el of $$(`.pick-thumb[data-product="${CSS.escape(pid)}"]`)) {
      if (el.querySelector('img')) continue;
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      el.prepend(img);
    }
  }
}

async function cacheForOffline(quiet) {
  await store.cachePut('order:' + orderId, {
    order: ORDER, customer: CUSTOMER, lines: LINES, locations: LOCS,
    products: [...PRODUCTS.values()],
    photos: Object.fromEntries(PHOTO_BLOBS),
    // What each stored photograph was OF, so a changed primary image is re-fetched next time
    // rather than serving last month's picture for ever.
    photo_paths: Object.fromEntries([...PRODUCTS.values()]
      .filter(p => PHOTO_BLOBS.has(p.id)).map(p => [p.id, p.image_url])),
    avail: Object.fromEntries(AVAIL),
    pinned: Object.fromEntries(PINNED),
    dispatched: Object.fromEntries(DISPATCHED),
  });
  CACHED_AT = new Date().toISOString();
  if (!quiet) toast('Loaded onto this phone. You can now work on this job with no signal.');
  paintOfflineBadge();
}

function paintOfflineBadge() {
  const el = $('#offline-state');
  if (!el) return;
  el.innerHTML = FROM_CACHE
    ? `<span class="badge badge--at_repair">working offline</span>
       <span class="field__hint">Loaded ${esc(fmtDate(CACHED_AT))}. Numbers are as they were then.</span>`
    : CACHED_AT
      ? `<span class="badge badge--available">loaded for offline</span>
         <span class="field__hint">This job is on this phone. It will still open with no signal.</span>`
      : `<button class="btn btn--sm" id="load-offline">Load for offline</button>`;
  $('#load-offline')?.addEventListener('click', () => cacheForOffline(false));
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function render() {
  const cust = CUSTOMER?.business_name || CUSTOMER?.name || 'customer';
  $('#head').innerHTML = `
    <div class="row row--between">
      <div>
        <h1>${esc(ORDER.order_no)}</h1>
        <p class="sub">${esc(cust)} · ${esc(fmtDate(ORDER.out_date))} → ${esc(fmtDate(ORDER.expected_return_date))}
          ${ORDER.venue_name ? '· ' + esc(ORDER.venue_name) : ''}</p>
      </div>
      <a class="btn btn--ghost btn--sm" href="orders.html">Order</a>
    </div>
    <div class="row" id="offline-state" style="margin-bottom:12px"></div>
    ${['closed', 'cancelled'].includes(ORDER.status) ? `<div class="note note--warn">
      This order is ${esc(ORDER.status)}. Anything already out stays out until it is returned, but
      nothing more should be loaded against it.</div>` : ''}`;
  paintOfflineBadge();

  const body = $('#body');
  body.className = '';
  if (!LINES.length) {
    body.innerHTML = stateBlock({ icon: '📋', title: 'This order has no lines',
      body: 'Nothing has been agreed on this job yet, so there is nothing to load.' });
    return;
  }

  body.innerHTML = `
    <div class="card">
      <label class="field"><span class="field__label">Loading from *</span>
        <select class="field__select" id="f-loc">
          ${LOCS.map(l => `<option value="${esc(l.id)}">${esc(l.name)} (${esc(l.type)})</option>`).join('')}
        </select>
        <span class="field__hint">Only pieces sitting at this location are offered below.</span></label>
    </div>
    <div id="lines"></div>
    <div class="card">
      <strong>Who is taking it</strong>
      <div class="grid2" style="margin-top:10px">
        <label class="field"><span class="field__label">How is it going out? *</span>
          <select class="field__select" id="f-method">
            <option value="delivered_by_chachu">Delivered by chachu</option>
            <option value="porter">Porter</option>
            <option value="self_collection">Customer collected</option>
            <option value="other">Other</option>
          </select>
          <span class="field__hint">Chosen every time. There is no staff list — one employee and a
            rotating cast of porters would be stale within a month.</span></label>
        <label class="field"><span class="field__label">Carrier name</span>
          <input class="field__input" id="f-carrier" placeholder="who is taking it"></label>
        <label class="field"><span class="field__label">Carrier phone</span>
          <input class="field__input" id="f-carrier-phone" type="tel" inputmode="tel"></label>
        <label class="field"><span class="field__label">Vehicle</span>
          <input class="field__input" id="f-vehicle"></label>
        <label class="field"><span class="field__label">Received by</span>
          <input class="field__input" id="f-recv" value="${esc(ORDER.venue_contact_name ?? '')}">
          <span class="field__hint">Prefilled from the venue contact — the man at the hall, not the
            man who booked. Change it if somebody else signs.</span></label>
        <label class="field"><span class="field__label">Their phone</span>
          <input class="field__input" id="f-recv-phone" type="tel" inputmode="tel"
                 value="${esc(ORDER.venue_contact_phone ?? '')}"></label>
      </div>
      <label class="field"><span class="field__label">Note</span>
        <input class="field__input" id="f-note"></label>
    </div>
    <div class="dispatch-bar">
      <div id="pick-summary" class="field__hint"></div>
      <button class="btn btn--primary btn--block" id="go">Send these out</button>
    </div>`;

  $('#f-loc').addEventListener('change', renderLines);
  $('#go').addEventListener('click', doDispatch);
  renderLines();
}

function renderLines() {
  const locId = $('#f-loc').value;
  $('#lines').innerHTML = LINES.map((line, i) => {
    const p = PRODUCTS.get(line.product_id);
    if (!p) return '';
    const done = DISPATCHED.get(line.product_id) ?? { pieces: [], qty: 0 };
    const alreadyN = p.tracking_mode === 'unit' ? done.pieces.length : done.qty;
    const remaining = Math.max(line.qty - alreadyN, 0);

    if (p.tracking_mode !== 'unit') {
      const onHand = AVAIL.get(line.product_id) ?? 0;
      return `<div class="card" data-line="${i}">
        ${pickHead(p, `<span class="badge badge--${esc(p.tracking_mode)}">${esc(trackBadge(p.tracking_mode))}</span>`)}
        <p class="field__hint">Counted stock, no piece numbers. ${esc(alreadyN)} of ${esc(line.qty)} already sent
          · ${esc(onHand)} on the shelf.</p>
        ${remaining === 0 ? '<p class="field__hint" style="color:var(--ok)">This line is complete.</p>'
        : `<label class="field"><span class="field__label">How many are you sending now?</span>
             <div class="row" style="gap:8px;flex-wrap:nowrap">
               <!-- The value comes back from POOLPICK, NOT from a hardcoded 0. renderLines() now
                    re-runs whenever "Pick N" or "Clear" is tapped on any OTHER line, and a literal
                    value="0" here redrew this box as empty while POOLPICK still held the number
                    that doDispatch() would send. Measured: type 7 cables, tap "Pick 2" on the
                    speakers, the box reads 0 and the movement POSTed is qty 7. The box has to say
                    what will leave the godown. First render is still 0 because POOLPICK is empty
                    — a quantity that arrives without anybody choosing it is one nobody checked. -->
               <input class="field__input pool-qty" data-product="${esc(line.product_id)}" type="number"
                      min="0" max="${esc(Math.min(remaining, onHand))}" step="1" inputmode="numeric"
                      value="${esc(POOLPICK.get(line.product_id) ?? 0)}">
               ${Math.min(remaining, onHand) > 0 ? `<button class="btn btn--sm pool-all" type="button"
                  data-product="${esc(line.product_id)}"
                  data-n="${esc(Math.min(remaining, onHand))}">All ${esc(Math.min(remaining, onHand))}</button>` : ''}
             </div>
             <span class="field__hint">${esc(remaining)} still owed on this line.
               ${onHand < remaining ? `Only ${esc(onHand)} on the shelf.` : ''}</span></label>`}
      </div>`;
    }

    const all = AVAIL.get(line.product_id) ?? [];
    const here = all.filter(u => u.at_kind === 'location' && (!locId || u.at_id === locId));
    const pinnedId = PINNED.get(line.product_id);
    const pinnedHere = pinnedId ? here.find(u => u.unit_id === pinnedId) : null;
    const pinnedElsewhere = pinnedId && !pinnedHere;
    const sorted = pinnedHere ? [pinnedHere, ...here.filter(u => u.unit_id !== pinnedId)] : here;

    return `<div class="card" data-line="${i}">
      ${pickHead(p, `${esc(alreadyN)} of ${esc(line.qty)} loaded`)}
      ${pinnedId ? (pinnedHere
        ? `<p class="field__hint">Piece ${esc(pinnedHere.piece_no)} is pinned to this line and is offered first.</p>`
        : `<div class="note note--warn">The piece pinned to this line is <strong>not on the shelf here</strong>.
             It may be out, at a repair shop, or at another location. Send a different one, or find it first.</div>`) : ''}
      ${remaining === 0
        ? '<p class="field__hint" style="color:var(--ok)">This line is complete.</p>'
        : !sorted.length
          ? `<div class="note note--warn">Nothing of this product is on the shelf at this location.
               ${esc(remaining)} still owed. Try another location, or send what you have and finish later —
               sending part of a job is normal.</div>`
          : `<div class="row" style="gap:8px;margin-bottom:6px">
               <span class="field__hint" style="margin:0">Tap the pieces going out. ${esc(remaining)} still owed,
                 ${esc(sorted.length)} here.</span>
               <!-- The whole job in one tap when the shelf agrees with the order, which is the
                    ordinary case. Six taps become one; the pieces still light up individually so
                    what is about to go out is visible before the sticky button is pressed, and any
                    one of them can still be tapped off. -->
               <span style="margin-left:auto;display:flex;gap:8px">
                 ${pickedOn(line.product_id, sorted) < Math.min(remaining, sorted.length)
                   ? `<button class="btn btn--sm pick-all" type="button" data-line="${i}">Pick
                        ${esc(Math.min(remaining, sorted.length))}</button>` : ''}
                 ${pickedOn(line.product_id, sorted) > 0
                   ? `<button class="btn btn--sm pick-none" type="button" data-line="${i}">Clear</button>` : ''}
               </span>
             </div>
             <div class="pieces">${sorted.map(u => `
               <button class="piece ${PICK.has(u.unit_id) ? 'is-on' : ''}" data-unit="${esc(u.unit_id)}"
                       data-product="${esc(line.product_id)}" type="button"
                       aria-pressed="${PICK.has(u.unit_id) ? 'true' : 'false'}">
                 <span class="piece__no">${esc(u.piece_no)}</span>
                 ${u.unit_id === pinnedId ? '<span class="piece__tag">pinned</span>' : ''}
                 ${u.condition !== 'good' ? `<span class="piece__tag">${esc(u.condition.replace('_', ' '))}</span>` : ''}
               </button>`).join('')}</div>
             <div class="incl" id="incl-${i}"></div>`}
    </div>`;
  }).join('');

  $$('.piece').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.unit;
    if (PICK.has(id)) PICK.delete(id);
    else PICK.set(id, { product_id: b.dataset.product, inclusions: null });
    b.classList.toggle('is-on');
    b.setAttribute('aria-pressed', PICK.has(id) ? 'true' : 'false');
    renderInclusions(); paintSummary();
  }));
  // renderLines() destroys the button that was just pressed, so focus fell to <body> and the
  // next Tab restarted at the top bar. Put it back on the same line's control.
  const keepFocus = (lineIdx, cls) => {
    const el = $(`.${cls}[data-line="${lineIdx}"]`) ?? $(`.piece[data-product]`);
    el?.focus?.();
  };
  $$('.pick-all').forEach(b => b.addEventListener('click', () => {
    const { sorted, remaining, productId } = lineContext(Number(b.dataset.line));
    // Cap on BOTH what the order still owes and what is on this shelf, and take them in the order
    // the tiles are shown — the pinned piece first — so what is selected is what is read.
    const want = Math.min(remaining, sorted.length);
    for (const u of sorted) {
      if (pickedOn(productId, sorted) >= want) break;
      if (!PICK.has(u.unit_id)) PICK.set(u.unit_id, { product_id: productId, inclusions: null });
    }
    renderLines();
    keepFocus(Number(b.dataset.line), 'pick-none');
  }));
  $$('.pick-none').forEach(b => b.addEventListener('click', () => {
    const { sorted } = lineContext(Number(b.dataset.line));
    for (const u of sorted) PICK.delete(u.unit_id);
    renderLines();
    keepFocus(Number(b.dataset.line), 'pick-all');
  }));
  $$('.pool-all').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.n) || 0;
    POOLPICK.set(b.dataset.product, n);
    const inp = $(`.pool-qty[data-product="${CSS.escape(b.dataset.product)}"]`);
    if (inp) inp.value = String(n);
    paintSummary();
  }));
  $$('.pool-qty').forEach(inp => inp.addEventListener('input', () => {
    const n = Math.max(0, Number(inp.value) || 0);
    POOLPICK.set(inp.dataset.product, n);
    paintSummary();
  }));
  renderInclusions(); paintSummary(); paintPhotos();
}

// How many of THIS line's offered pieces are currently picked. Counted against the tiles on
// screen rather than against PICK as a whole, so a product carried on two lines cannot report the
// other line's picks as its own.
function pickedOn(productId, offered) {
  return offered.filter(u => PICK.has(u.unit_id)).length;
}

// The same three values renderLines() computed for a line, recomputed for its buttons. Derived
// again rather than captured in the handler, because the shelf is re-read on every location
// change and a captured list goes stale the moment "Loading from" is touched.
function lineContext(i) {
  const line = LINES[i];
  const p = PRODUCTS.get(line.product_id);
  const locId = $('#f-loc')?.value;
  const done = DISPATCHED.get(line.product_id) ?? { pieces: [], qty: 0 };
  const remaining = Math.max(line.qty - done.pieces.length, 0);
  const all = AVAIL.get(line.product_id) ?? [];
  const here = all.filter(u => u.at_kind === 'location' && (!locId || u.at_id === locId));
  const pinnedId = PINNED.get(line.product_id);
  const pinnedHere = pinnedId ? here.find(u => u.unit_id === pinnedId) : null;
  const sorted = pinnedHere ? [pinnedHere, ...here.filter(u => u.unit_id !== pinnedId)] : here;
  return { line, p, remaining, sorted, productId: line.product_id };
}

function renderInclusions() {
  LINES.forEach((line, i) => {
    const host = $(`#incl-${i}`);
    if (!host) return;
    const p = PRODUCTS.get(line.product_id);
    const list = Array.isArray(p?.inclusions) ? p.inclusions : [];
    const picked = [...PICK.entries()].filter(([, v]) => v.product_id === line.product_id);
    if (!list.length || !picked.length) { host.innerHTML = ''; return; }
    host.innerHTML = `<div class="note" style="margin-top:10px">
      <strong>Check what travels with each piece</strong>
      ${picked.map(([unitId]) => {
        const u = (AVAIL.get(line.product_id) ?? []).find(x => x.unit_id === unitId);
        return `<div style="margin-top:8px"><div class="item__meta">Piece ${esc(u?.piece_no ?? '?')}</div>
          <div class="pill-row">${list.map(item => `
            <label class="field field--inline" style="margin:0">
              <input type="checkbox" class="incl-box" data-unit="${esc(unitId)}" data-item="${esc(item)}" checked>
              <span>${esc(item)}</span></label>`).join('')}</div></div>`;
      }).join('')}
      <span class="field__hint">Unticking one is how you catch that the cable did not come back.</span>
    </div>`;
  });
  $$('.incl-box').forEach(cb => cb.addEventListener('change', () => {
    const unit = cb.dataset.unit;
    const cur = PICK.get(unit); if (!cur) return;
    const boxes = $$(`.incl-box[data-unit="${CSS.escape(unit)}"]`);
    cur.inclusions = boxes.filter(b => b.checked).map(b => b.dataset.item);
    PICK.set(unit, cur);
  }));
}

/**
 * How much more of each product this order can still take. Aggregated per PRODUCT because
 * fn_availability and v_order_fulfilment both do, and because one order may carry the same
 * product on two lines — capping per line would let 2 + 2 through against a remainder of 3.
 */
function remainingByProduct() {
  const owed = new Map();
  for (const line of LINES) {
    const p = PRODUCTS.get(line.product_id);
    if (!p) continue;
    const done = DISPATCHED.get(line.product_id) ?? { pieces: [], qty: 0 };
    const alreadyN = p.tracking_mode === 'unit' ? done.pieces.length : done.qty;
    // Summed across lines first, then the dispatched total taken off once.
    owed.set(line.product_id, (owed.get(line.product_id) ?? -alreadyN) + Number(line.qty || 0));
  }
  for (const [k, v] of owed) owed.set(k, Math.max(v, 0));
  return owed;
}

function paintSummary() {
  const pieces = PICK.size;
  const pooled = [...POOLPICK.values()].reduce((a, b) => a + b, 0);
  const el = $('#pick-summary');
  if (!el) return;

  // ---------------------------------------------------------------------------
  // NOTHING MAY GO OUT THAT THE ORDER DID NOT ASK FOR.
  //
  // Measured, signed in: on DJN-2609-0002 the line read "2 still owed, 4 here" and tapping all
  // four gave "4 piece(s) selected" with Dispatch enabled and no warning. On a pooled line the
  // input carries max="12" but nothing reads it — typing 20 against 12 owed and 15 on the shelf
  // gave "20 counted item(s) selected", Dispatch enabled, validity.rangeOverflow true and no
  // message anywhere.
  //
  // What that costs: two boxes recorded at a customer who never received them. They are then out
  // by rule 2 — no return has been recorded — so they are unavailable for every later job until
  // somebody types a return for a movement that never physically happened. That is the six-out-
  // five-back bug arriving from the other end, and this screen is where it would be typed, one
  // handed, in the dark, next to a van.
  //
  // Refused rather than warned. Deselecting is one tap on the same button, so the cost of being
  // strict is trivial; the cost of being lenient is a box that does not exist being promised to
  // the next customer. If the extra piece is genuinely going, the order is what is wrong — add
  // the line, and then the invoice is right too.
  // ---------------------------------------------------------------------------
  const owed = remainingByProduct();
  const picked = new Map();
  for (const v of PICK.values()) picked.set(v.product_id, (picked.get(v.product_id) ?? 0) + 1);
  for (const [pid, n] of POOLPICK) if (n > 0) picked.set(pid, (picked.get(pid) ?? 0) + n);

  const over = [...picked.entries()]
    .map(([pid, n]) => ({ pid, n, owed: owed.get(pid) ?? 0 }))
    .filter(x => x.n > x.owed);

  if (over.length) {
    el.innerHTML = over.map(x => {
      const p = PRODUCTS.get(x.pid);
      return `<strong>${esc(p?.short_code ?? 'This product')}: ${esc(x.n)} selected, ${esc(x.owed)} still owed.</strong>
        Take ${esc(x.n - x.owed)} off, or add it to the order first.`;
    }).join('<br>');
    el.className = 'field__hint dispatch-bar__warn';
    $('#go').disabled = true;
    return;
  }

  el.className = 'field__hint';
  el.textContent = (pieces || pooled)
    ? `${pieces ? pieces + ' piece(s)' : ''}${pieces && pooled ? ' and ' : ''}${pooled ? pooled + ' counted item(s)' : ''} selected.`
    : 'Nothing selected yet. Sending part of a job is normal — send what is ready.';
  $('#go').disabled = !(pieces || pooled);
}

// ---------------------------------------------------------------------------
// Dispatch
// ---------------------------------------------------------------------------

async function doDispatch() {
  const btn = $('#go');
  const locId = $('#f-loc').value;
  if (!locId) { toast('Pick where you are loading from.', 'error'); return; }

  const common = {
    order_id: orderId, product_id: null,
    from_kind: 'location', from_id: locId,
    to_kind: 'customer', to_id: CUSTOMER.id,
    // The phone's local date, not the server's. current_date is UTC, so anything before 05:30 IST
    // would file under yesterday — and a rental day is a calendar convention, not a clock one.
    moved_on: todayLocal(),
    dispatch_method: $('#f-method').value,
    carrier_name: $('#f-carrier').value.trim() || null,
    carrier_phone: $('#f-carrier-phone').value.trim() || null,
    vehicle_no: $('#f-vehicle').value.trim() || null,
    receiver_name: $('#f-recv').value.trim() || null,
    receiver_phone: $('#f-recv-phone').value.trim() || null,
    notes: $('#f-note').value.trim() || null,
  };

  const movements = [];
  for (const [unitId, v] of PICK.entries()) {
    const u = (AVAIL.get(v.product_id) ?? []).find(x => x.unit_id === unitId);
    movements.push({
      ...common, movement_type: 'dispatch', unit_id: unitId, product_id: v.product_id, qty: 1,
      condition_at_move: u?.condition ?? null,
      inclusions_checked: v.inclusions ?? (PRODUCTS.get(v.product_id)?.inclusions ?? []),
    });
  }
  for (const [productId, qty] of POOLPICK.entries()) {
    if (qty > 0) movements.push({
      ...common, movement_type: 'dispatch', unit_id: null, product_id: productId, qty,
    });
  }
  if (!movements.length) { toast('Nothing selected.', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Sending…';
  const label = `Send out ${movements.length} item(s) on ${ORDER.order_no}`;

  if (!navigator.onLine) {
    await store.enqueue('dispatch', { movements, order_id: orderId }, label);
    toast(`No signal — ${movements.length} item(s) held on this phone and sent when the signal returns.`);
    PICK.clear(); POOLPICK.clear();
    btn.disabled = false; btn.textContent = 'Send these out';
    await load();
    return;
  }

  try {
    const { error } = await sb.from('movement').insert(movements);
    if (error) throw error;
    const { error: e2 } = await sb.from('ledger_entry')
      .update({ state: 'due' }).eq('order_id', orderId).eq('state', 'upcoming');
    if (e2) throw e2;
    toast(`${movements.length} item(s) sent out.`);
    PICK.clear(); POOLPICK.clear();
    await load();
  } catch (err) {
    // A network failure mid-write is queued rather than lost; anything else is a real rejection
    // the operator has to see, because the boxes may already be on the van.
    const msg = err?.message || String(err);
    if (/fetch|network|Failed to fetch/i.test(msg)) {
      await store.enqueue('dispatch', { movements, order_id: orderId }, label);
      toast('Connection dropped — held on this phone and sent when the signal returns.');
      PICK.clear(); POOLPICK.clear(); await load();
    } else {
      toast(msg, 'error');
    }
  } finally {
    btn.disabled = false; btn.textContent = 'Send these out';
  }
}

window.__djn = { reload: load, cacheNow: () => cacheForOffline(false) };
</script>
</body>
</html>
