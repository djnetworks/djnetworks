<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-15" sizes="32x32">

     not an @import, because an @import inside style.css would serialise the two fetches. -->

<link rel="stylesheet" href="style.css?v=2026-09-08-15">

<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { sb, store, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock,
         errorBlock, toast, initOffline, revealActiveTab, waLink, waMessage,
         newRequestId, guardedWrite, cardList, loadPermissions, can, networkMessage,
         uploadReturnPhoto, signedPhotoUrl }
  from './app.js?v=2026-09-08-15';

$('#chrome').innerHTML = chrome('return.html');
revealActiveTab();

// The `return_gear` replay handler now lives in app.js, so a queued return can be drained from ANY
// screen rather than only from this one. See BUILTIN_HANDLERS there.
initOffline();

const orderId = new URLSearchParams(location.search).get('order');
let ORDER = null, CUSTOMER = null, OUTSTANDING = [], PRODUCTS = new Map(), LOCS = [], LINES = [];
// Returns written against this job TODAY that have not been corrected — the undo list.
let TODAY_BACK = [];
// Damage photographs taken but not yet written: key (the same key TICK uses) -> [{path, at}].
// They are already IN the bucket; what is pending is the movement row that makes them evidence.
const PHOTOS = new Map();
let FULFIL = null;
let TICK = new Map();   // key -> {kind:'unit'|'pool', ...}

requireSession(async () => { orderId ? load() : chooser(); });

async function chooser() {
  const app = $('#app');
  // Skeleton rows, not an empty div. Both queries below are round trips, and on a slow link this
  // screen showed the heading and then nothing at all — measured at 6s of blank warm page. Every
  // other list screen already had this; Return, which is the screen used standing at the van, did
  // not. The class is dropped again the moment real rows or a state block replace it.
  app.innerHTML = `<h1>Return</h1><p class="sub">Open the job that is coming back.</p>
    <div id="jobs" class="skeleton"><div class="skeleton__row"></div><div class="skeleton__row"></div></div>`;
  // The counts come from the view; the customer and the due date come from the order. Both are
  // needed on the row: chachu knows this job as "the Patel job at the stadium", not as
  // DJN-2609-0004, and OVERDUE is the reason he opened this screen at all. The list used to say
  // only an order number and a count, so telling which of four rows was the late one meant opening
  // each in turn. Overdue and merely out are different problems (CLAUDE.md), so they look different.
  const [f, o] = await Promise.all([
    sb.from('v_order_fulfilment').select('order_id,order_no,qty_outstanding,order_status'),
    sb.from('rental_order').select('id,expected_return_date,venue_name,customer:customer_id(name,business_name)'),
  ]);
  // className is cleared with every write below, or the skeleton's display:grid would stay
  // wrapped around whatever replaces it.
  $('#jobs').className = '';
  if (f.error || o.error) { $('#jobs').innerHTML = errorBlock(f.error || o.error); return; }
  const ORD = new Map((o.data ?? []).map(r => [r.id, r]));
  const today = todayLocal();
  const out = (f.data ?? []).filter(x => x.qty_outstanding > 0)
    // Latest due date first: the most overdue job is the one to open.
    .sort((a, b) => (ORD.get(a.order_id)?.expected_return_date ?? '')
      .localeCompare(ORD.get(b.order_id)?.expected_return_date ?? ''));

  $('#jobs').innerHTML = out.length
    ? `<div class="list">${out.map(x => {
        const r = ORD.get(x.order_id) ?? {};
        const cust = r.customer?.business_name || r.customer?.name || '';
        // Rule 2: late because nothing has been returned, compared against the calendar only to
        // decide what to CALL it — never to infer that anything came back.
        const late = r.expected_return_date && r.expected_return_date < today;
        return `<a class="item" href="return.html?order=${esc(x.order_id)}">
        <span class="item__main">
          <span class="item__title">${esc(x.order_no)}${cust ? ' — ' + esc(cust) : ''}</span>
          <span class="item__meta">due ${esc(fmtDate(r.expected_return_date))}${
            r.venue_name ? ' · ' + esc(r.venue_name) : ''}</span>
          <span class="item__meta">
            <!-- Every job on this list is out, so red on the count would say nothing. Overdue is
                 the thing that separates one row from another here, so it gets the colour. -->
            <span class="badge badge--muted">${esc(x.qty_outstanding)} still out</span>
            ${late ? '<span class="badge badge--out">overdue</span>' : ''}
            ${['cancelled', 'closed'].includes(x.order_status)
              ? `<span class="badge badge--${esc(x.order_status)}">order ${esc(x.order_status)}</span>` : ''}
          </span></span>
        <span class="item__right">›</span></a>`;
      }).join('')}</div>`
    : stateBlock({ icon: '✅', title: 'Nothing is out',
        body: 'Everything that went out has come back, been written off, or been marked lost. Nothing is with a customer.' });
}

async function load() {
  const app = $('#app');
  app.innerHTML = `<div id="head"></div><div id="body" class="skeleton"><div class="skeleton__row"></div></div>`;
  try {
    const [o, oo, locs, lines, ful, back] = await Promise.all([
      sb.from('rental_order').select('*, customer:customer_id(id,name,business_name)').eq('id', orderId).single(),
      // What is still out comes from the view, never from a date. An item is outstanding because
      // no return movement exists for it — rule 2, and the reason this screen cannot guess.
      sb.from('v_order_outstanding').select('*').eq('order_id', orderId),
      sb.from('location').select('id,name,type').eq('active', true).order('name'),
      sb.from('order_line').select('product_id,qty').eq('order_id', orderId),
      sb.from('v_order_fulfilment').select('qty_returned,qty_dispatched').eq('order_id', orderId).maybeSingle(),
      // v_movement_effective, NOT movement: a return that has already been corrected must not be
      // offered for correcting a second time (0019 refuses it, but offering it would be a button
      // whose only outcome is an error).
      sb.from('v_movement_effective')
        .select('id,unit_id,product_id,qty,moved_on,notes')
        .eq('order_id', orderId).eq('movement_type', 'return').eq('moved_on', todayLocal())
        .order('created_at', { ascending: false }),
    ]);
    for (const r of [o, oo, locs, lines]) if (r.error) throw r.error;
    TODAY_BACK = back.error ? [] : (back.data ?? []);
    FULFIL = ful.error ? null : ful.data;
    ORDER = o.data; CUSTOMER = o.data.customer; OUTSTANDING = oo.data ?? []; LOCS = locs.data ?? [];
    LINES = lines.data ?? [];

    const ids = [...new Set([...OUTSTANDING, ...TODAY_BACK].map(r => r.product_id))];
    if (ids.length) {
      const p = await sb.from('product').select('id,short_code,model_name,tracking_mode,inclusions,default_purchase_cost').in('id', ids);
      if (p.error) throw p.error;
      PRODUCTS = new Map((p.data ?? []).map(x => [x.id, x]));
      // A lost piece proposes its OWN purchase cost, not the product default — a 2019 box and its
      // 2024 replacement cost different amounts (docs/decisions.md).
      const unitIds = [...OUTSTANDING, ...TODAY_BACK].filter(r => r.unit_id).map(r => r.unit_id);
      if (unitIds.length) {
        const u = await sb.from('unit').select('id,purchase_cost,piece_no').in('id', unitIds);
        if (!u.error) for (const row of u.data) {
          UNIT_COST.set(row.id, row.purchase_cost);
          PIECE_NO.set(row.id, row.piece_no);
        }
      }
    }
    render();
  } catch (err) {
    $('#body').className = '';
    $('#body').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
}
const UNIT_COST = new Map();
const PIECE_NO = new Map();

function render() {
  const cust = CUSTOMER?.business_name || CUSTOMER?.name || 'customer';
  const overdue = OUTSTANDING.some(r => (r.days_overdue ?? 0) > 0);
  $('#head').innerHTML = `
    <div class="row row--between">
      <div><h1>${esc(ORDER.order_no)}</h1>
        <p class="sub">${esc(cust)} · due back ${esc(fmtDate(ORDER.expected_return_date))}
          ${overdue ? '<span class="badge badge--out">overdue</span>' : ''}</p></div>
      <!-- THIS ORDER, not the list of orders. It said "Order" and went to orders.html, so the one
           question asked from this screen — what was agreed on this job — landed on six cards to
           search through, and coming back lost every tick. orders.html?order=<id> opens that
           order's sheet directly; it is the same deep link the Today cards use. -->
      <a class="btn btn--ghost btn--sm" href="orders.html?order=${esc(ORDER.id)}">Open the order</a>
    </div>
    <div class="card">
      <div class="grid2">
        <label class="field"><span class="field__label">Coming back to *</span>
          <select class="field__select" id="f-loc">
            ${LOCS.map(l => `<option value="${esc(l.id)}">${esc(l.name)} (${esc(l.type)})</option>`).join('')}
          </select>
          <span class="field__hint">Need not be where it left from — gear often comes back to a
            different godown, and the ledger records where it actually went.</span></label>
        <label class="field"><span class="field__label">Date back</span>
          <input class="field__input" id="f-date" type="date" value="${esc(todayLocal())}"
                 max="${esc(todayLocal())}"></label>
      </div>
      <dl class="kv">
        <dt>Deposit held</dt><dd>${money(ORDER.deposit_amount)}</dd>
      </dl>
    </div>`;

  const body = $('#body');
  body.className = '';

  if (!OUTSTANDING.length) {
    body.innerHTML = stateBlock({
      icon: '✅', title: 'Nothing is outstanding on this job',
      body: 'Everything that went out has come back, been written off, or been marked lost. '
          + (ORDER.status === 'closed' ? 'The order is already closed.' : 'The order can now be closed.'),
      actionLabel: ORDER.status === 'closed' ? '' : 'Close this order', actionId: 'close-order',
    });
    $('#close-order')?.addEventListener('click', closeOrder);
    renderUndo(body);
    return;
  }

  body.innerHTML = `
    <div class="card">
      <p class="field__hint" style="margin-top:0">
        Tick each item as it physically comes back. <strong>An unticked item stays out</strong> — nothing
        here is ever inferred from a date passing. That is the bug this screen exists to prevent:
        six went out, five came back, and the sixth was quietly offered for hire while it sat in a hall.
      </p>
      <!-- THE COMMON CASE IS THAT EVERYTHING CAME BACK. Gear arrives at 2am after a wedding, in
           the dark, and the work should be describing the exceptions rather than confirming the
           rule — a screen that makes the ordinary night slow is a screen filled in from memory on
           Sunday, which is wrong in the same direction and later.
           THE COUNT IS ON THE BUTTON, never the bare word "All". Tapping something that says 6
           while holding 5 is a different mistake from tapping a word, and it is the only thing
           standing between the tap and the number. It TICKS; the sticky bar still records. -->
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button class="btn btn--primary" id="tick-all" type="button">All ${esc(OUTSTANDING.length)} back</button>
        <button class="btn btn--sm" id="tick-none" type="button" hidden>Clear</button>
        <span class="field__hint" style="margin:0">Then untick anything that did not come back.</span>
      </div>
      <div id="rows"></div>
      <div id="short-share" style="margin-top:12px"></div>
    </div>
    <div class="card" id="money"></div>
    <div id="undo"></div>
    <div class="dispatch-bar">
      <div id="ret-summary" class="field__hint"></div>
      <button class="btn btn--primary btn--block" id="go">Record returns</button>
    </div>`;
  renderUndo();
  renderShortShare();

  $('#rows').innerHTML = OUTSTANDING.map((r, i) => {
    const p = PRODUCTS.get(r.product_id);
    const key = r.unit_id ?? `pool:${r.product_id}`;
    const isUnit = !!r.unit_id;
    const incl = Array.isArray(p?.inclusions) ? p.inclusions : [];
    return `<div class="ret-row" data-key="${esc(key)}">
      <div class="ret-row__tick"><input type="checkbox" class="tick" id="t-${i}" data-key="${esc(key)}"
        aria-label="Returned"></div>
      <div class="ret-row__main">
        <label for="t-${i}">
          <span class="ret-row__no">${esc(p?.short_code ?? '?')}${isUnit ? ' · piece ' + esc(r.piece_no) : ''}</span>
          ${!isUnit ? `<span class="badge badge--pool">${esc(r.qty_outstanding)} out</span>` : ''}
          ${(r.days_overdue ?? 0) > 0 ? `<span class="badge badge--out">${esc(r.days_overdue)}d late</span>` : ''}
        </label>
        <div class="ret-detail" id="d-${i}" hidden>
          ${isUnit ? `
            <div class="grid2">
              <label class="field"><span class="field__label">Condition back</span>
                <select class="field__select r-cond">
                  ${['good','minor_wear','needs_attention','damaged','not_working'].map(c =>
                    `<option value="${c}">${c.replace('_',' ')}</option>`).join('')}
                </select></label>
              <label class="field"><span class="field__label">Damage deduction (₹)</span>
                <input class="field__input r-damage" type="number" min="0" step="0.01" inputmode="decimal" value="0">
                <span class="field__hint">Comes out of the deposit first. Anything over it is billed
                  as a charge on the job.</span></label>
            </div>
            ${incl.length ? `<div class="pill-row">${incl.map(x => `
              <label class="field field--inline" style="margin:0">
                <input type="checkbox" class="r-incl" data-item="${esc(x)}" checked>
                <span>${esc(x)}</span></label>`).join('')}</div>
              <span class="field__hint">Untick anything that did not come back with it.</span>` : ''}
            <label class="field field--inline" style="margin-top:10px">
              <input type="checkbox" class="r-lost">
              <span>Not coming back — mark this piece lost</span></label>
            <div class="r-lost-box" hidden>
              <label class="field"><span class="field__label">Charge for the loss (₹)</span>
                <input class="field__input r-lostamt" type="number" min="0" step="0.01" inputmode="decimal"
                       value="${esc(UNIT_COST.get(r.unit_id) ?? p?.default_purchase_cost ?? 0)}">
                <span class="field__hint">Proposed from this piece's own purchase cost. Edit it — an old
                  box costs more to replace than it cost to buy, and this is the moment that conversation
                  happens. The piece is marked lost, never deleted, and its number is never reissued.</span></label>
            </div>`
          : `<label class="field"><span class="field__label">How many came back?</span>
               <input class="field__input r-qty" type="number" min="0" max="${esc(r.qty_outstanding)}"
                      step="1" inputmode="numeric" value="${esc(r.qty_outstanding)}">
               <span class="field__hint">${esc(r.qty_outstanding)} still out. Counted stock has no piece
                 numbers, so this is a quantity.</span></label>
             <label class="field"><span class="field__label">Written off (lost or destroyed)</span>
               <input class="field__input r-writeoff" type="number" min="0" max="${esc(r.qty_outstanding)}"
                      step="1" inputmode="numeric" value="0">
               <span class="field__hint">Closes the loop: without this, cables lost at a venue read as
                 sitting with the customer for ever and the job can never close.</span></label>`}
          ${isUnit ? photoBlock(key) : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  $$('.tick').forEach((cb, i) => cb.addEventListener('change', () => {
    $(`#d-${i}`).hidden = !cb.checked;
    const key = cb.dataset.key;
    if (cb.checked) TICK.set(key, i); else TICK.delete(key);
    paint();
  }));
  $$('.r-lost').forEach(cb => cb.addEventListener('change', () => {
    cb.closest('.ret-detail').querySelector('.r-lost-box').hidden = !cb.checked;
    paint();
  }));
  $$('.r-damage, .r-lostamt, .r-qty, .r-writeoff').forEach(el => el.addEventListener('input', paint));
  $$('.photo-input').forEach(el => el.addEventListener('change', e => addPhoto(e.target)));
  $$('.photos').forEach(el => paintStrip(el.dataset.key));
  $('#go').addEventListener('click', doReturn);

  // Ticks every row and opens each row's detail, so what is about to be recorded is on screen
  // before the sticky button is pressed. Deliberately two taps, not one: the tick is the claim and
  // "Record returns" is the commitment, and the second tap is what a person can still stop at.
  $('#tick-all').addEventListener('click', () => {
    $$('.tick').forEach(cb => { if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change', { bubbles: true })); } });
  });
  $('#tick-none').addEventListener('click', () => {
    $$('.tick').forEach(cb => { if (cb.checked) { cb.checked = false; cb.dispatchEvent(new Event('change', { bubbles: true })); } });
  });
  paint();
}

// ---------------------------------------------------------------------------
// THE WAY BACK OUT.
//
// "All 6 back" is only safe because this exists. A return cannot be deleted — DELETE on movement
// is blocked and always will be (rule 12) — so 0019 added a `correction` row that names the
// movement it undoes and that every derived view nets out. This is where it is written.
//
// Only TODAY's returns on this job are offered, and only ones nothing has happened after: 0019
// refuses a correction that is not the piece's most recent movement, and a button whose only
// outcome is an error message is worse than no button.
// ---------------------------------------------------------------------------
// "Came back short." Offered only when a return has ALREADY been recorded on this job and
// something is still out — that is the moment the message is true. Before anything comes back,
// nothing is short; it has simply not arrived yet, and telling a customer their gear is missing on
// the morning of their event is how a customer is lost.
function renderShortShare() {
  const host = $('#short-share');
  if (!host) return;
  const anyBack = TODAY_BACK.length > 0 || (FULFIL?.qty_returned ?? 0) > 0;
  if (!anyBack || !OUTSTANDING.length) { host.innerHTML = ''; return; }
  const missing = OUTSTANDING.map(r => {
    const p = PRODUCTS.get(r.product_id);
    return r.unit_id
      ? `${p?.short_code ?? '?'} piece ${r.piece_no}`
      : `${r.qty_outstanding} \u00D7 ${p?.model_name ?? p?.short_code ?? 'items'}`;
  });
  const msg = waMessage('came_back_short', { order: { ...ORDER, customer: CUSTOMER }, missing });
  host.innerHTML = `<a class="btn btn--wa" target="_blank" rel="noopener"
      href="${esc(waLink(CUSTOMER?.whatsapp, msg))}">Ask them about the ${esc(missing.length)} still out</a>
    <span class="field__hint" style="margin-top:6px">Opens a draft listing exactly what has not come
      back. Nothing is charged for by sending it — it does not send, and it charges nothing either way.</span>`;
}

function renderUndo(host) {
  const box = host ? (() => { const d = document.createElement('div'); host.appendChild(d); return d; })()
                   : $('#undo');
  if (!box) return;
  if (!TODAY_BACK.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="card">
    <h2 style="font-size:16px;margin:0 0 4px">Recorded back today</h2>
    <p class="field__hint" style="margin-top:0">If one of these did not actually come back, say so
      now — it goes straight back to being out. Nothing is deleted: the return stays in the piece's
      history marked corrected, so the record still says what happened.</p>
    <div class="list">${TODAY_BACK.map(m => {
      const p = PRODUCTS.get(m.product_id);
      const what = m.unit_id
        ? `${esc(p?.short_code ?? '?')} · piece ${esc(PIECE_NO.get(m.unit_id) ?? '?')}`
        : `${esc(m.qty)} × ${esc(p?.model_name ?? p?.short_code ?? 'counted stock')}`;
      return `<div class="item" style="cursor:default">
        <span class="item__main"><span class="item__title">${what}</span>
          <span class="item__meta">recorded back today${m.notes ? ' · ' + esc(m.notes) : ''}</span></span>
        <button class="btn btn--sm undo-back" data-id="${esc(m.id)}" data-what="${what.replace(/"/g, '&quot;')}"
                type="button">Still out</button>
      </div>`;
    }).join('')}</div>
  </div>`;
  $$('.undo-back', box).forEach(b => b.addEventListener('click', () => undoReturn(b)));
}

async function undoReturn(btn) {
  const what = btn.dataset.what.replace(/<[^>]*>/g, '');
  if (!confirm(`Put ${what} back to being OUT?\n\nThe return stays in the history marked corrected — `
             + `nothing is deleted. Do this only if it did not physically come back.`)) return;
  // 0020 requires a reason of at least eight characters and refuses the write without one. Asking
  // here rather than letting the database refuse means the operator gets the question, not an
  // error — but the floor is the SAME floor, so the screen cannot drift from the guard.
  let why = '';
  for (;;) {
    why = (prompt('Why? This is written next to the correction and is what the history will say '
                + 'three weeks later when a customer disputes it.', why || 'not actually returned') || '').trim();
    if (!why) return;                                   // cancelled — nothing is written
    if (why.length >= 8) break;
    alert('A few words, please — at least eight characters. "not back" is enough; "oops" is not.\n\n'
        + 'The movement stays in the history for ever, flagged, and this sentence is the only '
        + 'record of what actually happened.');
  }
  btn.disabled = true; btn.textContent = 'Undoing…';
  try {
    const { error } = await sb.from('movement').insert({
      movement_type: 'correction',
      corrects_movement_id: btn.dataset.id,
      moved_on: todayLocal(),
      qty: 1,                       // the trigger overwrites this from the target
      from_kind: 'none', to_kind: 'none',
      notes: why,
    });
    if (error) throw error;
    toast('Put back to out. The return is still in the history, marked corrected.');
    await load();
  } catch (err) {
    // 0019's refusals are written to be read by a person — show them as they are.
    toast(err?.message || 'Could not undo that return.', 'error');
    btn.disabled = false; btn.textContent = 'Still out';
  }
}

// ---------------------------------------------------------------------------
// DAMAGE PHOTOGRAPHS (0028).
//
// Here, in the row, under the deduction — not on a separate screen and not afterwards. The moment
// the number goes in the box is the moment the operator is looking at the crack, and it is the only
// moment he will ever be looking at it.
//
// IT UPLOADS IMMEDIATELY, AND THE PATH IS HELD UNTIL "Record returns". It has to work that way:
// `movement` is append-only (0009), so photos land in the INSERT that writes the return or they
// never land at all. Uploading first also means a photograph survives a failed save — the file is
// in the bucket under the order id, and 0028's policy lets it be replaced or removed right up
// until a movement points at it.
// ---------------------------------------------------------------------------

// NUMBERED PIECES ONLY, AND THAT IS A GAP RATHER THAN A DESIGN. `movement.photos` takes a photo on
// any row, and a write-off of twenty cables lost at a venue is exactly a money conversation. But
// `v_unit_history` — the only screen that reads photos back — filters `unit_id is not null`, so a
// photograph on a pooled row would be written, charged for, and viewable nowhere. Collecting
// evidence that cannot be shown is worse than not offering to collect it. In docs/backlog.md with
// the read path it needs.
function photoBlock(key) {
  return `<div class="photos" data-key="${esc(key)}">
      <label class="btn btn--sm file-btn photo-btn">
        Add a photo
        <input type="file" class="photo-input" accept="image/*" capture="environment"
               data-key="${esc(key)}">
      </label>
      <span class="field__hint">Only staff see these — never the customer's portal. Worth one
        whenever money comes off the deposit: the argument happens next week, on the telephone.</span>
      <div class="thumbs photo-strip"></div>
    </div>`;
}

async function paintStrip(key) {
  const host = $(`.photos[data-key="${CSS.escape(key)}"] .photo-strip`);
  if (!host) return;
  const list = PHOTOS.get(key) ?? [];
  if (!list.length) { host.innerHTML = ''; return; }
  // Mint the links now rather than at upload time: a signed URL lives two minutes, and a return
  // takes longer than that to record.
  const urls = await Promise.all(list.map(ph => signedPhotoUrl(ph.path)));
  host.innerHTML = list.map((ph, i) => `
    <div class="thumb">
      ${urls[i] ? `<img src="${esc(urls[i])}" alt="Damage photo ${i + 1}">`
                : `<div class="thumb__missing" title="${esc(ph.path)}">saved</div>`}
      <button type="button" class="btn btn--ghost btn--sm thumb__btn photo-drop"
              data-key="${esc(key)}" data-path="${esc(ph.path)}">Remove</button>
    </div>`).join('');
  $$('.photo-drop', host).forEach(b => b.addEventListener('click', () => dropPhoto(b.dataset.key, b.dataset.path, b)));
}

async function addPhoto(input) {
  const key = input.dataset.key;
  const file = input.files?.[0];
  input.value = '';                       // else the same file twice fires no change event
  if (!file) return;

  // RULE 15: name the cause we have evidence for. A photograph needs the network — the return
  // itself does not, and the queue will still carry it — so this says which half is blocked
  // instead of letting an upload fail into a red box that reads as "the return did not save".
  if (!navigator.onLine) {
    toast('No signal, so the photo cannot go up. The return itself will still save and wait on '
        + 'this phone — but come back and photograph it while the piece is still in front of you.', 'error');
    return;
  }

  const btn = input.closest('.file-btn');
  const label = btn.firstChild?.nodeValue;
  btn.classList.add('is-busy'); if (btn.firstChild) btn.firstChild.nodeValue = ' Uploading… ';
  input.disabled = true;
  try {
    const path = await uploadReturnPhoto(orderId, file);
    PHOTOS.set(key, [...(PHOTOS.get(key) ?? []), { path, at: todayLocal() }]);
    await paintStrip(key);
    paint();
  } catch (err) {
    console.error('[return] photo upload failed', err);
    toast(`The photo did not upload: ${friendly(err)}`, 'error');
  } finally {
    btn.classList.remove('is-busy'); if (btn.firstChild) btn.firstChild.nodeValue = label;
    input.disabled = false;
  }
}

// Removing one BEFORE the return is recorded. After it, 0028 refuses — the photograph is attached
// to an append-only row and the correction path is the only way to say the record is wrong.
async function dropPhoto(key, path, btn) {
  btn.disabled = true; btn.textContent = 'Removing…';
  const { error } = await sb.storage.from('return-photos').remove([path]);
  if (error) {
    console.error('[return] photo remove failed', error);
    toast(`Could not remove it: ${friendly(error)}`, 'error');
    btn.disabled = false; btn.textContent = 'Remove'; return;
  }
  PHOTOS.set(key, (PHOTOS.get(key) ?? []).filter(ph => ph.path !== path));
  await paintStrip(key);
  paint();
}

function collect() {
  const out = [];
  OUTSTANDING.forEach((r, i) => {
    const key = r.unit_id ?? `pool:${r.product_id}`;
    if (!TICK.has(key)) return;
    const d = $(`#d-${i}`);
    if (r.unit_id) {
      out.push({
        kind: 'unit', row: r,
        condition: $('.r-cond', d)?.value ?? 'good',
        damage: Number($('.r-damage', d)?.value || 0),
        lost: !!$('.r-lost', d)?.checked,
        lostAmount: Number($('.r-lostamt', d)?.value || 0),
        inclusions: $$('.r-incl', d).filter(x => x.checked).map(x => x.dataset.item),
        photos: PHOTOS.get(key) ?? [],
      });
    } else {
      out.push({
        kind: 'pool', row: r,
        qty: Number($('.r-qty', d)?.value || 0),
        writeoff: Number($('.r-writeoff', d)?.value || 0),
        photos: PHOTOS.get(key) ?? [],
      });
    }
  });
  return out;
}

function paint() {
  const picked = collect();
  const damage = picked.reduce((n, p) => n + (p.kind === 'unit' ? (p.lost ? p.lostAmount : p.damage) : 0), 0);
  const deposit = Number(ORDER.deposit_amount || 0);
  const fromDeposit = Math.min(damage, deposit);
  const excess = Math.max(damage - deposit, 0);

  // Rule 6, on the screen where it is easiest to get wrong. The deposit is the customer's money;
  // damage comes out of it first, and only what is left over becomes a charge on the job.
  $('#money').innerHTML = `
    <strong>Deposit and damage</strong>
    <dl class="kv" style="margin-top:8px">
      <dt>Deposit held</dt><dd>${money(deposit)}</dd>
      <dt>Damage and loss on this return</dt><dd>${money(damage)}</dd>
      <dt>Taken from the deposit</dt><dd>${money(fromDeposit)}</dd>
      <dt>Deposit remaining</dt><dd>${money(deposit - fromDeposit)}</dd>
      <dt><strong>Billed as a charge</strong></dt><dd><strong>${money(excess)}</strong></dd>
    </dl>
    ${excess > 0 ? `<p class="field__hint">More damage than deposit. The excess is added to the job as a
      damage charge — the deposit is not allowed to go negative.</p>` : ''}
    ${damage > 0 ? `<p class="field__hint">Nothing is deducted from the deposit ledger automatically here;
      the deduction is recorded when the deposit is actually settled, on the payments screen.</p>` : ''}
    ${(() => {
      // Evidence, counted where the deduction is decided. Money coming off a deposit with no
      // photograph behind it is the version of this conversation that goes badly next week.
      const shots = picked.reduce((n, p) => n + (p.photos?.length ?? 0), 0);
      if (shots) return `<p class="field__hint">${shots} photo${shots === 1 ? '' : 's'} will be
        attached — staff only, never the portal.</p>`;
      return damage > 0
        ? `<p class="note note--warn" style="margin-top:8px">Money is coming off this deposit and
           there is no photograph. Add one in the row above while the piece is still in front of
           you — a movement cannot be photographed after it is recorded.</p>` : '';
    })()}`;

  // ---------------------------------------------------------------------------
  // MORE CANNOT COME BACK THAN WENT OUT.
  //
  // Measured, signed in, on a pooled line with 12 out: typing 99 into "How many came back?" was
  // accepted in full. The input carries max="12" and nothing reads it — a native max is only
  // enforced by form validation, and this is not a form. The summary then read "0 still out after
  // this" and Record returns stayed enabled.
  //
  // What it costs: v_pool_stock nets returns into on-hand and owned, so 99 back off 12 out adds
  // 87 cables nobody ever bought, and fn_availability offers them for hire. docs/backlog.md
  // records that an over-return does NOT surface in v_order_outstanding either — the `> 0` filter
  // hides it — so it appears only as has_ledger_error on a screen nobody has open. The typo has
  // to be refused where it is typed.
  //
  // Returned + written off is capped together, not separately: 9 back and 9 lost out of 12 is the
  // same impossible claim as 18 back.
  // ---------------------------------------------------------------------------
  const over = picked.filter(p => p.kind === 'pool'
    && (p.qty + p.writeoff) > Number(p.row.qty_outstanding ?? 0));

  if (over.length) {
    $('#ret-summary').innerHTML = over.map(p =>
      `<strong>${esc(p.row.short_code)}: ${esc(p.qty + p.writeoff)} accounted for, only
       ${esc(p.row.qty_outstanding)} went out.</strong> Returned plus written off cannot be more
       than what is still out.`).join('<br>');
    $('#ret-summary').className = 'field__hint dispatch-bar__warn';
    $('#go').disabled = true;
    return;
  }

  $('#ret-summary').className = 'field__hint';
  // "All 6 back" is pointless once six are ticked, and "Clear" is pointless while none are.
  const allTicked = picked.length === OUTSTANDING.length;
  if ($('#tick-all')) $('#tick-all').hidden = allTicked;
  if ($('#tick-none')) $('#tick-none').hidden = picked.length === 0;
  const remaining = OUTSTANDING.length - picked.length;
  $('#ret-summary').textContent = picked.length
    ? `${picked.length} item(s) ticked. ${remaining} still out after this.`
    : 'Nothing ticked. An unticked item stays out.';
  $('#go').disabled = !picked.length;
}

async function doReturn() {
  const btn = $('#go');
  const picked = collect();
  const locId = $('#f-loc').value;
  const when = $('#f-date').value || todayLocal();
  if (!locId) { toast('Pick where it is coming back to.', 'error'); return; }

  // ONE id for the whole tap, shared by every movement this return writes — returns, write-offs
  // and all. Re-sending the batch collides on the first row and the whole INSERT rolls back, which
  // is right: recording six pieces back twice is the same six pieces, not twelve. Carried
  // unchanged into the offline queue, never regenerated on replay (0022).
  const requestId = newRequestId();
  const base = {
    request_id: requestId,
    order_id: orderId, from_kind: 'customer', from_id: CUSTOMER.id, moved_on: when,
  };
  const movements = [], lost = [], charges = [];
  let damage = 0;

  for (const p of picked) {
    if (p.kind === 'unit') {
      if (p.lost) {
        // Lost: it never comes back to a location. Written off FROM the customer, which is what
        // takes it out of "still at the customer" and lets the order close (rule 9).
        movements.push({ ...base, movement_type: 'write_off', unit_id: p.row.unit_id,
          product_id: p.row.product_id, qty: 1, to_kind: 'none',
          condition_at_move: p.condition, notes: 'lost at the venue', photos: p.photos });
        lost.push(p.row.unit_id);
        damage += p.lostAmount;
      } else {
        movements.push({ ...base, movement_type: 'return', unit_id: p.row.unit_id,
          product_id: p.row.product_id, qty: 1, to_kind: 'location', to_id: locId,
          condition_at_move: p.condition, inclusions_checked: p.inclusions, photos: p.photos });
        damage += p.damage;
      }
    } else {
      // The photograph goes on ONE row, never both: 0028's "is any movement pointing at this key"
      // test would otherwise be true twice, and a single file would read as two pieces of evidence.
      // A write-off is the one worth photographing, so it wins when there is one.
      if (p.qty > 0) movements.push({ ...base, movement_type: 'return', unit_id: null,
        product_id: p.row.product_id, qty: p.qty, to_kind: 'location', to_id: locId,
        photos: p.writeoff > 0 ? [] : p.photos });
      if (p.writeoff > 0) movements.push({ ...base, movement_type: 'write_off', unit_id: null,
        product_id: p.row.product_id, qty: p.writeoff, to_kind: 'none',
        notes: 'lost or destroyed at the venue', photos: p.photos });
    }
  }
  if (!movements.length) { toast('Nothing to record.', 'error'); return; }
  // 0024: the rows in one tap are numbered, because uniqueness is (request_id, request_seq). A
  // return of six pieces is six rows sharing one id, and with 0022's index on the id alone they
  // collided with each other inside their own INSERT.
  movements.forEach((m, i) => { m.request_seq = i; });

  const excess = Math.max(damage - Number(ORDER.deposit_amount || 0), 0);
  if (excess > 0) charges.push({ order_id: orderId, type: 'damage', amount: excess,
    description: 'Damage and loss beyond the deposit held' });

  btn.disabled = true; btn.textContent = 'Recording…';
  const payload = { movements, charges, lost_unit_ids: lost };
  const label = `Return ${movements.length} item(s) on ${ORDER.order_no}`;

  if (!navigator.onLine) {
    await store.enqueue('return_gear', payload, label);
    toast(`No signal — held on this phone and sent when the signal returns.`);
    btn.disabled = false; btn.textContent = 'Record returns';
    TICK.clear(); PHOTOS.clear(); await load(); return;
  }
  try {
    const { error } = await sb.from('movement').insert(movements);
    if (error) throw error;
    if (charges.length) {
      const c = await sb.from('order_charge').insert(charges);
      if (c.error) throw c.error;
    }
    for (const id of lost) {
      const u = await sb.from('unit').update({ lifecycle: 'lost' }).eq('id', id);
      if (u.error) throw u.error;
    }
    toast(`${movements.length} item(s) recorded.`);
    TICK.clear(); PHOTOS.clear();
    await load();
  } catch (err) {
    const msg = err?.message || String(err);
    if (/fetch|network|Failed to fetch/i.test(msg)) {
      await store.enqueue('return_gear', payload, label);
      toast('Connection dropped — held on this phone and sent when the signal returns.');
      TICK.clear(); PHOTOS.clear(); await load();
    } else { toast(friendly(err), 'error'); }
  } finally {
    btn.disabled = false; btn.textContent = 'Record returns';
  }
}

/**
 * A refusal in words. Same helper as dispatch.html, and for the same reason: this toasted
 * err.message raw, so a CHECK constraint reached the operator as
 *   new row for relation "movement" violates check constraint "movement_qty_positive"
 * and 0022's idempotency index reached him as a red "duplicate key" error on a return that had
 * already been recorded — which reads as "it did not save" and invites him to tick it all again.
 * The database's own guards raise sentences (0007-0021); those pass through.
 */
function friendly(e) {
  const m = e?.message || String(e ?? '');
  const net = networkMessage(e);
  if (net) return net;
  if (e?.code === '23505' || m.includes('uq_movement_request'))
    return 'This was already recorded — the same tap reached the server twice. Nothing was counted twice.';
  if (e?.code === '42501' || m.includes('row-level security'))
    return 'You are not signed in, or the session expired. Sign in again — nothing was recorded.';
  // A CHECK, a foreign key or a NOT NULL arrives as Postgres boilerplate naming an internal
  // constraint. Lead with what it means for him; keep the constraint name in brackets for whoever
  // has to debug it. `violates check constraint "movement_qty_positive"` is not a sentence
  // anybody standing at a van can act on.
  const c = m.match(/violates (?:check|foreign key|not-null) constraint "([^"]+)"/);
  if (c) return `The database refused this, so nothing was recorded. Check what is ticked and try `
             + `again — if it keeps refusing, this needs looking at. (${c[1]})`;
  return m.replace(/^.*?ERROR:\s*/, '');
}

async function closeOrder() {
  // The database refuses this while anything is outstanding (rule 9, enforced by a trigger). The
  // screen does not duplicate that check — it asks, and reports what comes back.
  const { error } = await sb.from('rental_order')
    .update({ status: 'closed', closed_at: new Date().toISOString() }).eq('id', orderId);
  if (error) { toast(error.message, 'error'); return; }
  toast('Order closed.');
  await load();
}

window.__djn = { reload: load };
</script>
