<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Return — DJ Network's</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=2026-09-07-5">
<script src="vendor/supabase.js?v=2026-09-07-5" defer></script>
<script src="boot.js?v=2026-09-07-5" defer></script>
</head>
<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title">DJ Network's</h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { sb, store, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock,
         errorBlock, toast, initOffline, registerQueueHandlers, revealActiveTab }
  from './app.js?v=2026-09-07-5';

$('#chrome').innerHTML = chrome('return.html');
revealActiveTab();

registerQueueHandlers({
  async return_gear(payload) {
    const { error } = await sb.from('movement').insert(payload.movements);
    if (error) throw error;
    if (payload.charges?.length) {
      const { error: e2 } = await sb.from('order_charge').insert(payload.charges);
      if (e2) throw e2;
    }
    if (payload.lost_unit_ids?.length) {
      // A lost piece is marked lost, never deleted. Its number dies with it and is never
      // reissued (rules 4 and 12).
      for (const id of payload.lost_unit_ids) {
        const { error: e3 } = await sb.from('unit').update({ lifecycle: 'lost' }).eq('id', id);
        if (e3) throw e3;
      }
    }
  },
});
initOffline();

const orderId = new URLSearchParams(location.search).get('order');
let ORDER = null, CUSTOMER = null, OUTSTANDING = [], PRODUCTS = new Map(), LOCS = [], LINES = [];
let TICK = new Map();   // key -> {kind:'unit'|'pool', ...}

requireSession(async () => { orderId ? load() : chooser(); });

async function chooser() {
  const app = $('#app');
  app.innerHTML = `<h1>Return</h1><p class="sub">Open the job that is coming back.</p><div id="jobs"></div>`;
  const { data, error } = await sb.from('v_order_fulfilment')
    .select('order_id,order_no,qty_outstanding,order_status,fulfilment_state');
  if (error) { $('#jobs').innerHTML = errorBlock(error); return; }
  const out = (data ?? []).filter(f => f.qty_outstanding > 0);
  $('#jobs').innerHTML = out.length
    ? `<div class="list">${out.map(f => `<a class="item" href="return.html?order=${esc(f.order_id)}">
        <span class="item__main"><span class="item__title">${esc(f.order_no)}</span>
        <span class="item__meta">${esc(f.qty_outstanding)} item(s) still out
          ${['cancelled','closed'].includes(f.order_status) ? '· order ' + esc(f.order_status) : ''}</span></span>
        <span class="item__right">›</span></a>`).join('')}</div>`
    : stateBlock({ icon: '✅', title: 'Nothing is out',
        body: 'Every dispatched item has been returned, written off, or marked lost. Nothing is with a customer.' });
}

async function load() {
  const app = $('#app');
  app.innerHTML = `<div id="head"></div><div id="body" class="skeleton"><div class="skeleton__row"></div></div>`;
  try {
    const [o, oo, locs, lines] = await Promise.all([
      sb.from('rental_order').select('*, customer:customer_id(id,name,business_name)').eq('id', orderId).single(),
      // What is still out comes from the view, never from a date. An item is outstanding because
      // no return movement exists for it — rule 2, and the reason this screen cannot guess.
      sb.from('v_order_outstanding').select('*').eq('order_id', orderId),
      sb.from('location').select('id,name,type').eq('active', true).order('name'),
      sb.from('order_line').select('product_id,qty').eq('order_id', orderId),
    ]);
    for (const r of [o, oo, locs, lines]) if (r.error) throw r.error;
    ORDER = o.data; CUSTOMER = o.data.customer; OUTSTANDING = oo.data ?? []; LOCS = locs.data ?? [];
    LINES = lines.data ?? [];

    const ids = [...new Set(OUTSTANDING.map(r => r.product_id))];
    if (ids.length) {
      const p = await sb.from('product').select('id,short_code,model_name,tracking_mode,inclusions,default_purchase_cost').in('id', ids);
      if (p.error) throw p.error;
      PRODUCTS = new Map((p.data ?? []).map(x => [x.id, x]));
      // A lost piece proposes its OWN purchase cost, not the product default — a 2019 box and its
      // 2024 replacement cost different amounts (docs/decisions.md).
      const unitIds = OUTSTANDING.filter(r => r.unit_id).map(r => r.unit_id);
      if (unitIds.length) {
        const u = await sb.from('unit').select('id,purchase_cost').in('id', unitIds);
        if (!u.error) for (const row of u.data) UNIT_COST.set(row.id, row.purchase_cost);
      }
    }
    render();
  } catch (err) {
    $('#body').className = '';
    $('#body').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
}
const UNIT_COST = new Map();

function render() {
  const cust = CUSTOMER?.business_name || CUSTOMER?.name || 'customer';
  const overdue = OUTSTANDING.some(r => (r.days_overdue ?? 0) > 0);
  $('#head').innerHTML = `
    <div class="row row--between">
      <div><h1>${esc(ORDER.order_no)}</h1>
        <p class="sub">${esc(cust)} · due back ${esc(fmtDate(ORDER.expected_return_date))}
          ${overdue ? '<span class="badge badge--out">overdue</span>' : ''}</p></div>
      <a class="btn btn--ghost btn--sm" href="orders.html">Order</a>
    </div>
    <div class="card">
      <div class="grid2">
        <label class="field"><span class="field__label">Coming back to *</span>
          <select class="field__select" id="f-loc">
            ${LOCS.map(l => `<option value="${esc(l.id)}">${esc(l.name)} (${esc(l.type)})</option>`).join('')}
          </select>
          <span class="field__hint">Need not be where it left from — gear often comes back to a
            different godown, and the ledger records where it actually went.</span></label>
        <label class="field"><span class="field__label">Date back</span>
          <input class="field__input" id="f-date" type="date" value="${esc(todayLocal())}"
                 max="${esc(todayLocal())}"></label>
      </div>
      <dl class="kv">
        <dt>Deposit held</dt><dd>${money(ORDER.deposit_amount)}</dd>
      </dl>
    </div>`;

  const body = $('#body');
  body.className = '';

  if (!OUTSTANDING.length) {
    body.innerHTML = stateBlock({
      icon: '✅', title: 'Nothing is outstanding on this job',
      body: 'Every item dispatched has been returned, written off, or marked lost. '
          + (ORDER.status === 'closed' ? 'The order is already closed.' : 'The order can now be closed.'),
      actionLabel: ORDER.status === 'closed' ? '' : 'Close this order', actionId: 'close-order',
    });
    $('#close-order')?.addEventListener('click', closeOrder);
    return;
  }

  body.innerHTML = `
    <div class="card">
      <p class="field__hint" style="margin-top:0">
        Tick each item as it physically comes back. <strong>An unticked item stays out</strong> — nothing
        here is ever inferred from a date passing. That is the bug this screen exists to prevent:
        six went out, five came back, and the sixth was quietly offered for hire while it sat in a hall.
      </p>
      <div id="rows"></div>
    </div>
    <div class="card" id="money"></div>
    <div class="dispatch-bar">
      <div id="ret-summary" class="field__hint"></div>
      <button class="btn btn--primary btn--block" id="go">Record returns</button>
    </div>`;

  $('#rows').innerHTML = OUTSTANDING.map((r, i) => {
    const p = PRODUCTS.get(r.product_id);
    const key = r.unit_id ?? `pool:${r.product_id}`;
    const isUnit = !!r.unit_id;
    const incl = Array.isArray(p?.inclusions) ? p.inclusions : [];
    return `<div class="ret-row" data-key="${esc(key)}">
      <div class="ret-row__tick"><input type="checkbox" class="tick" id="t-${i}" data-key="${esc(key)}"
        aria-label="Returned"></div>
      <div class="ret-row__main">
        <label for="t-${i}">
          <span class="ret-row__no">${esc(p?.short_code ?? '?')}${isUnit ? ' · piece ' + esc(r.piece_no) : ''}</span>
          ${!isUnit ? `<span class="badge badge--pool">${esc(r.qty_outstanding)} out</span>` : ''}
          ${(r.days_overdue ?? 0) > 0 ? `<span class="badge badge--out">${esc(r.days_overdue)}d late</span>` : ''}
        </label>
        <div class="ret-detail" id="d-${i}" hidden>
          ${isUnit ? `
            <div class="grid2">
              <label class="field"><span class="field__label">Condition back</span>
                <select class="field__select r-cond">
                  ${['good','minor_wear','needs_attention','damaged','not_working'].map(c =>
                    `<option value="${c}">${c.replace('_',' ')}</option>`).join('')}
                </select></label>
              <label class="field"><span class="field__label">Damage deduction (₹)</span>
                <input class="field__input r-damage" type="number" min="0" step="0.01" inputmode="decimal" value="0">
                <span class="field__hint">Comes out of the deposit first. Anything over it is billed
                  as a charge on the job.</span></label>
            </div>
            ${incl.length ? `<div class="pill-row">${incl.map(x => `
              <label class="field field--inline" style="margin:0">
                <input type="checkbox" class="r-incl" data-item="${esc(x)}" checked>
                <span>${esc(x)}</span></label>`).join('')}</div>
              <span class="field__hint">Untick anything that did not come back with it.</span>` : ''}
            <label class="field field--inline" style="margin-top:10px">
              <input type="checkbox" class="r-lost">
              <span>Not coming back — mark this piece lost</span></label>
            <div class="r-lost-box" hidden>
              <label class="field"><span class="field__label">Charge for the loss (₹)</span>
                <input class="field__input r-lostamt" type="number" min="0" step="0.01" inputmode="decimal"
                       value="${esc(UNIT_COST.get(r.unit_id) ?? p?.default_purchase_cost ?? 0)}">
                <span class="field__hint">Proposed from this piece's own purchase cost. Edit it — an old
                  box costs more to replace than it cost to buy, and this is the moment that conversation
                  happens. The piece is marked lost, never deleted, and its number is never reissued.</span></label>
            </div>`
          : `<label class="field"><span class="field__label">How many came back?</span>
               <input class="field__input r-qty" type="number" min="0" max="${esc(r.qty_outstanding)}"
                      step="1" inputmode="numeric" value="${esc(r.qty_outstanding)}">
               <span class="field__hint">${esc(r.qty_outstanding)} still out. Counted stock has no piece
                 numbers, so this is a quantity.</span></label>
             <label class="field"><span class="field__label">Written off (lost or destroyed)</span>
               <input class="field__input r-writeoff" type="number" min="0" max="${esc(r.qty_outstanding)}"
                      step="1" inputmode="numeric" value="0">
               <span class="field__hint">Closes the loop: without this, cables lost at a venue read as
                 sitting with the customer for ever and the job can never close.</span></label>`}
        </div>
      </div>
    </div>`;
  }).join('');

  $$('.tick').forEach((cb, i) => cb.addEventListener('change', () => {
    $(`#d-${i}`).hidden = !cb.checked;
    const key = cb.dataset.key;
    if (cb.checked) TICK.set(key, i); else TICK.delete(key);
    paint();
  }));
  $$('.r-lost').forEach(cb => cb.addEventListener('change', () => {
    cb.closest('.ret-detail').querySelector('.r-lost-box').hidden = !cb.checked;
    paint();
  }));
  $$('.r-damage, .r-lostamt, .r-qty, .r-writeoff').forEach(el => el.addEventListener('input', paint));
  $('#go').addEventListener('click', doReturn);
  paint();
}

function collect() {
  const out = [];
  OUTSTANDING.forEach((r, i) => {
    const key = r.unit_id ?? `pool:${r.product_id}`;
    if (!TICK.has(key)) return;
    const d = $(`#d-${i}`);
    if (r.unit_id) {
      out.push({
        kind: 'unit', row: r,
        condition: $('.r-cond', d)?.value ?? 'good',
        damage: Number($('.r-damage', d)?.value || 0),
        lost: !!$('.r-lost', d)?.checked,
        lostAmount: Number($('.r-lostamt', d)?.value || 0),
        inclusions: $$('.r-incl', d).filter(x => x.checked).map(x => x.dataset.item),
      });
    } else {
      out.push({
        kind: 'pool', row: r,
        qty: Number($('.r-qty', d)?.value || 0),
        writeoff: Number($('.r-writeoff', d)?.value || 0),
      });
    }
  });
  return out;
}

function paint() {
  const picked = collect();
  const damage = picked.reduce((n, p) => n + (p.kind === 'unit' ? (p.lost ? p.lostAmount : p.damage) : 0), 0);
  const deposit = Number(ORDER.deposit_amount || 0);
  const fromDeposit = Math.min(damage, deposit);
  const excess = Math.max(damage - deposit, 0);

  // Rule 6, on the screen where it is easiest to get wrong. The deposit is the customer's money;
  // damage comes out of it first, and only what is left over becomes a charge on the job.
  $('#money').innerHTML = `
    <strong>Deposit and damage</strong>
    <dl class="kv" style="margin-top:8px">
      <dt>Deposit held</dt><dd>${money(deposit)}</dd>
      <dt>Damage and loss on this return</dt><dd>${money(damage)}</dd>
      <dt>Taken from the deposit</dt><dd>${money(fromDeposit)}</dd>
      <dt>Deposit remaining</dt><dd>${money(deposit - fromDeposit)}</dd>
      <dt><strong>Billed as a charge</strong></dt><dd><strong>${money(excess)}</strong></dd>
    </dl>
    ${excess > 0 ? `<p class="field__hint">More damage than deposit. The excess is added to the job as a
      damage charge — the deposit is not allowed to go negative.</p>` : ''}
    ${damage > 0 ? `<p class="field__hint">Nothing is deducted from the deposit ledger automatically here;
      the deduction is recorded when the deposit is actually settled, on the payments screen.</p>` : ''}`;

  const remaining = OUTSTANDING.length - picked.length;
  $('#ret-summary').textContent = picked.length
    ? `${picked.length} item(s) ticked. ${remaining} still out after this.`
    : 'Nothing ticked. An unticked item stays out.';
  $('#go').disabled = !picked.length;
}

async function doReturn() {
  const btn = $('#go');
  const picked = collect();
  const locId = $('#f-loc').value;
  const when = $('#f-date').value || todayLocal();
  if (!locId) { toast('Pick where it is coming back to.', 'error'); return; }

  const base = {
    order_id: orderId, from_kind: 'customer', from_id: CUSTOMER.id, moved_on: when,
  };
  const movements = [], lost = [], charges = [];
  let damage = 0;

  for (const p of picked) {
    if (p.kind === 'unit') {
      if (p.lost) {
        // Lost: it never comes back to a location. Written off FROM the customer, which is what
        // takes it out of "still at the customer" and lets the order close (rule 9).
        movements.push({ ...base, movement_type: 'write_off', unit_id: p.row.unit_id,
          product_id: p.row.product_id, qty: 1, to_kind: 'none',
          condition_at_move: p.condition, notes: 'lost at the venue' });
        lost.push(p.row.unit_id);
        damage += p.lostAmount;
      } else {
        movements.push({ ...base, movement_type: 'return', unit_id: p.row.unit_id,
          product_id: p.row.product_id, qty: 1, to_kind: 'location', to_id: locId,
          condition_at_move: p.condition, inclusions_checked: p.inclusions });
        damage += p.damage;
      }
    } else {
      if (p.qty > 0) movements.push({ ...base, movement_type: 'return', unit_id: null,
        product_id: p.row.product_id, qty: p.qty, to_kind: 'location', to_id: locId });
      if (p.writeoff > 0) movements.push({ ...base, movement_type: 'write_off', unit_id: null,
        product_id: p.row.product_id, qty: p.writeoff, to_kind: 'none',
        notes: 'lost or destroyed at the venue' });
    }
  }
  if (!movements.length) { toast('Nothing to record.', 'error'); return; }

  const excess = Math.max(damage - Number(ORDER.deposit_amount || 0), 0);
  if (excess > 0) charges.push({ order_id: orderId, type: 'damage', amount: excess,
    description: 'Damage and loss beyond the deposit held' });

  btn.disabled = true; btn.textContent = 'Recording…';
  const payload = { movements, charges, lost_unit_ids: lost };
  const label = `Return ${movements.length} item(s) on ${ORDER.order_no}`;

  if (!navigator.onLine) {
    await store.enqueue('return_gear', payload, label);
    toast(`No signal — held on this phone and sent when the signal returns.`);
    btn.disabled = false; btn.textContent = 'Record returns';
    TICK.clear(); await load(); return;
  }
  try {
    const { error } = await sb.from('movement').insert(movements);
    if (error) throw error;
    if (charges.length) {
      const c = await sb.from('order_charge').insert(charges);
      if (c.error) throw c.error;
    }
    for (const id of lost) {
      const u = await sb.from('unit').update({ lifecycle: 'lost' }).eq('id', id);
      if (u.error) throw u.error;
    }
    toast(`${movements.length} item(s) recorded.`);
    TICK.clear();
    await load();
  } catch (err) {
    const msg = err?.message || String(err);
    if (/fetch|network|Failed to fetch/i.test(msg)) {
      await store.enqueue('return_gear', payload, label);
      toast('Connection dropped — held on this phone and sent when the signal returns.');
      TICK.clear(); await load();
    } else { toast(msg, 'error'); }
  } finally {
    btn.disabled = false; btn.textContent = 'Record returns';
  }
}

async function closeOrder() {
  // The database refuses this while anything is outstanding (rule 9, enforced by a trigger). The
  // screen does not duplicate that check — it asks, and reports what comes back.
  const { error } = await sb.from('rental_order')
    .update({ status: 'closed', closed_at: new Date().toISOString() }).eq('id', orderId);
  if (error) { toast(error.message, 'error'); return; }
  toast('Order closed.');
  await load();
}

window.__djn = { reload: load };
</script>
</body>
</html>
