<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team — DJ Network's</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-34" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-08-34" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-08-34">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-08-34">
<link rel="stylesheet" href="tokens.css?v=2026-09-08-34">
<link rel="stylesheet" href="style.css?v=2026-09-08-34">
<script src="vendor/supabase.js?v=2026-09-08-34" defer></script>
<script src="boot.js?v=2026-09-08-34" defer></script>
</head>
<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { savedLine, sb, $, $$, esc, chrome, requireSession, stateBlock, errorBlock, toast, openSheet,
         initOffline, revealActiveTab, loadPermissions, can, cardList, guardedWrite }
  from './app.js?v=2026-09-08-34';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js?v=2026-09-08-34';

$('#chrome').innerHTML = chrome('team.html');
revealActiveTab();
initOffline();

// ---------------------------------------------------------------------------
// THE TEAM SCREEN.
//
// Departments, not a settings matrix (v6 A1 bans "module" and "permissions" as words; Law 14 says
// teach through the closest familiar thing). Each row is a department a person is trusted with —
// Orders, Inventory, Finance — a noun, not a coaching sentence. The nine rows map to the eleven
// database keys underneath; nobody should be asked eleven questions.
//
// The one split kept is money: Finance (view) and Finance (manage) are different keys because
// reading a balance and taking a payment are different jobs.
//
// THIS SCREEN CREATES THE LOGIN (Pass 2). The owner types an email, a name and a password and ticks
// departments — no dashboard, no pasted user id, which is why nobody had been added. The key that
// creates an account never touches this page: the team-create Edge Function holds the service key in
// its server-side secrets and does the work. A key that can create an account can create an admin,
// so the browser holds none of it — the reason is unchanged, only the mechanism moved server-side.
// ---------------------------------------------------------------------------

const CAN_DO = [
  { id: 'jobs',      label: 'Orders',               keys: ['orders.write'] },
  { id: 'van',       label: 'Dispatch and returns', keys: ['sendout.write', 'returns.write'] },
  { id: 'undo',      label: 'Corrections',          keys: ['movement.correct'] },
  { id: 'catalogue', label: 'Inventory',            keys: ['products.write', 'equipment.write'] },
  { id: 'customers', label: 'Customers',            keys: ['customers.write'] },
  { id: 'seemoney',  label: 'Finance (view)',       keys: ['ledger.view'] },
  { id: 'postmoney', label: 'Finance (manage)',     keys: ['ledger.write'] },
  { id: 'reports',   label: 'Reports',              keys: ['numbers.view'] },
  { id: 'team',      label: 'Team administration',  keys: ['admin.team'] },
];

let MEMBERS = [];

requireSession(async () => {
  await loadPermissions();
  if (!can('admin.team')) {
    $('#app').innerHTML = `<h1>Team</h1>` + stateBlock({
      title: 'Team administration only',
      body: 'This account cannot manage the team.',
    });
    return;
  }
  await boot();
});

async function boot() {
  $('#app').innerHTML = `
    <div class="row row--between">
      <div><h1>Team</h1></div>
      <button class="btn btn--primary" id="add" type="button">Add someone</button>
    </div>
      <!-- Rule 18: the receipt lives OUTSIDE the region load() rebuilds. -->
      <div id="saved"></div>
    <div id="warn"></div>
    <div id="list" class="card-list"><div class="skeleton__row"></div></div>
    `;
  $('#add').addEventListener('click', () => openMember(null));
  checkSignupIsClosed();
  await load();
}

// The same warning as Today, because this is the screen the person who can act on it is already
// looking at. Config that lives outside the repo gets forgotten unless the app keeps asking.
async function checkSignupIsClosed() {
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY } });
    if (!r.ok) return;
    const s = await r.json();
    if (s.disable_signup === false) {
      $('#warn').innerHTML = `<div class="note note--bad" style="margin-bottom:8px">
        <strong>Anyone can still create an account on this project.</strong> They would read nothing
        and write nothing — every table checks this list — but people should arrive by invitation
        only. Supabase dashboard → Authentication → Sign In / Providers → Email → turn off
        <em>Allow new users to sign up</em>.</div>`;
    }
  } catch { /* offline: not worth an error on this screen */ }
}

// The cheap durable receipt (§6 law 4). Held in a variable and repainted after every load, because
// load() rebuilds the list and would wipe a line written straight to the DOM — rule 18.
let LAST_SAVED = null;
function paintSaved() { if (LAST_SAVED) savedLine($('#saved'), LAST_SAVED.what, LAST_SAVED.at); }

async function load() {
  try {
    const { data, error } = await sb.from('operator')
      .select('user_id,display_name,permissions,active,note,created_at').order('created_at');
    if (error) throw error;
    MEMBERS = data ?? [];
    render();
  } catch (err) {
    $('#list').className = '';
    $('#list').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
  paintSaved();
}

const held = (perms, m) => m.keys.every(k => perms?.[k] === true);

function render() {
  const admins = MEMBERS.filter(m => m.active && m.permissions?.['admin.team'] === true).length;
  cardList($('#list'), MEMBERS, m => {
    const mods = CAN_DO.filter(x => held(m.permissions, x));
    return {
      title: esc(m.display_name || '(no name)')
           + (m.active ? '' : ' <span class="badge badge--muted">inactive</span>'),
      sub: mods.length
        ? mods.map(x => `<span class="badge">${esc(x.label)}</span>`).join(' ')
        : '<span class="item__meta">no departments yet</span>',
      right: m.permissions?.['admin.team'] === true
        ? '<span class="badge badge--unit">admin</span>' : '',
    };
  }, m => openMember(m));

    // A conditional WARNING, not a heading blurb — the text cut took it out with the prose and
    // left an insertAdjacentHTML of an empty string. It is the only thing standing between the
    // last admin and locking everybody out of the Team screen.
    if (admins === 1) {
      $('#list').insertAdjacentHTML('afterend',
        `<p class="field__hint" style="margin-top:10px">Only one person manages the team — give it
         to someone else before removing it here.</p>`);
  }
}

function openMember(m) {
  const isNew = !m;
  const perms = { ...(m?.permissions ?? {}) };
  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="t-title" tabindex="-1">
      <div class="sheet__head">
        <h2 class="sheet__title" id="t-title">${isNew ? 'Add someone' : esc(m.display_name || 'Member')}</h2>
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
      </div>

      ${isNew ? `<label class="field"><span class="field__label">Email</span>
          <input class="field__input" id="t-email" type="email" inputmode="email" spellcheck="false"
                 autocapitalize="none" placeholder="name@example.com"></label>` : ''}

      <label class="field"><span class="field__label">Name</span>
        <input class="field__input" id="t-name" value="${esc(m?.display_name ?? '')}"></label>

      ${isNew ? `<label class="field"><span class="field__label">Password</span>
          <input class="field__input" id="t-pass" type="text" autocapitalize="none"
                 placeholder="at least 8 characters"></label>` : ''}

      <div class="card card--sunk">
        <strong>What can this person do?</strong>
        ${CAN_DO.map(x => `
          <label class="field field--inline" style="align-items:flex-start;margin-bottom:8px">
            <input type="checkbox" class="t-mod" data-id="${esc(x.id)}" ${held(perms, x) ? 'checked' : ''}>
            <span><strong>${esc(x.label)}</strong></span>
          </label>`).join('')}
      </div>

      ${!isNew ? `<label class="field field--inline">
        <input type="checkbox" id="t-active" ${m.active ? 'checked' : ''}>
        <span>Active — turn off instead of deleting, so their records keep their name.</span></label>` : ''}

      <div class="sheet__foot">
        <button class="btn" data-sheet-close type="button">Cancel</button>
        <button class="btn btn--primary" id="t-save" type="button">${isNew ? 'Add them' : 'Save'}</button>
      </div>
    </div>
  </div>`);

  $('#t-save').addEventListener('click', () => guardedWrite($('#t-save'), 'Saving…', async () => {
    const name = $('#t-name').value.trim();
    if (!name) { toast('Name required.', 'error'); return; }

    // Back into the database's own keys. The screen asks nine questions; the policies test eleven.
    const next = {};
    for (const el of $$('.t-mod')) {
      if (!el.checked) continue;
      const mod = CAN_DO.find(x => x.id === el.dataset.id);
      for (const k of mod.keys) next[k] = true;
    }

    try {
      if (isNew) {
        const email = $('#t-email').value.trim();
        const password = $('#t-pass').value;
        if (!email) { toast('Email required.', 'error'); return; }
        if (password.length < 8) { toast('Password of at least 8 characters.', 'error'); return; }
        // The one place a login is created. The service key lives in the function, never here — see
        // the header. The caller's token is sent for the function to verify; a user id is never sent.
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(`${SUPABASE_URL}/functions/v1/team-create`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY,
                     Authorization: `Bearer ${session?.access_token ?? ''}` },
          body: JSON.stringify({ email, name, permissions: next, password }),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok || out.error) { toast(out.error || 'Could not add them.', 'error'); return; }
        LAST_SAVED = { what: `Added ${name}`, at: new Date() };
        toast('Added.');
      } else {
        const { error } = await sb.rpc('fn_team_set_permissions', {
          p_user_id: m.user_id, p_permissions: next,
          p_display_name: name, p_active: $('#t-active').checked,
        });
        if (error) throw error;
        LAST_SAVED = { what: 'Saved', at: new Date() };
        toast('Saved.');
      }
      sheet.close();
      await load();
    } catch (err) {
      // 0021's and 0023's refusals are written to be read by a person — the last-admin guard in
      // particular. Show them as they are rather than replacing them with something vaguer.
      toast(err?.message || 'Could not save that.', 'error');
    }
  }));
}
</script>
</body>
</html>
