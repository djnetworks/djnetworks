<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJ Network's — Rental System</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-30" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-08-30" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-08-30">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-08-30">
<!-- tokens.css first: it defines every custom property style.css then reads. Two <link>s and
     not an @import, because an @import inside style.css would serialise the two fetches. -->
<link rel="stylesheet" href="tokens.css?v=2026-09-08-30">
<link rel="stylesheet" href="style.css?v=2026-09-08-30">
<!-- Vendored, not a CDN. Classic + defer, so it executes before the deferred module
     below that needs window.supabase. -->
<script src="vendor/supabase.js?v=2026-09-08-30" defer></script>
<script src="boot.js?v=2026-09-08-30" defer></script>
</head>
<body>
<div id="chrome"></div>
<!-- The waiting state is in the HTML, not painted by JavaScript, because the JavaScript is what
     we are waiting for. See boot.js: with the CDN unreachable this page used to be a blank grey
     rectangle for ever, and on a slow link it was blank for three seconds every time. -->
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>

<script type="module">
import { sb, $, $$, esc, isVanOnly, chrome, requireSession, stateBlock, errorBlock, fmtDate, todayLocal,
         initOffline, revealActiveTab, jobLine, waLink, waMessage, loadPermissions, can }
  from './app.js?v=2026-09-08-30';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js?v=2026-09-08-30';

$('#chrome').innerHTML = chrome('index.html');
revealActiveTab();
initOffline();

// ---------------------------------------------------------------------------
// IS THE FRONT DOOR SHUT?
//
// Invite-only is half a migration and half a project setting, and the setting is the half that
// lives outside this repo — it cannot be turned on from SQL, so it cannot be turned on by a
// migration, so it is exactly the kind of thing that gets meant and never done.
//
// 0021 already makes a self-registered stranger harmless: no operator row means fn_is_operator()
// is false, which means zero rows from every table and a refusal on every write. That is the real
// protection and it is measured. This is the second lock, and the app nags for it rather than
// assuming somebody remembered — shown only to whoever manages the team, because they are the only
// person who can act on it.
// ---------------------------------------------------------------------------
async function checkSignupIsClosed() {
  if (!can('admin.team')) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY } });
    if (!r.ok) return;
    const s = await r.json();
    if (s.disable_signup === false) {
      // ONE LINE here. The full instruction lives on the Team screen, which is where the person
      // reading this goes to act on it — seven lines of it at the top of Today pushed the day's
      // work below the fold every morning, which is the opposite of what this pass is for.
      const el = document.createElement('div');
      el.className = 'note note--bad';
      el.style.margin = '0 0 8px';
      el.innerHTML = 'Anyone can still create an account on this project. '
        + '<a href="team.html">Shut the front door</a>.';
      $('#app')?.prepend(el);
    }
  } catch { /* offline, or the settings endpoint is unreachable: not worth an error */ }
}

/**
 * Two buttons, filling the screen, in the words chachu uses. No nav bar, no counts, no reports —
 * the four departments behind them hold nothing this person may open.
 *
 * The words are the labels he says out loud, not the screen names: gear goes OUT and gear COMES
 * BACK. The icon is doing as much work as the text, because this has to be usable by somebody who
 * does not read English easily.
 */
function renderVanScreen() {
  document.querySelector('#nav-host')?.replaceChildren();
  document.querySelector('#dept-host')?.replaceChildren();
  $('#app').innerHTML = `
    <div class="vanhome">
      <a class="vanhome__btn" href="dispatch.html">
        <span class="vanhome__icon" aria-hidden="true">\u2191</span>
        <span class="vanhome__label">Load gear out</span>
      </a>
      <a class="vanhome__btn vanhome__btn--in" href="return.html">
        <span class="vanhome__icon" aria-hidden="true">\u2193</span>
        <span class="vanhome__label">Gear came back</span>
      </a>
    </div>`;
}

// ---------------------------------------------------------------------------
// TODAY.
//
// The app is organised by entity — products, pieces, orders, customers — because that is how the
// data is shaped. His day is organised by DATE. He does not wake up wondering how many speakers he
// owns; he wakes up needing to know what goes out this morning, what comes back tonight, and what
// should already be back and is not.
//
// So the three date sections lead and the counts follow. The counts were never wrong, they were
// just answering a question nobody asks at 7am.
//
// Every job is named the way he names one: DATE · PERSON · VENUE, with the order number demoted to
// the reference line — see jobLine() in app.js.
// ---------------------------------------------------------------------------

requireSession(async () => {
  await loadPermissions();

  // THE VAN SCREEN. Somebody whose whole job is sending gear out and taking it back gets two
  // buttons and no navigation — four of the five departments are empty for him, and a bar of empty
  // rooms is worse than no bar. Same eleven permissions every policy tests; see isVanOnly().
  if (isVanOnly()) { renderVanScreen(); return; }

  const app = $('#app');
  app.innerHTML = `<h1>Home</h1>
    <p class="sub" id="sub">${esc(fmtDate(todayLocal()))}</p>
    <div id="day">
      <div class="skeleton"><div class="skeleton__row"></div><div class="skeleton__row"></div></div>
    </div>
    <div id="summary" class="stats stats--count" hidden></div>
    <div id="extra"></div>
    <div class="row" style="margin-top:18px">
      <a class="btn btn--primary" href="ask.html">Availability</a>
      <a class="btn" href="products.html">Products</a>
      <a class="btn" href="units.html">Equipment</a>
    </div>`;

  try {
    const today = todayLocal();
    const [{ data: fulfil, error: e1 }, { data: outstanding, error: e2 },
           { data: stock, error: e3 }, { data: orders, error: e4 }] =
      await Promise.all([
        sb.from('v_order_fulfilment')
          .select('order_id,order_no,fulfilment_state,qty_undispatched,qty_outstanding,order_status'),
        sb.from('v_order_outstanding')
          .select('order_id,order_no,short_code,piece_no,qty_outstanding,days_overdue,expected_return_date'),
        sb.from('v_product_stock')
          .select('product_id,tracking_mode,units_active,units_on_hand,units_out,units_at_repair'),
        sb.from('rental_order')
          .select('id,order_no,out_date,expected_return_date,days,venue_name,status,customer:customer_id(name,business_name,whatsapp)')
          .neq('status', 'cancelled'),
      ]);
    if (e1 || e2 || e3 || e4) throw (e1 || e2 || e3 || e4);

    const ORD = new Map((orders ?? []).map(o => [o.id, o]));
    const F = new Map((fulfil ?? []).map(f => [f.order_id, f]));
    const live = (orders ?? []).filter(o => o.status === 'confirmed');

    // ---- the three questions of a day -------------------------------------
    // Each is a DATE test against a QUANTITY from the view. Never a status label: an order is not
    // "coming back today" because somebody typed that, it is coming back today because something
    // of it is still at a customer and the date it was promised for is today (rule 2).
    const going = live
      .filter(o => o.out_date <= today && (F.get(o.id)?.qty_undispatched ?? 0) > 0)
      .sort((a, b) => a.out_date.localeCompare(b.out_date));
    const backToday = live
      .filter(o => o.expected_return_date === today && (F.get(o.id)?.qty_outstanding ?? 0) > 0);
    const lateOrders = live
      .filter(o => o.expected_return_date < today && (F.get(o.id)?.qty_outstanding ?? 0) > 0)
      .sort((a, b) => a.expected_return_date.localeCompare(b.expected_return_date));

    // What is late, per job, so a row can say WHAT is missing and not just that something is.
    const missing = new Map();
    for (const r of outstanding ?? []) {
      const list = missing.get(r.order_id) ?? [];
      list.push(r.piece_no ? `${r.short_code} piece ${r.piece_no}` : `${r.qty_outstanding} × ${r.short_code}`);
      missing.set(r.order_id, list);
    }

    // ONE style attribute. This emitted two when `tone` was set, and the HTML parser keeps the
    // first and discards the rest — so "Going out today" and "Late", the two sections that carry a
    // tone, silently lost their margin-bottom and ran into whatever followed. Only the untoned
    // section was spaced. Measured: margin-bottom 0px, 10px, 0px down the three sections.
    const section = (title, tone, rows, empty, render) => rows.length
      ? `<section style="margin-bottom:10px${tone ? `;border-left:3px solid var(--${tone});padding-left:8px` : ''}">
           <h2>${esc(title)} <span class="badge">${rows.length}</span></h2>
           <div class="card-list">${rows.map(render).join('')}</div>
         </section>`
      : `<section style="margin-bottom:10px"><h2>${esc(title)}</h2>
           <p class="field__hint" style="margin:0">${esc(empty)}</p></section>`;

    // The card shape, so a job on Today looks like a job everywhere else. CUSTOMER + VENUE is the
    // headline; the order number is subtext and tappable to copy, because its job is being pasted
    // into a WhatsApp message. It was inline with the title and wrapped every row to three lines.
    // A DIV, NOT AN ANCHOR. An <a> cannot contain another <a>: the parser closes the outer one and
    // reparents the inner, which is exactly how the "Remind" button ended up rendered as a full
    // width block underneath its own card. The row is a div with a delegated handler and the inline
    // controls are real links inside it — tap rule 1, and the reason it is a rule rather than a
    // habit is that this is the second time the same mistake has been made in this file.
    const row = (o, right, href) => {
      const who = o.customer?.business_name || o.customer?.name || '';
      return `<div class="card-row tappable" data-go="${esc(href)}" role="button" tabindex="0">
        <span class="card-row__main">
          <span class="card-row__title">${esc(who)}${o.venue_name ? ' · ' + esc(o.venue_name) : ''}</span>
          <span class="card-row__sub">${esc(fmtDate(o.out_date))} → ${esc(fmtDate(o.expected_return_date))}
            · ${esc(o.days)} day${o.days === 1 ? '' : 's'}</span>
          <span class="card-row__ref">${esc(o.order_no)}</span>
        </span>
        <span class="card-row__right">${right}</span></div>`;
    };

    $('#day').innerHTML =
      section('Going out today', 'accent', going,
        'Nothing is due to leave today.',
        o => {
          const f = F.get(o.id);
          const overdueOut = o.out_date < today;
          return row(o,
            `<strong>${esc(f.qty_undispatched)} to load</strong>${
              overdueOut ? `<span style="display:block;color:var(--bad)">was due ${esc(fmtDate(o.out_date))}</span>` : ''}`,
            `dispatch.html?order=${esc(o.id)}`);
        })
      + section('Coming back today', 'accent', backToday,
        'Nothing is due back today.',
        o => row(o, `<strong>${esc(F.get(o.id).qty_outstanding)} out</strong>`,
                 `return.html?order=${esc(o.id)}`))
      + section('Late', 'bad', lateOrders,
        'Nothing is late. Everything that went out is either back or due later.',
        o => {
          const days = Math.round((new Date(today + 'T00:00:00') - new Date(o.expected_return_date + 'T00:00:00')) / 86400000);
          const all = missing.get(o.id) ?? [];
          const what = all.slice(0, 3).join(', ');
          // ONE TAP TO THE CHASE. The reminder is the only thing he does with this list that is
          // not opening the return screen, and it is the thing he puts off. The link opens a
          // PREFILLED WhatsApp draft — it never sends; the send button stays his.
          // A div, not an <a>, because a row that is itself a link cannot contain a second one.
          const msg = waMessage('overdue', { order: o, missing: all, daysLate: days });
          const who = o.customer?.business_name || o.customer?.name || '';
          return `<div class="card-row tappable" data-go="return.html?order=${esc(o.id)}"
                       role="button" tabindex="0">
            <span class="card-row__main">
              <span class="card-row__title">${esc(who)}${o.venue_name ? ' · ' + esc(o.venue_name) : ''}</span>
              <span class="card-row__sub">${esc(what)}${all.length > 3 ? ' …' : ''} · due ${esc(fmtDate(o.expected_return_date))}</span>
              <span class="card-row__ref">${esc(o.order_no)}</span>
            </span>
            <span class="card-row__right">
              <!-- Never a bare number beside "late": one screen meant days and the other meant
                   items, on the same order. Both facts, both named. -->
              <span class="badge badge--late">${esc(days)} day${days === 1 ? '' : 's'} overdue</span>
              <span class="item__meta">${esc(all.length)} item${all.length === 1 ? '' : 's'} still out</span>
              <a class="card-action btn--wa" target="_blank" rel="noopener"
                 href="${esc(waLink(o.customer?.whatsapp, msg))}">Remind</a>
            </span>
          </div>`;
        });

    // ---- the counts, now secondary ----------------------------------------
    const rows = stock ?? [];
    // Rule 13, arriving through the front end. v_product_stock keeps one set of column names
    // across all three modes: units_on_hand is boxes for `unit`, cables for `pool` and litres for
    // `consumable`. Adding them buried 40 speakers under 200 XLR cables, and a consumable's
    // units_out is cumulative — fog fluid burned in March still reported as out with a customer.
    const sum = (list, col) => list.reduce((n, r) => n + (r[col] ?? 0), 0);
    const unitRows = rows.filter(r => r.tracking_mode === 'unit');
    const poolRows = rows.filter(r => r.tracking_mode === 'pool');
    const consRows = rows.filter(r => r.tracking_mode === 'consumable');
    const pieces = sum(unitRows, 'units_active');

    if (!fulfil?.length && !rows.length) {
      $('#day').innerHTML = stateBlock({
        icon: '📦', title: 'Nothing in the system yet',
        body: 'No products, no pieces, no orders. Start with the product master — everything else hangs off it.',
        actionLabel: 'Add the first product', actionId: 'go-products',
      });
      $('#go-products')?.addEventListener('click', () => location.href = 'products.html?new=1');
      return;
    }

    // EVERY TILE IS A QUESTION THAT ALREADY HAS AN ANSWER SCREEN. They were four numbers you
    // could read and not act on — the count said 5 out and the only way to see WHICH five was to
    // go to Equipment and pick a product. Each now lands on exactly those rows.
    const s = $('#summary');
    s.hidden = false;
    s.innerHTML = [
      ['On the shelf', sum(unitRows, 'units_on_hand'), '', 'units.html'],
      ['Out with customers', sum(unitRows, 'units_out'), '', 'units.html?status=out'],
      ['At a repair shop', sum(unitRows, 'units_at_repair'), '', 'units.html?status=at_repair'],
      ['Late jobs', lateOrders.length, lateOrders.length ? 'bad' : '', 'orders.html?filter=late'],
    ].map(([label, n, tone, href]) => `
      <a class="card tappable" href="${href}" style="text-decoration:none;color:inherit">
        <div class="item__meta">${esc(label)}</div>
        <div class="stat__n${tone === 'bad' ? ' stat__n--bad' : ''}">${n}</div>
      </a>`).join('');

    // RULE 13. The four tiles above sum unitRows ONLY — v_product_stock keeps one set of column
    // names across all three modes, and adding them buried 40 speakers under 200 XLR cables. So the
    // tiles are numbered pieces, and this line is the counted stock they exclude. The text cut
    // deleted it and left poolRows/consRows computed and referenced nowhere: the cables vanished
    // off Home without the screen admitting it.
    let html = `<p class="field__hint" style="margin:-6px 0 14px">Numbered pieces.`;
    if (poolRows.length || consRows.length) {
      const poolOn = sum(poolRows, 'units_on_hand');
      const consOn = sum(consRows, 'units_on_hand');
      html += ` Counted stock is separate: ${poolOn} on the shelf`
            + (consRows.length ? ` · ${consOn} used-up items in stock` : '') + '.';
    }
    html += `</p>`;

    // The day-two state: products entered on the laptop, no boxes numbered yet.
    if (unitRows.length && pieces === 0) {
      html += `<div class="card">
        <h2 style="font-size:16px;margin:0 0 6px">No pieces yet</h2>
        <p class="field__hint" style="margin:0 0 12px">${unitRows.length} product${unitRows.length === 1 ? ' is' : 's are'}
          tracked as numbered pieces, but no boxes have been created. Adding them in bulk numbers them in one go.</p>
        <a class="btn btn--primary" href="units.html">Add pieces</a>
      </div>`;
    }
    $('#extra').innerHTML = html;
    $('#sub').textContent = `${fmtDate(today)} · ${going.length} to load, ${backToday.length} due back, ${lateOrders.length} late`;
    checkSignupIsClosed();
    // TAP RULE 1, on the rows Today builds itself: the card is a link, so an inline control has to
    // both stop the event and prevent the navigation, or copying the reference opens the return
    // screen instead.
    $('#day').addEventListener('click', async (e) => {
      // An inline control handles itself and the card does not also fire.
      // The order number is SUBTEXT now, not a control, so a tap on it must open the job like a
      // tap anywhere else in the row. The copy handler that used to sit here called
      // preventDefault() and swallowed that tap — with data-copy gone it would have swallowed it
      // and copied nothing.
      if (e.target.closest('.card-action')) return;      // Remind: let the link do its own thing
      const card = e.target.closest('.card-row[data-go]');
      if (card) location.href = card.dataset.go;
    });
    $('#day').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.card-row[data-go]');
      if (card && !e.target.closest('.card-action')) { e.preventDefault(); location.href = card.dataset.go; }
    });
  } catch (err) {
    $('#day').innerHTML = errorBlock(err, 'retry-home');
    $('#retry-home')?.addEventListener('click', () => location.reload());
  }
});
</script>
</body>
</html>
