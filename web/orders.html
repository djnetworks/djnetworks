<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders — DJ Network's</title>
<link rel="icon" href="assets/djn-icon-32.png?v=2026-09-08-34" sizes="32x32">
<link rel="icon" href="assets/djn-icon-64.png?v=2026-09-08-34" sizes="64x64">
<link rel="apple-touch-icon" href="assets/djn-apple-touch-icon.png?v=2026-09-08-34">
<meta name="theme-color" content="#2B7379">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-08-34">
<!-- tokens.css first: it defines every custom property style.css then reads. Two <link>s and
     not an @import, because an @import inside style.css would serialise the two fetches. -->
<link rel="stylesheet" href="tokens.css?v=2026-09-08-34">
<link rel="stylesheet" href="style.css?v=2026-09-08-34">
<script src="vendor/supabase.js?v=2026-09-08-34" defer></script>
<script src="boot.js?v=2026-09-08-34" defer></script>
</head>
<body>
<div id="chrome"></div>
<main id="gate">
  <div class="signin" data-djn-boot>
    <h1 class="signin__title"><span class="wordmark wordmark--lg"><span class="wordmark__dot" aria-hidden="true"></span><span class="wordmark__name"><span class="wordmark__lead">DJ</span> <span class="wordmark__rest">Network’s</span></span></span></h1>
    <p class="signin__sub">Starting up…</p>
  </div>
</main>
<main id="app" class="wrap" hidden></main>
<div id="sheet-host"></div>

<script type="module">
import { savedLine, icon, sb, $, $$, esc, money, fmtDate, todayLocal, chrome, requireSession, stateBlock, errorBlock, toast,
         openSheet, focusField, initOffline, revealActiveTab, fulfilLabel, orderState, rememberFilters,
         waLink, waMessage,
         customerPicker, cardList, loadPermissions, guardedWrite }
  from './app.js?v=2026-09-08-34';

$('#chrome').innerHTML = chrome('orders.html');
revealActiveTab();
initOffline();

let ORDERS = [], CUSTOMERS = [], PRODUCTS = [], FULFIL = new Map(), TIERS = [], SETTINGS = {};
let LATE_ONLY = false;
let POSTED = new Map();   // order_id -> net posted charge

requireSession(async () => { await boot(); });

async function boot() {
  $('#app').innerHTML = `
    <div class="row row--between">
      <div><h1>Orders</h1><p class="sub" id="count-line"></p></div>
      <button class="btn btn--primary" id="new-order">New order</button>
    </div>
      <!-- Rule 18: the receipt lives OUTSIDE the region load() rebuilds. -->
      <div id="saved"></div>
    <div class="row" id="filters" hidden>
      <!-- A placeholder is not a label: it disappears the moment anything is typed, and a screen
           reader announces an unnamed edit box. Same for the filter, which had no name at all. -->
      <label class="sr-only" for="q">Search orders</label>
      <input class="field__input grow" id="q" type="search" placeholder="Search order number, customer or venue…"
             autocapitalize="none" spellcheck="false">
      <label class="sr-only" for="f-state">Filter by what has gone out</label>
      <select class="field__select" id="f-state" style="max-width:150px">
        <option value="">All</option>
        <option value="live">Live (not closed or cancelled)</option>
        <option value="nothing_dispatched">Nothing sent yet</option>
        <option value="part_dispatched">Part sent</option>
        <option value="fully_out">All sent, none back</option>
        <option value="part_returned">Part back</option>
        <option value="all_returned">All back</option>
      </select>
    </div>
    <!-- A filter that came in on the URL has to SAY SO. ?filter=late arrives from Today's "Late
         jobs" tile, hid five of six orders, and left the dropdown reading "All" — a screen in a
         state it does not admit to, with no way out but editing the address bar. Same shape of
         note units.html shows for ?status=out. -->
    <div id="late-note" hidden></div>
    <div id="list" class="skeleton"><div class="skeleton__row"></div><div class="skeleton__row"></div></div>`;
  $('#new-order').addEventListener('click', () => openOrder(null));

  $('#q').addEventListener('input', renderList);
  $('#f-state').addEventListener('change', renderList);
  // v6 Law 11: the search box and the state filter survive a reload and a trip into an order.
  // sessionStorage, so they do NOT survive tomorrow morning — see rememberFilters in app.js.
  rememberFilters('orders', { q: $('#q'), state: $('#f-state') });
  // Landed on from Today's "Late jobs" tile. A tile that is a query has to arrive AS that query.
  LATE_ONLY = new URLSearchParams(location.search).get('filter') === 'late';
  await load();

  // Handed over from ask.html: dates and a basket, never a customer and never a saved row. The
  // enquiry screen deliberately writes nothing, so everything it learned arrives in the URL and
  // this is still the only place an order is created.
  //
  // AFTER load(), not before: the prefilled lines regenerate their rate from PRODUCTS, and PRODUCTS
  // is what load() fetches. Seeded before it, every line would have arrived priced at zero.
  const q = new URLSearchParams(location.search);
  if (q.get('new') === '1') {
    const want = (q.get('want') || '').split(',').filter(Boolean)
      .map(pair => { const [id, n] = pair.split(':'); return { id, n: Math.max(1, Number(n) || 1) }; })
      .filter(w => PRODUCTS.some(p => p.id === w.id));
    // Strip the parameters before opening, so a refresh or the back button cannot re-seed a second
    // order from the same basket.
    history.replaceState(null, '', location.pathname);
    await openOrder(null, { from: q.get('from'), to: q.get('to'), want });
  }
}

// The cheap durable receipt (§6 law 4). Held in a variable and repainted after every load, because
// load() rebuilds the list and would wipe a line written straight to the DOM — rule 18.
let LAST_SAVED = null;
function paintSaved() { if (LAST_SAVED) savedLine($('#saved'), LAST_SAVED.what, LAST_SAVED.at); }

async function load() {
  try {
    const [ords, custs, prods, ful, tiers, settings, ledger] = await Promise.all([
      sb.from('rental_order').select('*').order('out_date', { ascending: false }),
      sb.from('customer').select('id,name,business_name,whatsapp,alt_phone,city,type').eq('active', true).order('name'),
      sb.from('product').select('id,short_code,brand,model_name,tracking_mode,base_rate_per_day,rentable,active')
        .eq('active', true).order('short_code'),
      sb.from('v_order_fulfilment').select('*'),
      sb.from('discount_tier').select('*').order('min_days'),
      sb.from('app_setting').select('key,value'),
      sb.from('ledger_entry').select('order_id,type,amount'),
    ]);
    for (const r of [ords, custs, prods, ful, tiers, settings, ledger]) if (r.error) throw r.error;
    ORDERS = ords.data ?? []; CUSTOMERS = custs.data ?? []; PRODUCTS = prods.data ?? [];
    TIERS = tiers.data ?? [];
    FULFIL = new Map((ful.data ?? []).map(f => [f.order_id, f]));
    SETTINGS = Object.fromEntries((settings.data ?? []).map(s => [s.key, s.value]));

    // Net posted charge per order, computed the same way fn_order_net_posted_charge does, so the
    // screen can warn BEFORE a save that 0009 will refuse rather than after.
    POSTED = new Map();
    const BILLED = ['rental', 'transport', 'labour', 'misc', 'damage'];
    for (const e of (ledger.data ?? [])) {
      if (!e.order_id) continue;
      const delta = BILLED.includes(e.type) ? Number(e.amount)
                  : e.type === 'reversal' ? -Number(e.amount) : 0;
      POSTED.set(e.order_id, (POSTED.get(e.order_id) ?? 0) + delta);
    }
    renderList();
    openFromUrl();
  } catch (err) {
    $('#list').className = '';
    $('#list').innerHTML = errorBlock(err, 'retry');
    $('#retry')?.addEventListener('click', load);
  }
  paintSaved();
}

// ---------------------------------------------------------------------------
// Day counting. The convention lives in app_setting, never in this file — it changes the price of
// every job, and docs/decisions.md records that it is still UNCONFIRMED with the owner.
// ---------------------------------------------------------------------------
function dayCount(outDate, retDate) {
  if (!outDate || !retDate) return null;
  const a = new Date(outDate + 'T00:00:00'), b = new Date(retDate + 'T00:00:00');
  if (b < a) return null;
  const span = Math.round((b - a) / 86400000);
  return SETTINGS.day_count_mode === 'inclusive_both_ends' ? span + 1 : Math.max(span, 1);
}
const dayCountLabel = () => SETTINGS.day_count_mode === 'inclusive_both_ends'
  ? 'Both ends count: out on the 2nd, back on the 4th is 3 days.'
  : `Day count mode: ${SETTINGS.day_count_mode ?? 'unset'}.`;

function suggestDiscount(days) {
  const t = TIERS.find(x => days >= x.min_days && (x.max_days === null || days <= x.max_days));
  return t ? Number(t.discount_pct) : 0;
}
// Every tier is currently 0.00 — placeholders from an earlier planning document, not from the
// owner (docs/open-questions.md item 5). Saying "0% suggested" as though it were a decision would
// be inventing one, so the screen says the ladder is unset instead.
const ladderIsPlaceholder = () => TIERS.length > 0 && TIERS.every(t => Number(t.discount_pct) === 0);

function renderList() {
  const list = $('#list');
  if (!ORDERS.length) {
    $('#filters').hidden = true;
    $('#count-line').textContent = 'No orders yet.';
    list.className = '';
    list.innerHTML = stateBlock({
      glyph: icon('jobs'),
      title: 'No orders yet',
      body: CUSTOMERS.length
        ? 'An order exists once a job is agreed — there is no quote stage. Create one and the pieces get allocated later, when the van is loaded.'
        : 'There are no customers yet either, and an order needs one. Add a customer first.',
      actionLabel: CUSTOMERS.length ? 'Create the first order' : '', actionId: 'empty-new',
    });
    $('#empty-new')?.addEventListener('click', () => openOrder(null));
    return;
  }
  $('#filters').hidden = false;
  const lateNote = $('#late-note');
  lateNote.hidden = !LATE_ONLY;
  if (LATE_ONLY) {
    lateNote.className = 'note';
    lateNote.style.marginBottom = '8px';
    lateNote.innerHTML = `Showing only jobs with something still out past the day it was promised.
      <button class="btn btn--sm" id="clear-late" type="button">Show all orders</button>`;
    $('#clear-late').addEventListener('click', clearLate);
  }
  const q = ($('#q').value || '').trim().toLowerCase();
  const st = $('#f-state').value;
  const rows = ORDERS.filter(o => {
    const f = FULFIL.get(o.id);
    if (st === 'live' && ['closed', 'cancelled'].includes(o.status)) return false;
    if (st && st !== 'live' && f?.fulfilment_state !== st) return false;
    // Late is not a stored state: it is something still at a customer past the day it was promised
    // (rule 2 — never inferred the other way, from a date alone).
    if (LATE_ONLY && !(f && f.qty_outstanding > 0 && o.expected_return_date < todayLocal())) return false;
    if (!q) return true;
    const cust = CUSTOMERS.find(c => c.id === o.customer_id);
    return [o.order_no, o.venue_name, cust?.name, cust?.business_name]
      .some(v => (v || '').toLowerCase().includes(q));
  });
  // The day-count convention was appended here and read on every visit to a screen that is not
  // about it. It is still stated where days are actually entered — line 466, in the order sheet,
  // beside the field it governs.
  $('#count-line').textContent = `${rows.length} of ${ORDERS.length} order${ORDERS.length === 1 ? '' : 's'}`;

  if (!rows.length) {
    list.className = '';
    list.innerHTML = stateBlock({
      glyph: icon('search'), title: 'No order matches that',
      body: `Nothing matches this filter. There are ${ORDERS.length} orders in total.`,
      actionLabel: 'Clear the filters', actionId: 'clear',
    });
    // LATE_ONLY is a filter too. It was left out here, so "Clear the filters" cleared the two
    // visible ones and left the invisible one on — the empty state cleared itself and stayed empty.
    $('#clear').addEventListener('click', () => {
      $('#q').value = ''; $('#f-state').value = '';
      if (LATE_ONLY) clearLate(); else renderList();
    });
    return;
  }

  // CUSTOMER + WHAT first, the order number DEMOTED to subtext and tappable to copy — its real
  // job is being pasted into a WhatsApp message, which is why it is not deleted and also not the
  // headline. The status badge, the fulfilment label and the charge-posted marker were three
  // badges on every row answering questions nobody arrives with; what survives is what is late
  // and what is still out.
  cardList(list, rows, o => {
    const f = FULFIL.get(o.id);
    const cust = CUSTOMERS.find(c => c.id === o.customer_id);
    const late = f && f.qty_outstanding > 0
      && o.expected_return_date < todayLocal();
      // v6 Law 15: the badge names what is happening and what is next, not the enum value.
      const state = orderState(o, f, todayLocal());
    return {
      title: esc(cust?.business_name || cust?.name || 'unknown customer')
           + (o.venue_name ? ` <span class="card-row__sub">· ${esc(o.venue_name)}</span>` : ''),
      sub: `${esc(fmtDate(o.out_date))} → ${esc(fmtDate(o.expected_return_date))} · ${esc(o.days)} day${o.days === 1 ? '' : 's'}`
         + ` · <span class="badge badge--${esc(state.tone)}">${esc(state.text)}</span>`,
      ref: o.order_no,
      right: !f ? ''
        : late ? `<span class="badge badge--late">${esc(daysOverdue(o))} day${daysOverdue(o) === 1 ? '' : 's'} overdue</span>
                  <span class="item__meta">${esc(f.qty_outstanding)} item${f.qty_outstanding === 1 ? '' : 's'} still out</span>`
        : f.qty_outstanding > 0 ? `<strong style="font-size:13px">${esc(f.qty_outstanding)} out</strong>`
        : ['closed', 'cancelled'].includes(o.status) ? '<span class="item__meta">nothing out</span>'
        : f.qty_undispatched > 0 ? `<span class="item__meta">${esc(f.qty_undispatched)} to load</span>`
        : '<span class="item__meta">all back</span>',
    };
  }, o => openOrder(o));
}

/** Drop the late-only filter, and take it out of the URL so a reload does not bring it back. */
function clearLate() {
  LATE_ONLY = false;
  const u = new URL(location.href);
  u.searchParams.delete('filter');
  history.replaceState(null, '', u);
  renderList();
}

// Days past the promised return. Both screens now say the same two facts in the same words, so
// "late" is never a bare number that could be either.
const daysOverdue = (o) => Math.max(0, Math.round(
  (new Date(todayLocal() + 'T00:00:00') - new Date(o.expected_return_date + 'T00:00:00')) / 86400000));

function setOrderUrl(id) {
  const u = new URL(location.href);
  if (id) u.searchParams.set('order', id); else u.searchParams.delete('order');
  history.replaceState(null, '', u);
}

/** An order id in the URL opens that order. An id that no longer resolves says so rather than
 *  showing the list as though nothing had been asked for. */
function openFromUrl() {
  const wanted = new URLSearchParams(location.search).get('order');
  if (!wanted) return;
  const o = ORDERS.find(x => x.id === wanted);
  if (o) openOrder(o);
  else { setOrderUrl(null); toast('That order was not found. It may have been opened on another device.', 'error'); }
}

// ---------------------------------------------------------------------------
// Order editor
// ---------------------------------------------------------------------------

let LINES = [], CHARGES = [], CURRENT = null;
// The chosen customer, module-level for the same reason LINES is: save() is a top-level
// function and cannot see the sheet's own scope.
let PICKED_CUSTOMER = null;
// product_id -> how much of it has ALREADY left the shelf on this order. Empty for a new order.
let SENT = new Map();

async function openOrder(o, prefill = null) {
  const isNew = !o;
  CURRENT = o;
  LINES = []; CHARGES = []; SENT = new Map();
  const posted = o ? (POSTED.get(o.id) ?? 0) : 0;
  const frozen = posted !== 0;

  if (o) {
    const [l, c, m] = await Promise.all([
      sb.from('order_line').select('*').eq('order_id', o.id),
      sb.from('order_charge').select('*').eq('order_id', o.id).order('created_at'),
      // What has already gone out on this order, per product. There is no view that answers this
      // — v_order_fulfilment is per ORDER and v_order_outstanding is what is still at the
      // customer, which is a different question once something has come back. The dispatch screen
      // reads the same rows the same way (recordDispatched); this is the only other place.
      //
      // WHY IT IS NEEDED AT ALL: availability was compared against the whole line quantity, so
      // opening an order whose gear has already gone out reported a shortage against boxes that
      // are out ON THIS ORDER. Measured on DJN-2609-0004 (3 SPK-18, all three dispatched, 1 left
      // on the shelf): "asked for 3, 1 available" — and the save refused unless the operator
      // ticked availability_override and typed a reason. Correcting a venue phone number would
      // have written a permanent, audited override recording a same-day turnaround that never
      // happened. Rule 2 in the other direction: those pieces are out because they were
      // dispatched, not because they are unavailable, and a reservation that has been fulfilled
      // reserves nothing. fn_availability's own `remainder` CTE does exactly this arithmetic
      // server-side; this makes the screen agree with it.
      sb.from('movement').select('product_id,unit_id,qty')
        .eq('order_id', o.id).eq('movement_type', 'dispatch'),
    ]);
    if (l.error || c.error || m.error) { toast((l.error || c.error || m.error).message, 'error'); return; }
    LINES = (l.data ?? []).map(x => ({ ...x }));
    CHARGES = (c.data ?? []).map(x => ({ ...x }));
    for (const mv of (m.data ?? [])) {
      // Rule 13: a numbered piece is one row worth one; pooled and consumable stock carries a qty.
      const n = mv.unit_id ? 1 : Number(mv.qty ?? 0);
      SENT.set(mv.product_id, (SENT.get(mv.product_id) ?? 0) + n);
    }
  }

  // todayLocal(), not toISOString(). The latter is UTC: before 05:30 IST it names YESTERDAY, so a
  // new order opened at 6am — which is when a job is booked — defaulted its out date to the day
  // before. A rental day is a calendar convention, not a clock one (CLAUDE.md, conventions), and
  // every other screen already used the local helper. Found by reading the date a repeated job
  // arrived with: 7 Sep on the 8th.
  const today = todayLocal();
  const pFrom = prefill?.from || today;
  const pTo = prefill?.to || pFrom;
  o = o ?? {
    order_no: '', customer_id: '', status: 'confirmed', event_type: '', venue_name: '',
    venue_address: '', venue_contact_name: '', venue_contact_phone: '',
    out_date: pFrom, expected_return_date: pTo, days: dayCount(pFrom, pTo) ?? 1,
    deposit_amount: '', availability_override: false, availability_override_reason: '', notes: '',
  };
  // From "Repeat this job": lines already re-priced, and the customer carried over because the
  // whole point is the same decorator booking again.
  if (prefill?.lines?.length) {
    LINES = prefill.lines.map(l => ({ ...l, days: dayCount(pFrom, pTo) ?? l.days }));
    for (const l of LINES) recalcSuggestion(l);
  }
  if (prefill?.customer) o.customer_id = prefill.customer.id;

  if (prefill?.want?.length) {
    // Quantities and products only. Every rate is REGENERATED from the product's current default,
    // exactly as if the product had just been chosen in the dropdown — CLAUDE.md rule 5:
    // order_line.agreed_rate is what was agreed on THIS order, and a number arriving from another
    // screen must never be able to become it without passing through today's rate card.
    const n = dayCount(pFrom, pTo) ?? 1;
    LINES = prefill.want.map(w => {
      const p = PRODUCTS.find(x => x.id === w.id);
      const line = {
        product_id: w.id, qty: w.n, days: n,
        base_rate: Number(p?.base_rate_per_day ?? 0),
        discount_pct: suggestDiscount(n),
        agreed_rate: 0, line_total: 0, is_subhired: false,
      };
      recalcSuggestion(line);
      return line;
    });
  }

  const panel = `
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title">${isNew ? 'New order' : esc(o.order_no)}</h2>
      <!-- A visible word, not a glyph. The design bible's language rule: "an unlabelled icon
             asks the user to guess", and for this audience an icon-only control creates a guess
             rather than a confident tap. It no longer needs an aria-label — the text IS the name. -->
        <button class="btn btn--ghost btn--sm" data-sheet-close type="button">Close</button>
    </div>

    ${frozen ? `<div class="note note--warn">
      ${money(posted)} of charges are posted to this customer's ledger against this order. Line money is
      frozen — quantity, rate and product cannot change while a charge stands, or the receivable would
      overstate what is owed. Record a <strong>cancel-a-charge</strong> entry for the amount, edit, then post again.
    </div><div style="height:12px"></div>` : ''}

    <!-- Saving an order that has never been posted DOES post it, and after that 0009 freezes the
         line money until a charge is cancelled. That used to happen in silence: opening
         DJN-2609-0004 to correct a venue phone number and pressing Save put ₹43,060 on Rakesh
         Patel's ledger, and the toast said only "Order saved." A write that size must never be a
         side effect the operator finds out about on the customers screen. -->
    ${!isNew && !frozen ? `<div class="note" id="unposted-note"></div><div style="height:12px"></div>` : ''}

    <div class="grid2">
      <label class="field"><span class="field__label">Order number *</span>
        <input class="field__input" id="f-no" value="${esc(o.order_no)}" ${isNew ? '' : 'readonly'}>
        ${isNew ? '<span class="field__hint" id="no-hint"></span>' : ''}</label>
      <!-- Searchable by NAME OR PHONE NUMBER. He will have the number and not the spelling — see
           customerPicker() in app.js. On a saved order it stays a read-only badge: moving a job to
           a different customer would move its money with it. -->
      <div id="cust-pick"></div>
      <label class="field"><span class="field__label">Out date *</span>
        <input class="field__input" id="f-out" type="date" value="${esc(o.out_date)}"></label>
      <label class="field"><span class="field__label">Expected back *</span>
        <input class="field__input" id="f-ret" type="date" value="${esc(o.expected_return_date)}"></label>
      <label class="field"><span class="field__label">Chargeable days *</span>
        <input class="field__input" id="f-days" type="number" min="1" step="1" inputmode="numeric" value="${esc(o.days)}">
        <span class="field__hint" id="days-hint"></span></label>
      <label class="field"><span class="field__label">Deposit held (₹)</span>
        <input class="field__input" id="f-dep" type="number" min="0" step="0.01" inputmode="decimal"
               value="${esc(o.deposit_amount)}">
        </label>
    </div>

    <div class="grid2">
      <label class="field"><span class="field__label">Event type</span>
        <input class="field__input" id="f-event" value="${esc(o.event_type)}" list="event-types">
        <datalist id="event-types">
          ${['wedding', 'garba', 'corporate', 'dj_night', 'birthday', 'concert', 'religious']
            .map(x => `<option value="${x}">`).join('')}
        </datalist></label>
      <label class="field"><span class="field__label">Venue</span>
        <input class="field__input" id="f-venue" value="${esc(o.venue_name)}"></label>
    </div>
    <label class="field"><span class="field__label">Venue address</span>
      <input class="field__input" id="f-vaddr" value="${esc(o.venue_address)}"></label>
    <div class="grid2">
      <label class="field"><span class="field__label">Who is at the venue</span>
        <input class="field__input" id="f-vcname" value="${esc(o.venue_contact_name)}">
        </label>
      <label class="field"><span class="field__label">Their phone</span>
        <input class="field__input" id="f-vcphone" type="tel" inputmode="tel" value="${esc(o.venue_contact_phone)}"></label>
    </div>

    <div class="card card--sunk">
      <div class="row row--between" style="margin-bottom:8px">
        <strong>Lines</strong>
        <button class="btn btn--sm" id="add-line" type="button" ${frozen ? 'disabled' : ''}>Add a line</button>
      </div>
      
      <div id="repeat-note"></div>
      <div id="lines"></div>
      <div id="avail" style="margin-top:10px"></div>
    </div>

    <div class="card card--sunk">
      <div class="row row--between" style="margin-bottom:8px">
        <strong>Charges</strong>
        <button class="btn btn--sm" id="add-charge" type="button" ${frozen ? 'disabled' : ''}>Add a charge</button>
      </div>
      
      <div id="charges"></div>
    </div>

    <div class="card" id="totals"></div>

    <label class="field"><span class="field__label">Notes</span>
      <textarea class="field__area" id="f-notes">${esc(o.notes)}</textarea></label>

    <!-- v6 LAW 8: at most one primary and two secondary visible; the rest in an overflow, and
         DESTRUCTIVE ALWAYS IN OVERFLOW, never a standing red button.

         This footer had six controls side by side on a confirmed order, one of them a solid red
         "Cancel order" sitting a thumb's width from "Save changes" — in the sheet where the money
         on a job is edited. Cancelling is the single most consequential thing on this screen and it
         was the easiest thing to hit by accident.

         Visible now: Save changes (primary), Send out and Return (the two real next actions).
         Everything else moves behind "More", with the destructive item last and as red TEXT rather
         than a red button.

         Built as <details>, deliberately: no JavaScript, so there is no new handler to break, and
         every existing #id keeps its listener because the buttons are still in the DOM. -->
    <div class="sheet__foot">
      ${o.id ? `<a class="btn" href="dispatch.html?order=${esc(o.id)}">Dispatch</a>
                <a class="btn" href="return.html?order=${esc(o.id)}">Returns</a>
                <details class="overflow">
                  <summary class="btn" aria-label="More actions">More</summary>
                  <div class="overflow__menu">
                    <!-- "Booking confirmed" as a prefilled draft. Built from the SAVED lines, not
                         from what is on screen: a message quoting an edit he has not committed
                         would tell a customer something the database does not say. -->
                    <a class="btn btn--wa" id="wa-confirm" target="_blank" rel="noopener" href="#">Send confirmation</a>
                    <button class="btn" id="repeat-job" type="button">Repeat this job</button>
                    ${o.status === 'confirmed'
                      ? `<button class="btn btn--destructive" id="cancel-order" type="button">Cancel this order</button>` : ''}
                  </div>
                </details>` : ''}
      <button class="btn" data-sheet-close type="button">Close</button>
      <button class="btn btn--primary" id="save">${isNew ? 'Create order' : 'Save changes'}</button>
    </div>`;

  // openSheet expects the full .sheet / .sheet__panel shell and closes on [data-sheet-close].
  // The URL carries the open order so the address bar names what is on screen: an order sent over
  // WhatsApp opens that order, a reload does not throw the operator back to the list, and the
  // overdue list on the home screen has somewhere to link to. Cleared on close, so the back
  // button and a refresh both land somewhere that matches what is showing.
  const sheet = openSheet(`
  <div class="sheet" id="sheet">
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      ${panel}
    </div>
  </div>`, () => setOrderUrl(null));
  setOrderUrl(o.id ?? null);

  if (isNew) {
    const d = new Date();
    const yymm = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0');
    const prefix = (SETTINGS.order_no_prefix ?? 'DJN');
    const seq = String(ORDERS.filter(x => (x.order_no || '').includes(`-${yymm}-`)).length + 1).padStart(4, '0');
    $('#f-no').value = `${prefix}-${yymm}-${seq}`;
    $('#no-hint').textContent = 'Suggested. Appears in every WhatsApp message about this job — edit if you prefer.';
  }

  const syncDays = () => {
    const n = dayCount($('#f-out').value, $('#f-ret').value);
    $('#days-hint').textContent = n === null
      ? 'Back date is before the out date.'
      : `${dayCountLabel()} That gives ${n}.`;
    if (n !== null && !$('#f-days').dataset.touched) $('#f-days').value = n;
    renderLines();
  };
  $('#f-out').addEventListener('change', syncDays);
  $('#f-ret').addEventListener('change', syncDays);
  $('#f-days').addEventListener('input', () => { $('#f-days').dataset.touched = '1'; renderLines(); });
  syncDays();

  // Rebuilt from LINES as they were loaded, so the draft always matches the stored order.
  const waBtn = $('#wa-confirm');
  if (waBtn && CURRENT) {
    const cust = CUSTOMERS.find(c => c.id === CURRENT.customer_id);
    const named = LINES.map(l => ({
      qty: l.qty,
      name: (() => { const p = PRODUCTS.find(x => x.id === l.product_id);
                     return p ? `${p.brand ? p.brand + ' ' : ''}${p.model_name}` : 'item'; })(),
    }));
    waBtn.href = waLink(cust?.whatsapp,
      waMessage('confirmed', { order: { ...CURRENT, customer: cust }, lines: named }));
  }

  $('#repeat-job')?.addEventListener('click', () => repeatJob(o));

  // The confirm dialog is gone the second it is dismissed; the rate movement stays on the screen
  // he is about to quote from.
  if (prefill?.fromOrderNo) {
    $('#repeat-note').innerHTML = prefill.changes?.length
      ? `<div class="note note--warn" style="margin-bottom:10px">
           <strong>Repeated from ${esc(prefill.fromOrderNo)}, re-priced at today's rates.</strong>
           ${prefill.changes.map(c => `<div>${esc(c.code)}: ${esc(money(c.was))} → <strong>${esc(money(c.now))}</strong> per day</div>`).join('')}
           <div class="field__hint" style="margin-top:6px">${esc(prefill.fromOrderNo)} keeps what it was
             charged — a rate is agreed once, on the order it belongs to.</div>
         </div>`
      : `<div class="note" style="margin-bottom:10px">Repeated from ${esc(prefill.fromOrderNo)}.
           Every rate is unchanged since that job.</div>`;
  }

  $('#add-line').addEventListener('click', () => {
    LINES.push({ product_id: '', qty: 1, days: Number($('#f-days').value) || 1,
                 base_rate: 0, discount_pct: 0, agreed_rate: 0, line_total: 0, is_subhired: false });
    renderLines();
  });
  $('#add-charge').addEventListener('click', () => {
    CHARGES.push({ type: 'transport', description: '', amount: 0 });
    renderCharges();
  });
  renderLines(); renderCharges();

  $('#cancel-order')?.addEventListener('click', async () => {
    if (!confirm(`Cancel order ${o.order_no}? It is kept, never deleted — cancelled orders reserve nothing, `
               + `but anything already sent out stays out until it is returned.`)) return;
    const { error } = await sb.from('rental_order').update({ status: 'cancelled' }).eq('id', o.id);
    if (error) { toast(error.message, 'error'); return; }
    LAST_SAVED = { what: `${o.order_no} cancelled`, at: new Date() };
    toast('Order cancelled.'); sheet.close(); await load();
  });

  $('#save').addEventListener('click', () => save(o, isNew, frozen, sheet));
  // The picker paints itself into the sheet and reports back into a plain hidden value, so the
  // save path below is unchanged: it still reads one customer id and nothing else.
  PICKED_CUSTOMER = CUSTOMERS.find(c => c.id === o.customer_id) ?? null;
  if (isNew) {
    customerPicker($('#cust-pick'), CUSTOMERS, PICKED_CUSTOMER,
      c => { PICKED_CUSTOMER = c; }, { required: true, id: 'oc' });
  } else {
    const c = PICKED_CUSTOMER;
    $('#cust-pick').innerHTML = `<div class="field" style="margin-bottom:0">
      <span class="field__label">Customer</span>
      <div>${esc(c ? (c.business_name ? `${c.business_name} — ${c.name}` : c.name) : '—')}</div>
      </div>`;
  }
  if (isNew) focusField('#oc-q');
}

function renderLines() {
  const frozen = CURRENT ? (POSTED.get(CURRENT.id) ?? 0) !== 0 : false;
  const host = $('#lines');
  if (!LINES.length) {
    host.innerHTML = `<p class="field__hint">No lines yet. An order with no lines reserves nothing.</p>`;
    renderTotals(); return;
  }
  host.innerHTML = LINES.map((l, i) => {
    const p = PRODUCTS.find(x => x.id === l.product_id);
    return `<div class="line" data-i="${i}">
      <div class="grid2">
        <label class="field"><span class="field__label">Product</span>
          <select class="field__select l-prod" ${frozen ? 'disabled' : ''}>
            <option value="">Choose…</option>
            ${PRODUCTS.filter(x => x.rentable || x.id === l.product_id).map(x =>
              `<option value="${esc(x.id)}" ${x.id === l.product_id ? 'selected' : ''}>
                ${esc(x.short_code)} — ${esc(x.model_name)}${x.rentable ? '' : ' (not rentable)'}</option>`).join('')}
          </select></label>
        <div class="grid2">
          <label class="field"><span class="field__label">Qty</span>
            <input class="field__input l-qty" type="number" min="1" step="1" inputmode="numeric"
                   value="${esc(l.qty)}" ${frozen ? 'disabled' : ''}></label>
          <label class="field"><span class="field__label">Days</span>
            <input class="field__input l-days" type="number" min="1" step="1" inputmode="numeric"
                   value="${esc(l.days)}" ${frozen ? 'disabled' : ''}></label>
        </div>
      </div>
      <div class="grid2">
        <label class="field"><span class="field__label">Base rate/day</span>
          <input class="field__input l-base" type="number" step="0.01" min="0" inputmode="decimal"
                 value="${esc(l.base_rate)}" ${frozen ? 'disabled' : ''}>
          <span class="field__hint">${p ? 'Product default ' + money(p.base_rate_per_day) : 'Pick a product'}</span></label>
        <label class="field"><span class="field__label">Discount %</span>
          <input class="field__input l-disc" type="number" step="0.01" min="0" max="100" inputmode="decimal"
                 value="${esc(l.discount_pct)}" ${frozen ? 'disabled' : ''}>
          <span class="field__hint l-disc-hint"></span></label>
        <label class="field"><span class="field__label">Agreed rate/day *</span>
          <input class="field__input l-agreed" type="number" step="0.01" min="0" inputmode="decimal"
                 value="${esc(l.agreed_rate)}" ${frozen ? 'disabled' : ''}>
          </label>
        <label class="field"><span class="field__label">Line total *</span>
          <input class="field__input l-total" type="number" step="0.01" min="0" inputmode="decimal"
                 value="${esc(l.line_total)}" ${frozen ? 'disabled' : ''}>
          <span class="field__hint l-total-hint"></span></label>
      </div>
      <div class="row row--between">
        <label class="field field--inline" style="margin:0">
          <input type="checkbox" class="l-sub" ${l.is_subhired ? 'checked' : ''} ${frozen ? 'disabled' : ''}>
          <span>Sub-hired from a vendor</span></label>
        <button class="btn btn--sm l-del" type="button" ${frozen ? 'disabled' : ''}>Remove line</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
    </div>`;
  }).join('');

  $$('.line', host).forEach(el => {
    const i = Number(el.dataset.i);
    const read = () => {
      const l = LINES[i];
      l.product_id = $('.l-prod', el).value;
      l.qty = Number($('.l-qty', el).value) || 1;
      l.days = Number($('.l-days', el).value) || 1;
      l.base_rate = Number($('.l-base', el).value) || 0;
      l.discount_pct = Number($('.l-disc', el).value) || 0;
      l.agreed_rate = Number($('.l-agreed', el).value) || 0;
      l.line_total = Number($('.l-total', el).value) || 0;
      l.is_subhired = $('.l-sub', el).checked;
    };
    $('.l-prod', el).addEventListener('change', () => {
      read();
      const p = PRODUCTS.find(x => x.id === LINES[i].product_id);
      // The product rate SEEDS the line. From here the two are independent for ever: raising the
      // rate next March must not rewrite what was charged last March (rule 5).
      if (p) {
        LINES[i].base_rate = Number(p.base_rate_per_day ?? 0);
        LINES[i].discount_pct = suggestDiscount(LINES[i].days);
        recalcSuggestion(LINES[i]);
      }
      renderLines(); checkAvailability();
    });
    ['.l-qty', '.l-days', '.l-base', '.l-disc'].forEach(sel =>
      $(sel, el).addEventListener('input', () => {
        read(); recalcSuggestion(LINES[i]);
        $('.l-agreed', el).value = LINES[i].agreed_rate;
        $('.l-total', el).value = LINES[i].line_total;
        renderTotals(); hints(el, i);
        // ---------------------------------------------------------------------
        // CHANGING THE QUANTITY MUST RE-ASK. It did not, and that is a double
        // booking with no warning at all — the exact thing docs/decisions.md says
        // this application was built to buy ("refusing a double-booking instead of
        // warning about it").
        //
        // Measured, signed in: add a line for MIC-BLX (4 on the shelf) at qty 1, and
        // the box reads "Everything is available". Change the quantity to 40 and it
        // STILL reads "Everything is available", dataset.short stays empty, and the
        // order saves for forty microphones out of a fleet of four with no override
        // and nothing recorded. Availability was only re-asked on a product change,
        // a date change, a sub-hire toggle or a line delete — never on the one field
        // most likely to be edited after the product is picked.
        //
        // Debounced because this is an RPC per product and it fires on every
        // keystroke: typing "40" is two events, and "1" must not be answered after
        // "40" has been asked. checkAvailability's own availToken already discards
        // stale replies; this just stops three round trips per number.
        // ---------------------------------------------------------------------
        if (sel === '.l-qty') scheduleAvailability();
      }));
    // Editing agreed_rate or line_total by hand wins and is never overwritten afterwards.
    $('.l-agreed', el).addEventListener('input', () => {
      read(); LINES[i].line_total = round2(LINES[i].agreed_rate * LINES[i].qty * LINES[i].days);
      $('.l-total', el).value = LINES[i].line_total; renderTotals(); hints(el, i);
    });
    $('.l-total', el).addEventListener('input', () => { read(); renderTotals(); hints(el, i); });
    $('.l-sub', el).addEventListener('change', () => { read(); checkAvailability(); });
    $('.l-del', el).addEventListener('click', () => { LINES.splice(i, 1); renderLines(); checkAvailability(); });
    hints(el, i);
  });
  renderTotals();
  checkAvailability();
}

const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
function recalcSuggestion(l) {
  l.agreed_rate = round2(l.base_rate * (1 - (l.discount_pct / 100)));
  l.line_total = round2(l.agreed_rate * l.qty * l.days);
}
function hints(el, i) {
  const l = LINES[i];
  const suggested = round2(l.agreed_rate * l.qty * l.days);
  $('.l-total-hint', el).textContent = l.line_total === suggested
    ? `${l.qty} × ${l.days} day(s) × ${money(l.agreed_rate)}`
    : `Overridden. Rate × qty × days would be ${money(suggested)}.`;
  $('.l-disc-hint', el).textContent = ladderIsPlaceholder()
    ? 'The discount ladder is still all zeros — placeholders, not the owner\'s numbers.'
    : `Ladder suggests ${suggestDiscount(l.days)}% for ${l.days} day(s).`;
}

function renderCharges() {
  const frozen = CURRENT ? (POSTED.get(CURRENT.id) ?? 0) !== 0 : false;
  const host = $('#charges');
  if (!CHARGES.length) { host.innerHTML = `<p class="field__hint">No charges.</p>`; renderTotals(); return; }
  host.innerHTML = CHARGES.map((c, i) => `
    <div class="spec-row spec-row--charge" data-i="${i}">
      <select class="field__select c-type" aria-label="Kind of charge" ${frozen ? 'disabled' : ''}>
        ${['transport', 'labour', 'misc', 'damage'].map(t =>
          `<option value="${t}" ${t === c.type ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <input class="field__input c-desc" placeholder="What for?" aria-label="What the charge is for"
             value="${esc(c.description)}" ${frozen ? 'disabled' : ''}>
      <!-- placeholder AND aria-label: below 620px this row stacks and the header row above it is
           gone, so the box was an unlabelled "0" between a type select and a description. -->
      <input class="field__input c-amt" type="number" step="0.01" min="0" inputmode="decimal"
             placeholder="Amount ₹" aria-label="Charge amount in rupees"
             value="${esc(c.amount)}" style="max-width:120px" ${frozen ? 'disabled' : ''}>
      <button class="btn btn--sm c-del" type="button" ${frozen ? 'disabled' : ''}>Remove</button>
    </div>`).join('');
  $$('.spec-row', host).forEach(el => {
    const i = Number(el.dataset.i);
    const read = () => {
      CHARGES[i].type = $('.c-type', el).value;
      CHARGES[i].description = $('.c-desc', el).value;
      CHARGES[i].amount = Number($('.c-amt', el).value) || 0;
    };
    ['.c-type', '.c-desc', '.c-amt'].forEach(s => $(s, el).addEventListener('input', () => { read(); renderTotals(); }));
    $('.c-del', el).addEventListener('click', () => { CHARGES.splice(i, 1); renderCharges(); });
  });
  renderTotals();
}

function renderTotals() {
  const rental = LINES.reduce((n, l) => n + Number(l.line_total || 0), 0);
  const charges = CHARGES.reduce((n, c) => n + Number(c.amount || 0), 0);
  const dep = Number($('#f-dep')?.value || 0);
  // Rule 6: the deposit is the customer's money being held. It is a liability, never revenue, and
  // it is never added into the job total — two numbers, side by side, on every screen.
  $('#totals').innerHTML = `
    <div class="grid2">
      <dl class="kv">
        <dt>Rental</dt><dd>${money(rental)}</dd>
        <dt>Charges</dt><dd>${money(charges)}</dd>
        <dt><strong>Job total</strong></dt><dd><strong>${money(rental + charges)}</strong></dd>
      </dl>
      <dl class="kv">
        <dt>Deposit held</dt><dd>${money(dep)}</dd>
      </dl>
    </div>`;
  paintUnpostedNote(rental + charges);
}

/** What Save is about to do to the ledger, said before it does it rather than after. */
function paintUnpostedNote(total) {
  const box = $('#unposted-note');
  if (!box) return;
  if (!(total > 0)) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `Nothing is posted to this customer's ledger for this order yet.
    <strong>Saving will post ${money(total)}</strong> as ${postState() === 'due' ? 'money due' : 'an upcoming booking'}.
    After that the quantities and rates are frozen until a charge is cancelled on the ledger.`;
}

/**
 * docs/decisions.md: rental charges post on order confirmation as `upcoming` and become `due` at
 * dispatch. An order whose gear has already left is past that transition, so posting it as
 * `upcoming` would tell the customer a job that is out — and on DJN-2609-0004, five days overdue —
 * has not happened yet. The dispatch screen only flips entries that already exist, so an entry
 * posted late in the wrong state would never be corrected by anything.
 */
const postState = () => (SENT.size ? 'due' : 'upcoming');

// ---------------------------------------------------------------------------
// Availability. The database decides; this screen only asks and reports.
// ---------------------------------------------------------------------------
let availToken = 0;
let availTimer;
/** Ask again shortly. Called from the quantity field, which fires per keystroke. */
function scheduleAvailability() {
  const box = $('#avail');
  // Say so immediately, so the previous answer cannot be read as the answer to the new number.
  // Blanking dataset.short at the same moment means a save between keystrokes cannot slip through
  // on a stale "everything is available".
  if (box) { box.dataset.short = ''; box.innerHTML = '<p class="field__hint">Checking availability…</p>'; }
  clearTimeout(availTimer);
  availTimer = setTimeout(checkAvailability, 400);
}
async function checkAvailability() {
  const box = $('#avail');
  if (!box) return;
  const from = $('#f-out')?.value, to = $('#f-ret')?.value;
  const lines = LINES.filter(l => l.product_id && !l.is_subhired);
  if (!from || !to || !lines.length) { box.innerHTML = ''; return; }

  const my = ++availToken;
  box.innerHTML = `<p class="field__hint">Checking availability…</p>`;

  // Aggregated per PRODUCT, not per line, because fn_availability aggregates per order the same
  // way. One order carrying the same product on two lines was asked twice and each answer ignored
  // the other, so 2 + 2 of a product with 3 free read as "available" twice over.
  const wanted = new Map();
  for (const l of lines) wanted.set(l.product_id, (wanted.get(l.product_id) ?? 0) + Number(l.qty || 0));

  const results = [];
  for (const [productId, qty] of wanted) {
    const { data, error } = await sb.rpc('fn_availability', {
      p_product_id: productId, p_from: from, p_to: to,
      p_exclude_order_id: CURRENT?.id ?? null,
    });
    if (my !== availToken) return;                       // a newer check has started
    if (error) { box.innerHTML = `<p class="signin__err">${esc(error.message)}</p>`; return; }
    const row = Array.isArray(data) ? data[0] : data;
    // Availability gates only what still has to come off the shelf. Anything already dispatched
    // on this order is physically gone and cannot be reserved again — see the comment on SENT.
    const sent = SENT.get(productId) ?? 0;
    results.push({ productId, qty, sent, stillToSend: Math.max(qty - sent, 0), ...row });
  }
  if (my !== availToken) return;

  const short = results.filter(r => r.stillToSend > 0 && (r.available ?? 0) < r.stillToSend);
  box.dataset.short = short.length ? '1' : '';

  // This box is re-rendered on every re-check, including the one Save now forces, and the override
  // checkbox and its reason live INSIDE it. Read them back first or a half-typed reason is thrown
  // away every time a quantity changes — and the operator would retype it, or give up and not
  // record the override at all, which defeats the point of having one.
  const keptOverride = $('#f-override') ? $('#f-override').checked : !!CURRENT?.availability_override;
  const keptReason = $('#f-override-reason')
    ? $('#f-override-reason').value
    : (CURRENT?.availability_override_reason ?? '');
  if (!short.length) {
    box.innerHTML = `<p class="field__hint" style="color:var(--ok)">Everything still to go out on this
      order is available for ${esc(fmtDate(from))} → ${esc(fmtDate(to))}.</p>`;
    return;
  }
  box.innerHTML = `<div class="note note--warn">
    <strong>Not enough available.</strong>
    <ul style="margin:8px 0 0;padding-left:20px">
      ${short.map(r => {
        const p = PRODUCTS.find(x => x.id === r.productId);
        return `<li>${esc(p?.short_code ?? '?')}: ${esc(r.stillToSend)} still to go out${
          r.sent ? ` (${esc(r.qty)} ordered, ${esc(r.sent)} already sent out)` : ''},
          ${esc(r.available)} available (${esc(r.units_on_hand)} on hand,
          ${esc(r.committed)} committed to other orders)</li>`;
      }).join('')}
    </ul>
    <label class="field field--inline" style="margin:12px 0 0">
      <input type="checkbox" id="f-override" ${keptOverride ? 'checked' : ''}>
      <span>Override — I know, and I am doing it anyway</span></label>
    <label class="field" style="margin:8px 0 0"><span class="field__label">Why</span>
      <input class="field__input" id="f-override-reason"
             value="${esc(keptReason)}"
             placeholder="e.g. the 4th job returns by 9am, collecting on the way">
      
    </label>
  </div>`;
}

// ---------------------------------------------------------------------------
// Save
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// REPEAT THIS JOB.
//
// Wedding season is the same decorator booking roughly the same package again, and duplicating a
// past job is how he would naturally quote it. Products and quantities carry.
//
// THE RATE DOES NOT. order_line.agreed_rate is what was agreed on THAT order and is never a lookup
// (CLAUDE.md rule 5) — copying it forward would mean every rate rise silently fails to land on
// exactly the customers who book most often, which is the opposite of what a rate rise is for.
// So each line is re-priced from the product's current base rate and today's discount ladder, and
// the screen SAYS what moved, per line, in rupees. A repeat that quietly re-quoted last year is
// worse than no repeat button, because he would trust it.
// ---------------------------------------------------------------------------
function repeatJob(source) {
  const oldLines = LINES.map(l => ({ ...l }));
  const changes = [];
  const fresh = oldLines.map(l => {
    const p = PRODUCTS.find(x => x.id === l.product_id);
    const line = {
      product_id: l.product_id, qty: l.qty, days: l.days,
      base_rate: Number(p?.base_rate_per_day ?? 0),
      discount_pct: suggestDiscount(l.days),
      agreed_rate: 0, line_total: 0, is_subhired: false,
    };
    recalcSuggestion(line);
    if (round2(line.agreed_rate) !== round2(Number(l.agreed_rate))) {
      changes.push({ code: p?.short_code ?? '?', was: Number(l.agreed_rate), now: line.agreed_rate });
    }
    return line;
  });

  const summary = changes.length
    ? 'Rates that have moved since then:\n\n'
      + changes.map(c => `  ${c.code}: ${money(c.was)} → ${money(c.now)} per day`).join('\n')
      + '\n\nThe new order is quoted at today\'s rates. The old order keeps what it was charged.'
    : 'Every rate is the same as it was on that job.';

  if (!confirm(`Repeat ${source.order_no}?\n\n`
    + `${fresh.length} line(s) and their quantities are copied. Dates, venue and the order number `
    + `are not — this is a new job.\n\n${summary}`)) return;

  CURRENT = null;
  const cust = CUSTOMERS.find(c => c.id === source.customer_id) ?? null;
  const today = todayLocal();
  openOrder(null, {
    from: today, to: today,
    lines: fresh, customer: cust, changes,
    fromOrderNo: source.order_no,
  });
}

async function save(o, isNew, frozen, sheet) {
  const btn = $('#save');
  const order = {
    order_no: $('#f-no').value.trim(),
    customer_id: PICKED_CUSTOMER?.id || null,
    out_date: $('#f-out').value || null,
    expected_return_date: $('#f-ret').value || null,
    days: Number($('#f-days').value) || 1,
    deposit_amount: Number($('#f-dep').value) || 0,
    event_type: $('#f-event').value.trim() || null,
    venue_name: $('#f-venue').value.trim() || null,
    venue_address: $('#f-vaddr').value.trim() || null,
    venue_contact_name: $('#f-vcname').value.trim() || null,
    venue_contact_phone: $('#f-vcphone').value.trim() || null,
    notes: $('#f-notes').value.trim() || null,
    availability_override: !!$('#f-override')?.checked,
    availability_override_reason: $('#f-override-reason')?.value.trim() || null,
  };
  if (!order.order_no || !order.customer_id || !order.out_date || !order.expected_return_date) {
    toast('Order number, customer and both dates are needed.', 'error'); return;
  }
  if (new Date(order.expected_return_date) < new Date(order.out_date)) {
    toast('The back date is before the out date.', 'error'); focusField('#f-ret'); return;
  }
  if (LINES.some(l => !l.product_id)) { toast('Every line needs a product.', 'error'); return; }

  // fn_availability gates the save. The override is the documented escape hatch, and it is only an
  // escape hatch if it is recorded — a silent one is just a bug with a checkbox.
  //
  // Asked again here, and awaited, rather than trusting whatever the box happens to say. The
  // quantity field debounces its re-check by 400ms, so a fast "type 40, tap Save" would otherwise
  // be gated on the answer to the previous number. The gate has to read a fresh answer or it is
  // not a gate.
  if (LINES.some(l => l.product_id && !l.is_subhired)) {
    btn.disabled = true; btn.textContent = 'Checking…';
    clearTimeout(availTimer);
    await checkAvailability();
    btn.disabled = false; btn.textContent = isNew ? 'Create order' : 'Save changes';
  }

  if ($('#avail')?.dataset.short === '1') {
    if (!order.availability_override) {
      toast('Not enough available. Tick the override and say why, or change the dates or quantities.', 'error');
      $('#f-override')?.focus(); return;
    }
    if (!order.availability_override_reason) {
      toast('An override has to say why. It is recorded on the order.', 'error');
      focusField('#f-override-reason'); return;
    }
  }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let orderId = o.id;
    if (isNew) {
      // 0013: an order is born `confirmed`. Never posted as closed from a form.
      const res = await sb.from('rental_order').insert({ ...order, status: 'confirmed' }).select().single();
      if (res.error) throw res.error;
      orderId = res.data.id;
    } else {
      const res = await sb.from('rental_order').update(order).eq('id', o.id);
      if (res.error) throw res.error;
    }

    if (!frozen) {
      // Lines are replaced wholesale only while nothing is posted and nothing has moved; 0009
      // refuses the delete otherwise and the error explains itself.
      const existing = await sb.from('order_line').select('id').eq('order_id', orderId);
      if (existing.error) throw existing.error;
      const keep = new Set(LINES.filter(l => l.id).map(l => l.id));
      for (const row of (existing.data ?? [])) {
        if (!keep.has(row.id)) {
          const del = await sb.from('order_line').delete().eq('id', row.id);
          if (del.error) throw del.error;
        }
      }
      for (const l of LINES) {
        const payload = {
          order_id: orderId, product_id: l.product_id, qty: l.qty, days: l.days,
          base_rate: l.base_rate, discount_pct: l.discount_pct,
          agreed_rate: l.agreed_rate, line_total: l.line_total,
          is_subhired: l.is_subhired,
          subhire_vendor_id: l.is_subhired ? (l.subhire_vendor_id ?? null) : null,
        };
        const r = l.id
          ? await sb.from('order_line').update(payload).eq('id', l.id)
          : await sb.from('order_line').insert(payload);
        if (r.error) throw r.error;
      }
      const exC = await sb.from('order_charge').select('id').eq('order_id', orderId);
      if (exC.error) throw exC.error;
      const keepC = new Set(CHARGES.filter(c => c.id).map(c => c.id));
      for (const row of (exC.data ?? [])) {
        if (!keepC.has(row.id)) {
          const del = await sb.from('order_charge').delete().eq('id', row.id);
          if (del.error) throw del.error;
        }
      }
      for (const c of CHARGES) {
        const payload = { order_id: orderId, type: c.type, description: c.description || null, amount: c.amount };
        const r = c.id
          ? await sb.from('order_charge').update(payload).eq('id', c.id)
          : await sb.from('order_charge').insert(payload);
        if (r.error) throw r.error;
      }
    }

    // Revenue posts on confirmation, as `upcoming` — so the receivable is a forward book without
    // telling a wedding customer he owes money three weeks early (docs/decisions.md). Posted once:
    // if a charge already stands against this order, nothing is posted again.
    const already = (POSTED.get(orderId) ?? 0) !== 0;
    let postedNow = 0;
    if (!already) {
      const state = postState();
      const rental = LINES.reduce((n, l) => n + Number(l.line_total || 0), 0);
      const entries = [];
      if (rental > 0) entries.push({
        customer_id: order.customer_id, order_id: orderId, type: 'rental',
        amount: rental, state, notes: `Rental agreed on ${order.order_no}`,
      });
      for (const c of CHARGES) {
        if (Number(c.amount) > 0) entries.push({
          customer_id: order.customer_id, order_id: orderId, type: c.type,
          amount: Number(c.amount), state, notes: c.description || null,
        });
      }
      if (entries.length) {
        const r = await sb.from('ledger_entry').insert(entries);
        if (r.error) throw r.error;
        postedNow = entries.reduce((n, e) => n + Number(e.amount), 0);
      }
    }

    // Never just "Order saved." when money moved. The customer's name is in the message because
    // that is the thing to check if the amount looks wrong.
    const custName = CUSTOMERS.find(c => c.id === order.customer_id);
    LAST_SAVED = { what: `${order.order_no} ${isNew ? 'created' : 'saved'}`, at: new Date() };
    toast(postedNow
      ? `${order.order_no} ${isNew ? 'created' : 'saved'}. ${money(postedNow)} posted to `
        + `${custName?.business_name || custName?.name || 'the customer'}'s ledger as `
        + `${postState() === 'due' ? 'due' : 'upcoming'}.`
      : `${order.order_no} saved.`);
    sheet.close();
    await load();
  } catch (err) {
    btn.disabled = false; btn.textContent = isNew ? 'Create order' : 'Save changes';
    toast(friendly(err), 'error');
  }
}

function friendly(e) {
  const m = e.message || String(e);
  if (m.includes('rental_order_order_no_key')) return 'That order number is already used.';
  if (m.includes('cannot be created already closed')) return m;
  if (m.includes('cannot be repriced or resized') || m.includes('already posted'))
    return 'A charge is posted against this order, so line money is frozen. Cancel that charge on the ledger first.';
  if (m.includes('order_dates_sane')) return 'The back date cannot be before the out date.';
  if (e.code === '42501' || m.includes('row-level security'))
    return 'You are not signed in, or the session expired. Sign in again.';
  return m;
}

window.__djn = { showEmpty() { ORDERS = []; renderList(); }, reload: load };
</script>
